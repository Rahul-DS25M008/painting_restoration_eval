      texture-colour-seam: ["local_consistency_panel", "local_metric_assertion"]
      difference-spatial-diagnostics: ["difference_maps", "signed_improvement_maps", "scale_caption"]
      semantic-structural-evidence: ["semantic_maps", "structural_interpretation"]
      uncertainty-prompt-sensitivity: ["applicable_maps_or_na", "prompt_or_seed_assertion", "nearby_limit"]
      failure-taxonomy-flags: ["triggered_flags", "failure_explanations", "affected_regions"]
      human-review-action: ["recommended_action", "model_specific_strengths_weaknesses"]
      limitations: ["case_limits", "evidence_limits"]
      provenance: ["source_artifacts", "run_ids", "checksums"]
    painting_report:
