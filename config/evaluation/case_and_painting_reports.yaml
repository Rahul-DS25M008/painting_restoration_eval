      failure-review-patterns: ["flag_summary", "review_actions"]
      selected-case-spotlights: ["auditable_spotlight_rules", "visual_case_panels"]
      limitations: ["painting_limits", "cohort_limits"]
      provenance: ["source_artifacts", "run_ids", "checksums"]
