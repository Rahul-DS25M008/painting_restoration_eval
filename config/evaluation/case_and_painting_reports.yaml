    painting_count: 50
    case_count: 410
    approved_candidate_count: 1785
    uncertainty_case_count: 115
    uncertainty_group_count: 165
    selected_case_count: 30
    case_report_count: 30
    painting_report_count: 50
    collection_index_count: 1
    report_count: 81
    selected_case_grid_count: 30
    case_report_index_rows: 30
    painting_report_index_rows: 50
    artifact_records: 8
    physical_output_files: 117
    case_traceability_rows: 33
    painting_traceability_rows: 24
    collection_traceability_rows: 10
    traceability_rows: 67

  evidence_policy:
    creates_new_scientific_evidence: false
    independent_unit: "none_report_presentation_layer"
    nested_structure: "candidates_within_cases_within_paintings"
    presentation_only_transformations:
      - "validated_population_filtering"
      - "deterministic_case_selection"
      - "case_and_painting_grouping"
      - "sorting_and_display_formatting"
      - "display_percentages_from_canonical_counts"
      - "presentation_only_plots_and_web_sized_images"
      - "self_contained_html_assembly"
    prohibited_transformations:
      - "new_metric_computation"
      - "new_statistical_test"
      - "new_post_hoc_exclusion"
      - "new_composite_score"
      - "new_scientific_ranking"
      - "candidate_rows_treated_as_independent_paintings"
      - "style_inference_from_eighteen_documented_paintings"
      - "flag_interpreted_as_expert_ground_truth"
      - "physical_conservation_recommendation"

  known_limitations:
    - "The 30 detailed case reports are deterministically selected illustrations, not the complete case population."
    - "All 410 cases remain summarized across the 50 painting reports."
    - "The approved 1,785-candidate population excludes 480 context-prompt candidates without complete Notebook 27/29 coverage."
    - "Only 18 paintings have documented style or period labels, so painting reports do not support independent style inference."
    - "The five extension paintings support within-painting trajectories and descriptive cross-painting patterns, not category or style inference."
    - "Telea and LaMa are deterministic; uncertainty language is reserved for repeated diffusion candidates."
    - "SDXL remains a ten-case, five-painting partial evaluation with insufficient seed coverage for uncertainty."
    - "Computational flags and recommended actions support human review and are not expert conservation annotations."
    - "Synthetic damage and digital reference fidelity do not establish historical authenticity or physical conservation suitability."
