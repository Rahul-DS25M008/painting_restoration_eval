      selection-audit: ["selection_rule_table", "selection_distribution_plot"]
      browse-paintings: ["painting_report_links"]
      browse-cases: ["case_report_links"]
      applicability-boundaries: ["approved_population_boundary", "partial_coverage_warning"]
      thesis-contribution: ["rq_alignment", "human_judgement_boundary"]

