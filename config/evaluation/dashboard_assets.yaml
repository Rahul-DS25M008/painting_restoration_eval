  population:
    painting_count: 50
    unified_case_count: 525
    eligible_restoration_case_count: 410
    approved_candidate_count: 1785
    selected_case_report_count: 30
    painting_report_count: 50
    model_report_count: 4
    canonical_uncertainty_group_count: 130
    damage_size_uncertainty_group_count: 35
    model_count: 4
    core_model_count: 3
    sdxl_candidate_count: 10
    page_count: 8
    dashboard_table_count: 9
    dashboard_index_count: 5

  pages:
    - {page_id: "overview", display_order: 1, display_name: "Overview", question: "What does the complete evaluation support?"}
    - {page_id: "study_design", display_order: 2, display_name: "Study Design", question: "What was evaluated, and under which controlled conditions?"}
    - {page_id: "metric_framework", display_order: 3, display_name: "Metric Framework", question: "Why do regions and metric families change the conclusion?"}
    - {page_id: "model_performance", display_order: 4, display_name: "Model Performance", question: "Which model performs better, under which conditions, and by what evidence?"}
    - {page_id: "robustness_uncertainty", display_order: 5, display_name: "Robustness & Uncertainty", question: "Where do restoration results become less dependable?"}
    - {page_id: "trustworthiness_xai", display_order: 6, display_name: "Trustworthiness & XAI", question: "Why was a candidate flagged, and what evidence supports review?"}
    - {page_id: "case_explorer", display_order: 7, display_name: "Case Explorer", question: "What evidence supports an individual restoration conclusion?"}
    - {page_id: "reports_reproducibility", display_order: 8, display_name: "Reports & Reproducibility", question: "Can each conclusion be traced to validated evidence?"}

  research_questions:
    - {id: "rq1", title: "Multi-metric evaluation beyond traditional image similarity"}
    - {id: "rq2", title: "Conditional model differences across paintings and damage conditions"}
    - {id: "rq3", title: "Repeated-candidate uncertainty and speculative restored regions"}
    - {id: "practical_output", title: "Interpretable museum-oriented decision-support reporting"}

  presentation:
    approved_mock_structure_locked: true
    principal_page_limit: 10
    principal_page_count: 8
    headline_indicator_minimum: 2
    headline_indicator_maximum: 4
    primary_analytical_views_maximum: 2
    default_case_selection_is_representative_only: true
    complete_population_must_remain_filterable: true
    raw_tables_default_to_expanded: false
    provenance_default_to_expanded: false
    theme_id: "authored_museum_research_v1"
    theme_palette:
      paper: "#F3EEE2"
      bottle_green: "#123F3A"
      raw_umber: "#6E4B32"
      faded_vermilion: "#B74B32"
      ochre: "#B88A2E"
      charcoal: "#272623"
      success: "#54765A"
      warning: "#B8792B"
      danger: "#A54532"
    mandatory_statement: "Visual plausibility is not equivalent to historical or restoration trustworthiness."
    prohibited_claims: ["conservation approval", "historical truth", "authenticity proof", "calibrated confidence"]

  expected_output_schemas:
    headline_findings: "dashboard_headline_findings.v1"
    study_design: "dashboard_study_design.v1"
    metric_framework: "dashboard_metric_framework.v1"
    performance_summary: "dashboard_performance_summary.v1"
    sensitivity_summary: "dashboard_sensitivity_summary.v1"
    uncertainty_summary: "dashboard_uncertainty_summary.v1"
    trustworthiness_summary: "dashboard_trustworthiness_summary.v1"
    compute_summary: "dashboard_compute_summary.v1"
    research_question_coverage: "dashboard_research_question_coverage.v1"
    case_index: "dashboard_case_index.v1"
    painting_index: "dashboard_painting_index.v1"
    visual_asset_index: "dashboard_visual_asset_index.v1"
    report_index: "dashboard_report_index.v1"
    filter_options: "dashboard_filter_options.v1"
    dashboard_assets: "dashboard_assets_manifest.v1"

  limitations:
    - "The dashboard summarizes a controlled synthetic-damage benchmark rather than real conservation interventions."
    - "Rule-derived flags are diagnostic evidence and are not independent human or conservation ground truth."
    - "Repeated-seed variability is empirical generative uncertainty, not calibrated confidence."
    - "SDXL evidence is a bounded ten-case feasibility evaluation and is not directly comparable to the full core-model population."
    - "Representative defaults support presentation; they do not replace complete indexed evidence access."
