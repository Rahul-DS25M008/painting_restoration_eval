# 50-painting controlled subset configuration

config_version: "1.1.0"

experiment:
  name: "painting_restoration_50_subset"
  version: "1.0.0"
  phase: "controlled_subset"
  description: "Controlled 50-painting evaluation subset for AI-assisted painting restoration."
  image_size: 768
  random_seed: 42

paths:
  metadata_path: "data/raw/metadata/metadata_50.csv"
  raw_image_dir: "data/raw/images"
  clean_dir: "data/processed/clean"
  mask_dir: "data/processed/masks"
  masked_dir: "data/processed/masked"
  restored_dir: "data/processed/restored"
  processed_metadata_dir: "data/processed/metadata"
  metrics_dir: "outputs/metrics"
  figures_dir: "outputs/figures"
  reports_dir: "outputs/reports"
  logs_dir: "outputs/logs"

dataset:
  total_paintings: 50

  categories:
    portrait_figure: 10
    landscape_natural: 10
    architecture_structured: 10
    abstraction_surrealism: 10
    high_texture_brushwork: 10

  expected_source_counts:
    The Metropolitan Museum of Art: 30
    Rijksmuseum: 10
    Art Institute of Chicago: 10

  selection_rules:
    - "Use public-domain or open-access images only."
    - "Use images with sufficient resolution for 768x768 preprocessing."
    - "Record source URL and license for each painting."
    - "Select images based on restoration-relevant visual properties, not only art-historical category."

preprocessing:
  output_size: 768
  color_mode: "RGB"
  resize_strategy: "aspect_ratio_resize_median_rgb_pad"
  output_format: "png"
  padding_strategy: "median_rgb"
  record_content_region: true

masks:
  generator_name: "canonical_synthetic_damage_masks"
  generator_version: "2.0.0"

  base_seed: 20260630
  max_generation_attempts: 30

  output_format: "png"
  color_mode: "L"
  background_value: 0
  damaged_value: 255
  restrict_to_content_region: true

  mask_types:
    - "zero_control"
    - "scratch_thin"
    - "loss_small"
    - "loss_large"
    - "mixed_damage"

  presets:
    zero_control:
      target_area_pct: 0.0
      min_area_pct: 0.0
      max_area_pct: 0.0
      description: "No damage. Used to measure unnecessary model changes or hallucination."

    scratch_thin:
      target_area_pct: 2.0
      min_area_pct: 1.0
      max_area_pct: 3.0
      description: "Thin elongated scratch or crack-like damage."

    loss_small:
      target_area_pct: 4.5
      min_area_pct: 3.0
      max_area_pct: 6.0
      description: "Small localized irregular missing-paint regions."

    loss_large:
      target_area_pct: 12.5
      min_area_pct: 10.0
      max_area_pct: 15.0
      description: "Large irregular missing region representing a difficult restoration case."

    mixed_damage:
      target_area_pct: 11.5
      min_area_pct: 8.0
      max_area_pct: 15.0
      description: "Combination of scratches, irregular losses, scattered losses, and edge damage."

damage_conditions:
  zero_control:
    target_area_ratio_min: 0.0
    target_area_ratio_max: 0.0
    description: "No damage. Used to measure unnecessary model changes or hallucination."

  scratch_thin:
    target_area_ratio_min: 0.01
    target_area_ratio_max: 0.03
    description: "Thin scratch or crack-like damage."

  loss_small:
    target_area_ratio_min: 0.03
    target_area_ratio_max: 0.06
    description: "Small localized missing paint."

  loss_large:
    target_area_ratio_min: 0.10
    target_area_ratio_max: 0.15
    description: "Large missing region and difficult restoration case."

  mixed_damage:
    target_area_ratio_min: 0.08
    target_area_ratio_max: 0.15
    description: "Combination of scratches, irregular losses, scattered losses, and edge damage."

damage_size_sensitivity:
  metadata_path: data/processed/metadata/metadata_damage_size_sensitivity.csv
  mask_dir: data/processed/masks/damage_size_sensitivity
  damaged_dir: data/processed/damaged/damage_size_sensitivity
  outputs_dir: outputs/damage_size_sensitivity

  target_percentages:
    - 2
    - 4
    - 6
    - 8
    - 10
    - 15
    - 20

  base_mask_types:
    - loss_large

  expected_painting_count: 5
  global_seed: 20260505
  maximum_percentage_error: 0.50

  fill_strategy: constant_rgb
  fill_color:
    - 255
    - 255
    - 255

mask_robustness:
  metadata_path: data/processed/metadata/metadata_mask_robustness.csv
  mask_dir: data/processed/masks/mask_robustness
  damaged_dir: data/processed/damaged/mask_robustness
  outputs_dir: outputs/mask_robustness

  base_mask_types:
    - scratch_thin
    - loss_small
    - loss_large

  target_percentages:
    scratch_thin: 2.0
    loss_small: 4.5
    loss_large: 12.5

  variants_per_mask_type: 5
  expected_painting_count: 5
  global_seed: 20260606

  maximum_percentage_error: 0.50

  fill_strategy: constant_rgb
  fill_color:
    - 255
    - 255
    - 255

synthetic_degradation:
  metadata_path: data/processed/metadata/metadata_synthetic_degradation.csv
  effect_mask_dir: data/processed/masks/synthetic_degradation
  degraded_dir: data/processed/degraded/synthetic_degradation
  outputs_dir: outputs/synthetic_degradation

  expected_painting_count: 5
  global_seed: 20260707

  degradation_types:
    - blur
    - water_stain
    - fading
    - discolouration
    - dirt_dust
    - partial_transparency

  severity_levels:
    - mild
    - moderate
    - severe

  combined_degradations:
    - fading_discolouration
    - water_stain_dirt
    - blur_fading

  fill_strategy: preserve_original

models:
  opencv_telea:
    enabled: true
    role: "classical_deterministic_baseline"
    parameters:
      radius: 3

  lama:
    enabled: false
    role: "pretrained_open_inpainting_candidate"
    parameters: {}

  stable_diffusion_inpainting:
    enabled: false
    role: "generative_uncertainty_candidate"
    parameters:
      num_seeds: 5
      prompt_strategy: "neutral_restoration_prompt"

  sdxl_inpainting:
    enabled: false
    role: "higher_capacity_generative_candidate"
    parameters:
      num_seeds: 5
      prompt_strategy: "neutral_restoration_prompt"

  dalle_image_editing:
    enabled: false
    role: "optional_closed_model_comparison"
    parameters: {}

metrics:
  classical:
    - "mae_full"
    - "mse_full"
    - "psnr_full"
    - "ssim_full"
    - "mae_masked"
    - "mse_masked"
    - "psnr_masked"

  perceptual:
    - "lpips_full"
    - "lpips_mask_crop"

  future_semantic_style:
    - "dinov2_similarity"
    - "clip_similarity"

  zero_control:
    - "unnecessary_change_mae"
    - "unnecessary_change_lpips"

  uncertainty:
    enabled_for_full_50: false
    subset_size: 10
    damage_conditions:
      - "loss_large"
      - "mixed_damage"
    planned_metrics:
      - "pixel_variance"
      - "pairwise_lpips"
      - "metric_standard_deviation"
      - "best_worst_gap"

reporting:
  generate_case_grids: true
  generate_error_maps: true
  generate_html_report: true
  compare_models: false
  include_uncertainty_section: false

notes:
  - "Run OpenCV Telea on all 50 paintings first before adding pretrained models."
  - "Keep model audit updated before selecting the final model set."
  - "Use this subset to validate the pipeline before scaling toward approximately 300 paintings."