    - "add_six_metadata_complete_paintings_per_category"
    - "span_observed_content_area_fraction_with_deterministic_quantiles"
    - "require_complete_notebook_02_and_notebook_03_handoff"
  base_mask_type: "loss_large"
  paintings:
