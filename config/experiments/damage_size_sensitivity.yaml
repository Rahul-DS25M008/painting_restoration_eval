config_schema_version: "damage_size_sensitivity_config.v2"
config_version: "2.0.0"

dataset:
  dataset_id: "painting_restoration_eval"
  dataset_version: "2.0.0"
  dataset_scope: "controlled_300"
  execution_profile: "controlled_300"
  geometry_schema_version: "preprocessed_images.v1"
  mask_schema_version: "canonical_masks.v1"
  output_schema_version: "damage_size_cases.v1"
  audit_schema_version: "damage_size_generation_audit.v1"
  experiment_id: "damage_size_sensitivity"

inputs:
  geometry_path: "outputs/02_image_preprocessing/data/preprocessed_images.csv"
  clean_images_path: "outputs/02_image_preprocessing/images/clean"
  preprocessing_artifacts_path: "outputs/02_image_preprocessing/manifests/artifacts.csv"
  preprocessing_run_manifest_path: "outputs/02_image_preprocessing/manifests/run_manifest.json"
  masks_path: "outputs/03_canonical_mask_generation/data/masks.csv"
  mask_images_path: "outputs/03_canonical_mask_generation/images/masks"
  masks_artifacts_path: "outputs/03_canonical_mask_generation/manifests/artifacts.csv"
  masks_run_manifest_path: "outputs/03_canonical_mask_generation/manifests/run_manifest.json"
  required_preprocessing_artifact_keys:
    - "preprocessed_images"
    - "clean_images"
  required_mask_artifact_keys:
    - "canonical_masks"
    - "mask_images"
  required_registry_keys:
    - "preprocessing.geometry"
    - "preprocessing.clean_images"
    - "masks.canonical"
    - "masks.canonical_images"
  required_upstream_run_status: "completed"

output:
  notebook_stem: "05_damage_size_sensitivity_dataset_generation"
  cases_path: "data/cases.csv"
  mask_directory: "images/masks"
  damaged_directory: "images/damaged"
  image_path_template: "{painting_id}/{level_id}.png"
  audit_path: "metrics/generation_audit.csv"
  progression_figure_path: "figures/damage_size_progression.png"

