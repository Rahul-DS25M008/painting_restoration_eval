levels:
  - level_id: "size_02pct"
    target_percentage_content: 2.0
  - level_id: "size_04pct"
    target_percentage_content: 4.0
  - level_id: "size_06pct"
    target_percentage_content: 6.0
  - level_id: "size_08pct"
    target_percentage_content: 8.0
  - level_id: "size_10pct"
    target_percentage_content: 10.0
  - level_id: "size_15pct"
    target_percentage_content: 15.0
  - level_id: "size_20pct"
    target_percentage_content: 20.0

generator:
  name: "damage_size_sensitivity_generator"
  version: "3.1.0"
  seed_scheme_version: "damage_size_nested_seed.v1"
  global_seed: 20260505
  scaling_method: "isotropic_nearest_neighbor_about_base_centroid"
  nesting_policy: "strict_previous_level_subset"
  boundary_correction_policy: "deterministic_radial_boundary_correction"
  target_pixel_rounding: "round_half_up"
  maximum_scale_iterations: 32
  maximum_absolute_percentage_point_error: 0.01
  fill_strategy: "constant_rgb"
  fill_color_rgb:
    - 255
    - 255
    - 255
  target_width: 768
  target_height: 768
  mask_background_value: 0
  mask_damaged_value: 255
  mask_mode: "L"
  damaged_mode: "RGB"
  output_format: "PNG"
  output_extension: ".png"
  png_compress_level: 6
  png_optimize: false
  strip_output_metadata: true
  overwrite_existing: true
  stale_file_action: "remove"

morphology:
  component_connectivity: 8
  perimeter_connectivity: 4
  compactness_formula: "four_pi_area_over_perimeter_squared"
  centroid_reference: "content_normalized_xy"
  maximum_centroid_shift_pixels: 2.0
  maximum_centroid_shift_fraction_of_content_diagonal: 0.005
  maximum_relative_bbox_aspect_ratio_drift: 0.15
  maximum_relative_compactness_drift: 0.35
  require_component_count_preserved: true
  require_no_content_boundary_contact: true
  require_strict_nesting: true

expected:
  upstream_painting_count: 300
  upstream_mask_count: 1500
  painting_count: 35
  category_count: 5
  paintings_per_category: 7
  base_mask_type_count: 1
  target_level_count: 7
  case_count: 245
  audit_row_count: 245
  mask_file_count: 245
  damaged_file_count: 245
  artifact_record_count: 6
  total_output_file_count: 496

smoke:
  painting_id: "p259"
  selection_reason: "median_content_area_within_pinned_cohort"
  target_level_count: 7
  repeat_count: 2
  persist_outputs: false

examples:
  selection_rule: "minimum_median_maximum_content_area_within_pinned_cohort"
  painting_ids:
    - "p157"
    - "p259"
    - "p073"
  figure_dpi: 160
  columns:
    - "clean"
    - "size_02pct"
    - "size_04pct"
    - "size_06pct"
    - "size_08pct"
    - "size_10pct"
    - "size_15pct"
    - "size_20pct"
  overlay_mask_contour: true
  annotate_realized_percentage: true
