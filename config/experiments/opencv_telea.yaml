config_schema_version: "opencv_telea_config.v1"
config_version: "1.0.0"

dataset:
  dataset_id: "painting_restoration_eval"
  dataset_version: "1.0.0"
  dataset_scope: "controlled_50"
  experiment_id: "cross_experiment_opencv_telea"

inputs:
  inventory_path: "outputs/inventory/project_file_inventory.csv"
  inventory_run_path: "outputs/inventory/inventory_run.json"
  project_paths_path: "outputs/inventory/project_paths.json"
  case_registry_path: "outputs/08_experiment_contracts_and_region_policy/data/case_registry.csv"
  model_eligibility_path: "outputs/08_experiment_contracts_and_region_policy/data/model_eligibility.csv"
  schema_registry_path: "outputs/08_experiment_contracts_and_region_policy/data/schema_registry.json"
  upstream_run_manifest_path: "outputs/08_experiment_contracts_and_region_policy/manifests/run_manifest.json"
  upstream_artifacts_path: "outputs/08_experiment_contracts_and_region_policy/manifests/artifacts.csv"
  evaluation_contract_config_path: "config/experiments/evaluation_contract.yaml"
  synthetic_degradation_config_path: "config/experiments/synthetic_degradation.yaml"
  required_registry_keys:
    - "experiment_contracts.case_registry"
    - "experiment_contracts.model_eligibility"
    - "experiment_contracts.schema_registry"
  required_upstream_run_status: "completed"

output:
  notebook_stem: "09_opencv_telea_restoration"
  restorations_path: "data/restorations.csv"
  restored_directory: "images/restored"
  restored_path_template: "{experiment_id}/{case_id}.png"
  runtime_summary_path: "metrics/runtime_summary.csv"
  examples_figure_path: "figures/restoration_examples.png"
  run_manifest_path: "manifests/run_manifest.json"
  artifacts_path: "manifests/artifacts.csv"
  validation_path: "validation/checks.csv"
  checkpoint_path: "work/restoration_checkpoint.csv"
  smoke_directory: "work/smoke"

model:
  model_id: "opencv_telea"
  methodological_role: "classical_deterministic_baseline"
  configuration_id: "opencv_telea_r3_threshold_policy_v1"
  algorithm: "cv2.INPAINT_TELEA"
  inpaint_radius: 3
  device: "cpu"
  precision: "uint8"
  execution_backend: "opencv_cpu"
  retry_count: 0
  deterministic: true
  zero_control_policy: "identity_noop"
  mask_threshold_policy:
    binary_missing_region:
      threshold: 128
      comparison: "greater_than_or_equal"
    synthetic_degradation:
      threshold: 13
      comparison: "greater_than_or_equal"
      source_config_key: "generator.active_threshold"

execution:
  progress_interval_cases: 10
  compute_checksums: true
  resume_enabled: true
  overwrite_existing: true
  stale_file_action: "remove"
  target_width: 768
  target_height: 768
  output_mode: "RGB"
  output_format: "PNG"
  png_compress_level: 6

expected:
  case_registry_rows: 525
  model_eligibility_rows: 2100
  eligible_case_count: 410
  eligible_case_count_by_experiment:
    canonical_missing_region: 250
    damage_size_sensitivity: 35
    mask_robustness: 75
    synthetic_degradation: 50
  unique_clean_image_count: 50
  restored_file_count: 410
  restorations_row_count: 410
  runtime_summary_row_count: 5
  representative_case_count: 8
  artifact_record_count: 5
  total_output_file_count: 416

smoke:
  case_id: "canonical__p039__loss_large"
  repeat_count: 2

representative_case_ids:
  - "canonical__p039__loss_large"
  - "canonical__p001__zero_control"
  - "damage_size__p001__loss_large__size_02pct"
  - "mask_robustness__p001__loss_large__target_12p5pct__variant_01"
  - "synthetic_degradation__p001__dirt_dust__mild"
  - "synthetic_degradation__p001__partial_transparency__moderate"
  - "synthetic_degradation__p001__water_stain__severe"
  - "synthetic_degradation__p001__water_stain_dirt__moderate"

schema_versions:
  case_registry: "case_registry.v1"
  model_eligibility: "model_eligibility.v1"
  restorations: "restorations.v1"
  runtime_summary: "restoration_runtime_summary.v1"
  restored_images: "restored_images.opencv_telea.v1"
  examples_figure: "figure.restoration_examples.v1"
  run_manifest: "run_manifest.v1"
  artifact_manifest: "artifact_manifest.v1"
  validation_checks: "validation_checks.v1"

known_limitations:
  - "OpenCV Telea is a local interpolation baseline and does not reconstruct historically verified content."
  - "A fixed radius of 3 is used without per-case tuning."
  - "Eligible synthetic-degradation cases are supplementary masked-removal diagnostics and must remain separate from missing-content claims."
  - "Runtime measurements describe the recorded CPU environment and are not universal benchmarks."
