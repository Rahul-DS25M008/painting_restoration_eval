    - http
    - https
  allowed_extensions:
    - .jpg
    - .jpeg
  allowed_image_formats:
    - JPEG
  allowed_image_modes:
    - RGB
  minimum_short_side: 640
  minimum_long_side: 768
  exact_duplicate_algorithm: "sha256"
  near_duplicate:
    method: "dhash64"
    method_version: "dhash64.v1"
    hash_size: 8
    hamming_distance_threshold: 5
    apply_exif_orientation: true

preview:
  group_by: "category"
  items_per_group: 2
  sort_by:
    - category
    - painting_id

bias_notes:
  - bias_id: "institutional_source_concentration"
    bias_category: "source_representation"
    statement: "The controlled collection includes 32 recorded source labels, but the largest source contributes 109 of 300 paintings; source coverage is therefore broader but still concentrated."
    evidence_basis: "Configured and observed source counts."
  - bias_id: "open_access_selection_bias"
    bias_category: "acquisition"
    statement: "Restricting acquisition to public-domain or open-access material favors institutions and works with suitable digitization and rights metadata."
    evidence_basis: "Dataset selection rule and accepted licence mappings."
  - bias_id: "purposeful_visual_category_sampling"
    bias_category: "sampling"
    statement: "The five balanced visual categories are a purposive evaluation design and are not independently validated art-historical styles or a population-representative sample of painting history."
    evidence_basis: "Configured category quotas and selection reasons."
  - bias_id: "metadata_availability_imbalance"
    bias_category: "metadata"
    statement: "Date or period, style or period, and medium are recorded for 268 of 300 paintings; visual category remains the complete grouping variable."
    evidence_basis: "Observed optional-field completeness in metadata_300.csv."
  - bias_id: "historical_geographic_representation_unresolved"
    bias_category: "historical_geographic_representation"
    statement: "Historical and geographic representation cannot be quantified reliably from the current fields and requires explicit enrichment before population-level claims."
    evidence_basis: "Incomplete optional period metadata and absence of a normalized geographic field."
