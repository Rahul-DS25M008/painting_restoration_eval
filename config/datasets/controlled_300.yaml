    - category
    - title
    - artist
    - date
    - style_or_period
    - medium
    - source
    - source_url
    - license
    - filename
    - original_width
    - original_height
    - selection_reason
    - visual_complexity_note
    - status
    - notes
  required_nonblank_columns:
    - painting_id
    - category
    - title
    - artist
    - source
    - source_url
    - license
    - filename
    - original_width
    - original_height
    - selection_reason
    - visual_complexity_note
