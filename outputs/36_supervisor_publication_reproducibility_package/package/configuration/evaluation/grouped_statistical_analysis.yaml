    spatial_metrics_path: "outputs/16_difference_maps_and_spatial_diagnostics/metrics/spatial_diagnostics.csv"
    spatial_maps_path: "outputs/16_difference_maps_and_spatial_diagnostics/manifests/map_images.csv"
    spatial_run_manifest_path: "outputs/16_difference_maps_and_spatial_diagnostics/manifests/run_manifest.json"
    local_metrics_path: "outputs/17_local_consistency_metrics/metrics/local_consistency.csv"
    local_maps_path: "outputs/17_local_consistency_metrics/manifests/map_images.csv"
    local_run_manifest_path: "outputs/17_local_consistency_metrics/manifests/run_manifest.json"
    canonical_uncertainty_metrics_path: "outputs/18_diffusion_uncertainty_analysis/metrics/uncertainty_metrics.csv"
    canonical_uncertainty_groups_path: "outputs/18_diffusion_uncertainty_analysis/metrics/uncertainty_calibration_inputs.csv"
    uncertainty_run_manifest_path: "outputs/18_diffusion_uncertainty_analysis/manifests/run_manifest.json"
    spatial_explanations_path: "outputs/19_uncertainty_and_spatial_explanation_maps/metrics/spatial_explanations.csv"
    spatial_explanation_maps_path: "outputs/19_uncertainty_and_spatial_explanation_maps/manifests/map_images.csv"
    spatial_explanations_run_manifest_path: "outputs/19_uncertainty_and_spatial_explanation_maps/manifests/run_manifest.json"
    semantic_metrics_path: "outputs/20_semantic_and_structural_consistency/metrics/semantic_structural_metrics.csv"
    semantic_run_manifest_path: "outputs/20_semantic_and_structural_consistency/manifests/run_manifest.json"
    comparison_metrics_path: "outputs/21_multi_model_comparison/metrics/model_comparison.csv"
    disagreement_metrics_path: "outputs/21_multi_model_comparison/metrics/metric_disagreement.csv"
    representative_cases_path: "outputs/21_multi_model_comparison/data/representative_cases.csv"
