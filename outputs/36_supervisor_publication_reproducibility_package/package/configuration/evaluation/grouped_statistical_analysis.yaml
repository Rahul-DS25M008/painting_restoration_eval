    damage_size_uncertainty_maps_path: "outputs/22_damage_size_diffusion_uncertainty_extension/manifests/map_images.csv"
    damage_size_uncertainty_run_manifest_path: "outputs/22_damage_size_diffusion_uncertainty_extension/manifests/run_manifest.json"
    damage_size_analysis_path: "outputs/23_damage_size_sensitivity_analysis/metrics/damage_size_analysis.csv"
    damage_size_analysis_run_manifest_path: "outputs/23_damage_size_sensitivity_analysis/manifests/run_manifest.json"
    mask_robustness_analysis_path: "outputs/24_mask_robustness_analysis/metrics/mask_robustness_analysis.csv"
    mask_robustness_run_manifest_path: "outputs/24_mask_robustness_analysis/manifests/run_manifest.json"
    degradation_analysis_path: "outputs/25_synthetic_degradation_analysis/metrics/degradation_analysis.csv"
    degradation_analysis_run_manifest_path: "outputs/25_synthetic_degradation_analysis/manifests/run_manifest.json"

  output:
