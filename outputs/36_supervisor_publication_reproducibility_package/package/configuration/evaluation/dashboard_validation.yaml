application:
  title: "Painting Restoration Evidence Museum"
  application_schema_version: "dashboard_application.v2"
  entrypoint: "streamlit_app.py"
  helper_module: "src/restoration_eval/dashboard_application.py"
  dashboard_package_root: "outputs/34_final_streamlit_dashboard_assets"
