scientific_boundaries:
  mandatory_statement: "Visual plausibility is not equivalent to historical correctness, conservation approval, or restoration trustworthiness."
  dashboard_is_not_an_experiment: true
  dashboard_is_not_a_restoration_tool: true
  no_scientific_recomputation: true
  no_restoration_inference: true
  controlled_damage_is_not_real_conservation_damage: true
  uncertainty_is_empirical_seed_variability: true
  uncertainty_is_calibrated_confidence: false
  sdxl_is_bounded_24_candidate_evidence: true
  computational_flags_are_expert_ground_truth: false
  retrieval_is_context_not_ground_truth: true
  rendered_lightness_is_race_or_identity: false
  no_universal_combined_score: true
  prohibited_claims: [conservation approval, historical truth, authenticity proof, calibrated confidence, universal best model, combined quality score]
  prohibited_runtime_source_fragments: ["outputs/dashboard", "outputs/metrics", "outputs/reports", "outputs/figures", "combined_uncertainty_index", "controlled_50"]

