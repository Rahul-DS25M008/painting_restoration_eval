  default_room_id: "exhibition_foyer"
  principal_room_count: 8
  child_route_count: 1
  principal_room_order:
    - exhibition_foyer
    - study_design
    - metric_framework
    - model_gallery
    - stability_lab
    - trustworthiness
    - case_explorer
    - research_archive
  display_names:
    exhibition_foyer: "Exhibition Foyer"
    study_design: "Study Design"
    metric_framework: "Metric Framework"
    model_gallery: "Model Gallery"
    stability_lab: "Stability Lab"
    trustworthiness: "Trustworthiness"
    case_explorer: "Case Explorer"
    research_archive: "Research Archive"
    focused_portrait_review: "Focused Portrait Review"
  child_routes:
    - room_id: "focused_portrait_review"
      route_kind: "child"
      parent_room_id: "trustworthiness"
      allowed_entry_rooms: [study_design, trustworthiness, case_explorer]
  guided_tour:
    enabled: true
    skippable: true
    autoplay_video: false
    label: "Take the guided tour · about 6 min"
    room_ids: [exhibition_foyer, study_design, metric_framework, model_gallery, stability_lab, trustworthiness, case_explorer, research_archive]
    optional_detour_room_id: "focused_portrait_review"
    optional_detour_parent_room_id: "trustworthiness"
  runtime_rules:
    presentation_only: true
    no_scientific_recomputation: true
    no_restoration_inference: true
    only_active_room_renders: true
    hidden_content_must_be_conditional: true
    remote_load_requires_explicit_action: true
    identity_substitution_allowed: false
    external_font_or_cdn_request_allowed: false
    mockup_rasters_as_page_backgrounds_allowed: false
    checksum_verified_decorative_shells_allowed: true
    decorative_shells_are_scientific_evidence: false

