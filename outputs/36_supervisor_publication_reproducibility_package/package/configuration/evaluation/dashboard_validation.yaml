# Controlled-300 Notebook 35 application and deployment-validation contract.
# The former dashboard_validation_config.v1 values described the frozen
# Controlled-50 deployment. They remain recoverable from Git history and must
# never be mixed with this contract or used as a fallback at runtime.
schema_version: dashboard_validation_config.v2
configuration_version: 2.0.0

notebook:
  id: "35"
  stem: "35_dashboard_and_deployment_validation"
  origin: "New Notebook"
  output_root: "outputs/35_dashboard_and_deployment_validation"
  purpose: "Implement and validate the Controlled-300 dashboard as a reproducible inspection and decision-support layer."
  creates_new_scientific_evidence: false
  expected_canonical_output_count: 4

