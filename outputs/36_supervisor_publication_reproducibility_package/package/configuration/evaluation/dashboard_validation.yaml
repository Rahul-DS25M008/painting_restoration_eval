known_limitations:
  - "The application presents validated evidence and does not create restoration candidates, scientific metrics or conservation decisions."
  - "The benchmark uses controlled synthetic damage and does not establish real-world conservation generality or historical correctness."
  - "The balanced five-category collection does not represent every artistic tradition, period, culture or conservation condition."
  - "Style or period metadata is documented for 268 of 300 paintings."
  - "SDXL contains 24 completed candidates in a bounded feasibility branch and is not a fifth full-scope benchmark method."
  - "Repeated-seed variability is empirical generative uncertainty, not calibrated confidence."
  - "Telea, LaMa and HINT are deterministic under the recorded evaluation setup."
  - "Computational flags and recommendations are review aids, not expert or conservation ground truth."
  - "Retrieval and feature similarity provide context and do not establish restoration correctness or historical authenticity."
  - "D02 studies rendered lightness rather than race, ethnicity or identity and does not establish demographic bias."
  - "Runtime and memory measurements describe the validated deployment environment rather than a universal hardware claim."
  - "A Controlled-300 public URL must remain blank until deployment is explicitly performed and validated."
