  report:
    approved_mock_structure_locked: true
    self_contained_html: true
    required_external_image_dependencies: 0
    image_max_dimension: 900
    photographic_format: "JPEG"
    photographic_quality: 82
    soft_report_size_warning_mib: 24
    title_suffix: "Painting Restoration Evaluation Report"
    required_section_ids:
      - "executive-summary"
      - "method-identity"
      - "coverage-applicability"
      - "overall-quality"
      - "damage-and-experiments"
      - "texture-colour-seam"
      - "semantic-structural"
      - "uncertainty-prompt-stability"
      - "representative-successes-failures"
      - "difference-explanation-maps"
      - "failure-taxonomy-flags"
      - "compute-scalability"
      - "decision-support"
      - "limitations"
      - "reproducibility-provenance"
    required_terms:
      - "Visual plausibility is not equivalent to historical or restoration trustworthiness."
      - "better"
      - "worse"
      - "inconclusive"
      - "limitation"
      - "RQ1"
      - "RQ2"
      - "RQ3"
    prohibited_terms:
      - "MOCK VALUE"
      - "PLACEHOLDER IMAGE"
      - "historically authentic restoration"
      - "conservation approved"
      - "universal best model"
    traceability_roles:
      executive-summary: ["headline_indicators", "main_conclusion", "scope_caveat"]
      method-identity: ["method_card_summary"]
      coverage-applicability: ["coverage_table", "applicability_statement"]
      overall-quality: ["quality_table", "quality_plot", "scoped_assertion"]
      damage-and-experiments: ["damage_summary", "experiment_plot", "scoped_assertion"]
      texture-colour-seam: ["local_metric_summary", "diagnostic_visual", "scoped_assertion"]
      semantic-structural: ["semantic_summary", "structural_visual", "scoped_assertion"]
      uncertainty-prompt-stability: ["applicability_or_results", "nearby_limit"]
      representative-successes-failures: ["auditable_selection", "success_failure_panels"]
      difference-explanation-maps: ["difference_maps", "explanation_maps", "scale_caption"]
      failure-taxonomy-flags: ["failure_summary", "flag_actions", "scoped_assertion"]
      compute-scalability: ["observed_compute", "projection_scope", "scoped_assertion"]
      decision-support: ["strengths", "weaknesses", "human_review_action"]
      limitations: ["model_limitations", "evidence_limits"]
      reproducibility-provenance: ["run_ids", "source_artifacts", "checksums"]

  expected_counts:
    upstream_manifest_count: 22
    model_count: 4
    report_count: 4
    report_index_rows: 4
    artifact_records: 6
    physical_output_files: 8
    explanation_case_rows: 1785
    case_neighbor_rows: 100
    model_card_rows: 4
    compute_rows: 35
    section_count_per_report: 15
    traceability_rows: 39

  evidence_policy:
    creates_new_scientific_evidence: false
    presentation_only_transformations:
      - "validated_population_filtering"
      - "deterministic_representative_selection"
      - "sorting_and_display_formatting"
      - "display_percentages_from_canonical_counts"
      - "presentation_only_plots_and_web_sized_images"
      - "self_contained_html_assembly"
    prohibited_transformations:
      - "new_metric_computation"
      - "new_statistical_test"
      - "new_post_hoc_exclusion"
      - "new_composite_score"
      - "new_scientific_ranking"
      - "manual_copying_of_experimental_values"
    independent_units:
      canonical_comparison: "painting_and_paired_case_as_defined_upstream"
      extension_experiments: "painting"
      diffusion_uncertainty: "fixed_case_prompt_configuration_group"
      report_examples: "illustrative_not_independent_evidence"

  known_limitations:
    - "controlled synthetic damage does not establish physical conservation validity"
    - "visual plausibility does not establish historical authenticity"
    - "style_or_period is descriptive for only 18 of 50 paintings"
    - "SDXL evidence is limited to ten cases from five paintings"
    - "repeated-seed uncertainty is empirical variability rather than calibrated confidence"
    - "runtime and memory describe the recorded workstation rather than a universal benchmark"
