schema_version: supervisor_package_config.v1
configuration_version: 2.0.0
dataset_scope: controlled_300
preparation_status: first_three_batches_ready_not_executed

notebook:
  id: "36"
  stem: "36_supervisor_publication_reproducibility_package"
  origin: "Consolidates Existing Previous Versions of Notebooks 30 and 35, Pre-refactor"
  output_root: "outputs/36_supervisor_publication_reproducibility_package"
  purpose: "Assemble and validate the final supervisor, publication, and reproducibility delivery package without recomputing scientific evidence."

runtime:
  provisional_python: "3.12"
  accepted_python_minor_versions: ["3.12"]
  packages: [pandas, numpy, pyyaml, pillow]

governing_inputs:
  inventory_csv: "outputs/inventory/project_file_inventory.csv"
  inventory_run: "outputs/inventory/inventory_run.json"
