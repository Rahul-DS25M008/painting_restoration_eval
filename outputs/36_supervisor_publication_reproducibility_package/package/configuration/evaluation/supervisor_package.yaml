# D01 retains its original manifest notebook_id 37 and separate decision scope.
upstream_identity:
  additional_ids: ["12A", "D02", "37"]
  decision_only_ids: ["37"]
  supplemental_ids: ["D02"]
  n35_completion_basis: "closeout.n35_delivery_complete_and_n36_may_start"
  require_explicit_zero_blocking_summary: true
  preserve_nested_validation_summaries: true

batch_plan:
  - "1: contract, environment, inventory and read-only copy-plan preflight"
  - "2: upstream completion, producer-backed artifact registry and provenance exceptions"
  - "3: Controlled-300 population, model coverage, headline findings and RQ synthesis"
  - "4: supervisor summary and meeting documents in isolated staging"
  - "5: reproducibility appendix, limitations and publication references"
  - "6: byte-preserving curated package assembly"
  - "7: artifact index, omission ledger and package manifest"
  - "8: portability, links, checksum and package-boundary validation"
  - "9: final completion gate, guarded promotion, registry and inventory handoff"

execution_plan:
  estimated_active_minutes: [5, 20]
  first_three_batches_estimated_minutes: [1, 3]
  basis: "Approximately 35 MiB of selected copy inputs; 38 small manifests; compact N30-N34 synthesis tables. No model loading or full-corpus rehash."
  longest_stage: "Byte-preserving copy, HTML portability and repeated package checksum verification"
  exclude_from_estimate: ["manual review", "inventory refresh", "remote publication", "idle notebook time"]
  first_three_batches_write_canonical_outputs: false
  historical_output_policy: "Preserve current pilot output tree until verified staging is ready for guarded replacement."

evidence_inputs:
  bootstrap: "outputs/34_final_streamlit_dashboard_assets/data/bootstrap/bootstrap.json"
  thesis_tables: "outputs/33_final_evaluation_report/data/thesis_tables.csv"
  model_cards: "outputs/30_model_cards_compute_and_scalability/data/model_cards.csv"
  compute: "outputs/30_model_cards_compute_and_scalability/metrics/compute_scalability.csv"
  model_reports: "outputs/31_model_report_generation/data/report_index.csv"
  case_reports: "outputs/32_case_and_painting_report_generation/data/case_report_index.csv"
  painting_reports: "outputs/32_case_and_painting_report_generation/data/painting_report_index.csv"
  n35_checks: "outputs/35_dashboard_and_deployment_validation/validation/dashboard_checks.csv"

provenance_exceptions:
  n29:
    manifest_path: "outputs/29_explainable_ai_and_case_retrieval/manifests/run_manifest.json"
    recorded_artifact_manifest_sha256: "5df62a9675e9b6ad214475887378d29043312ca792f33ab0c5c24a7e2ac08a60"
    permitted_observed_artifact_manifest_sha256:
      - "9ec4a9f68a49f724b4f56ed3cf259971013378c39961be2065ce13f5a0438dfa"
      - "c239549fe5e2a2d36ceeef746cd9a7249ef6b11c389816e35d77323fd3f4490f"
    disposition: "Disclose the historical metadata discrepancy; verify all six payload groups independently, never rewrite the upstream record."
  n35:
    notebook_path: "notebooks/35_dashboard_and_deployment_validation.ipynb"
    recorded_source_sha256: "1802be0d85d014a204ad15570f6a754ede279034458054201d046f1016f16b29"
    accepted_saved_source_sha256: "0013ed457a6869d7d5c10425d94d94d0771c4f842a2014c59a91e029158c7eaa"
    expected_passed_checks: 519
    expected_warning_nonpasses: 14
    expected_dependency_warnings: 4
    expected_unmeasured_qualifications: 10
    disposition: "Owner accepted proceeding without rerun; preserve source mismatch and all unmeasured qualifications as limitations, not passes."

expected_population:
  upstream_notebooks: 38
  paintings: 300
  registered_cases: 3425
  restoration_cases: 2620
  primary_candidates: 10480
  approved_candidates: 13879
  quality_anchors: 11
  uncertainty_groups: 1025
  sdxl_scheduled_cases: 35
  sdxl_completed_candidates: 24
  thesis_figures: 18
  publication_figures: 6
  model_reports: 5
  model_cards: 5
  case_report_records: 30
  painting_report_records: 300

research_questions:
  rq1: "What additional evidence does a region-aware, multi-metric evaluation framework provide beyond traditional image-similarity metrics when evaluating AI-assisted painting restoration?"
  rq2: "How do selected inpainting methods differ in restoration quality across controlled artificial damage conditions, and how consistent are these differences across the evaluated paintings?"
  rq3: "How can repeated-candidate disagreement be used to characterize the stability of stochastic painting restorations, and how does it relate to other restoration-quality diagnostics?"

package_policy:
  self_contained_html: true
  repository_relative_paths_only: true
  preserve_source_bytes: true
  overwrite_only_matching_destination: true
  maximum_package_size_mib: 50
  maximum_relative_path_characters: 220
  bundled:
    - "final self-contained HTML report"
    - "five self-contained model reports"
    - "18 thesis figures and six publication figures"
    - "five model cards"
    - "eight compact tables and indexes"
    - "38 upstream run manifests, with D01 decision evidence kept separate"
    - "all declared evaluation YAML snapshots"
    - "two requirements files"
    - "Notebook 35 deployment-readiness report"
    - "Notebook 36 reports, meeting documents, indexes, and provenance snapshot"
  indexed_not_bundled:
    - "30 self-contained case reports"
    - "300 self-contained painting reports"
    - "30 selected case grids"
    - "Notebook 34 complete dashboard visual package"
    - "restoration candidates, maps, and raw image collections"
    - "model weights and caches"

