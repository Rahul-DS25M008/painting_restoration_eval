  implementation_guidelines: "docs/refactoring_implementation_guidelines.md"
  evidence_audit: "docs/evidence_dependency_audit.md"
  evidence_coverage: "config/evaluation/evidence_coverage.yaml"
  proposal: "docs/proposal/Rahul_Thesis_Proposal.docx"
  n29_discrepancy: "docs/n35_n29_manifest_discrepancy.md"
  n35_acceptance: "config/publication/n35_live_acceptance.json"

