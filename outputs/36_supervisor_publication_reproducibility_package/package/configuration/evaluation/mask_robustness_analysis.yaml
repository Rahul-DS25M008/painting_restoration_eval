config_schema_version: "mask_robustness_analysis_config.v1"
config_version: "1.0.0"

mask_robustness_analysis:
  notebook_id: "24"
  notebook_stem: "24_mask_robustness_analysis"
  origin: "New analysis stage separated from Notebook 06 generation"
  analysis_schema_version: "mask_robustness_analysis.v1"
  analysis_policy_id: "matched_five_variant_mask_robustness.v1"
  selection_policy_id: "mask_robustness_primary_candidates_metric_independent.v1"
  report_policy_id: "approved_mock_aligned_self_contained_mask_robustness_report.v1"

  inputs:
    inventory_path: "outputs/inventory/project_file_inventory.csv"
    inventory_run_path: "outputs/inventory/inventory_run.json"
    project_paths_path: "outputs/inventory/project_paths.json"
    evidence_coverage_path: "config/evaluation/evidence_coverage.yaml"
    evidence_audit_path: "docs/evidence_dependency_audit.md"
    implementation_guidelines_path: "docs/refactoring_implementation_guidelines.md"
    roadmap_path: "docs/final_notebook_roadmap.md"
    proposal_path: "docs/proposal/Rahul_Thesis_Proposal.docx"
    artworks_path: "outputs/01_dataset_verification/data/artworks.csv"
    mask_robustness_cases_path: "outputs/06_mask_robustness_dataset_generation/data/cases.csv"
    mask_robustness_audit_path: "outputs/06_mask_robustness_dataset_generation/metrics/generation_audit.csv"
    mask_robustness_run_manifest_path: "outputs/06_mask_robustness_dataset_generation/manifests/run_manifest.json"
    case_registry_path: "outputs/08_experiment_contracts_and_region_policy/data/case_registry.csv"
    eligibility_path: "outputs/08_experiment_contracts_and_region_policy/data/model_eligibility.csv"
    region_policy_path: "outputs/08_experiment_contracts_and_region_policy/data/region_policy.csv"
    contracts_run_manifest_path: "outputs/08_experiment_contracts_and_region_policy/manifests/run_manifest.json"
    opencv_candidates_path: "outputs/09_opencv_telea_restoration/data/restorations.csv"
    opencv_run_manifest_path: "outputs/09_opencv_telea_restoration/manifests/run_manifest.json"
    lama_candidates_path: "outputs/10_lama_restoration/data/restorations.csv"
    lama_run_manifest_path: "outputs/10_lama_restoration/manifests/run_manifest.json"
    stable_diffusion_candidates_path: "outputs/11_stable_diffusion_restoration/data/candidates.csv"
    stable_diffusion_run_manifest_path: "outputs/11_stable_diffusion_restoration/manifests/run_manifest.json"
    classical_metrics_path: "outputs/13_classical_metrics/metrics/classical_metrics.csv"
    classical_run_manifest_path: "outputs/13_classical_metrics/manifests/run_manifest.json"
    lpips_metrics_path: "outputs/14_lpips_metrics/metrics/lpips_metrics.csv"
    lpips_run_manifest_path: "outputs/14_lpips_metrics/manifests/run_manifest.json"
    feature_metrics_path: "outputs/15_feature_similarity/metrics/feature_metrics.csv"
    feature_run_manifest_path: "outputs/15_feature_similarity/manifests/run_manifest.json"
    spatial_metrics_path: "outputs/16_difference_maps_and_spatial_diagnostics/metrics/spatial_diagnostics.csv"
    spatial_run_manifest_path: "outputs/16_difference_maps_and_spatial_diagnostics/manifests/run_manifest.json"
    local_metrics_path: "outputs/17_local_consistency_metrics/metrics/local_consistency.csv"
    local_run_manifest_path: "outputs/17_local_consistency_metrics/manifests/run_manifest.json"
    semantic_metrics_path: "outputs/20_semantic_and_structural_consistency/metrics/semantic_structural_metrics.csv"
    semantic_run_manifest_path: "outputs/20_semantic_and_structural_consistency/manifests/run_manifest.json"
    comparison_metrics_path: "outputs/21_multi_model_comparison/metrics/model_comparison.csv"
    comparison_run_manifest_path: "outputs/21_multi_model_comparison/manifests/run_manifest.json"

  output:
    root: "outputs/24_mask_robustness_analysis"
    metrics_path: "metrics/mask_robustness_analysis.csv"
    robustness_figure_path: "figures/robustness_variance.png"
    ranking_figure_path: "figures/ranking_stability.png"
    report_path: "reports/mask_robustness_analysis.html"
    run_manifest_path: "manifests/run_manifest.json"
    artifacts_path: "manifests/artifacts.csv"
    validation_path: "validation/checks.csv"
    work_root: "work"

  population:
    dataset_scope: "controlled_50"
    experiment_id: "mask_robustness"
    completed_status: "completed"
    passed_status: "passed"
    painting_ids: ["p001", "p018", "p026", "p039", "p043"]
    mask_family_order: ["scratch_thin", "loss_small", "loss_large"]
    target_damage_fraction_by_family:
      scratch_thin: 0.02
      loss_small: 0.045
      loss_large: 0.125
    variants_per_group: 5
    model_order: ["opencv_telea", "lama", "stable_diffusion_inpainting"]
    model_source_notebooks:
      opencv_telea: "09"
      lama: "10"
      stable_diffusion_inpainting: "11"
    stable_diffusion_primary_role: "primary"
    stable_diffusion_primary_prompt_variant: "p00_generic"
    stable_diffusion_primary_seed: 2026
    metric_independent_selection: true
    prohibit_prompt_ablation_substitution: true
    prohibit_best_metric_candidate_selection: true

  evidence_sources:
    classical: {source_notebook_id: "13", family_column: "metric_family", source_row_id_column: "metric_row_id", comparison_basis: "restored_value"}
    perceptual: {source_notebook_id: "14", family_column: "metric_family", source_row_id_column: "metric_row_id", comparison_basis: "restored_value"}
    feature: {source_notebook_id: "15", family_column: "metric_family", source_row_id_column: "metric_row_id", comparison_basis: "restored_value"}
    spatial: {source_notebook_id: "16", source_row_id_column: "spatial_diagnostic_id", evidence_family: "spatial_diagnostics"}
    local_consistency: {source_notebook_id: "17", family_column: "metric_family", source_row_id_column: "local_consistency_id", comparison_basis: "restored_value"}
    semantic_structural: {source_notebook_id: "20", family_column: "evidence_family", source_row_id_column: "semantic_metric_id", comparison_basis: "restored_value"}
    runtime: {source_notebook_id: "09-11", evidence_family: "runtime_compute", metric_name: "runtime_seconds"}

  metric_direction:
    higher_is_better: ["psnr", "ssim", "clip_cosine_similarity", "dinov2_cosine_similarity", "global_feature_cosine_similarity", "local_patch_cosine_similarity", "reference_affinity_map_correlation", "reference_affinity_weighted_similarity", "clip_dinov2_local_map_agreement", "signed_improvement_mean", "signed_improvement_median", "signed_improvement_p05", "signed_improvement_p95", "improved_pixel_fraction"]
    lower_is_better: ["mse", "mae", "lpips", "local_patch_worsened_fraction", "outside_context_feature_change", "dinov2_patch_covariance_distance", "reference_affinity_js_divergence", "reference_affinity_centroid_shift", "restored_error_mean", "restored_error_median", "restored_error_p95", "worsened_pixel_fraction", "runtime_seconds"]
    local_consistency_default: "lower_is_better"
    descriptive_only: ["unchanged_pixel_fraction", "restoration_change_mean", "restoration_change_p95", "restoration_change_max", "restoration_changed_pixel_fraction"]

  spatial_metric_fields: ["restored_error_mean", "restored_error_median", "restored_error_p95", "signed_improvement_mean", "signed_improvement_median", "signed_improvement_p05", "signed_improvement_p95", "improved_pixel_fraction", "worsened_pixel_fraction", "unchanged_pixel_fraction", "restoration_change_mean", "restoration_change_p95", "restoration_change_max", "restoration_changed_pixel_fraction"]

  quality_anchors:
    - {anchor_id: "classical_masked_mae", evidence_family: "classical_pixel", metric_name: "mae", region_id: "masked_region", summary_statistic: "value"}
    - {anchor_id: "structural_crop_ssim", evidence_family: "ssim", metric_name: "ssim", region_id: "mask_bbox_crop", summary_statistic: "value"}
    - {anchor_id: "perceptual_crop_lpips", evidence_family: "perceptual", metric_name: "lpips", region_id: "mask_bbox_crop", summary_statistic: "value"}
    - {anchor_id: "feature_clip_crop", evidence_family: "feature_similarity", metric_name: "clip_cosine_similarity", feature_model_id: "clip_vit_b32", region_id: "mask_bbox_crop", summary_statistic: "value"}
    - {anchor_id: "feature_dino_crop", evidence_family: "feature_similarity", metric_name: "dinov2_cosine_similarity", feature_model_id: "dinov2_vits14", region_id: "mask_bbox_crop", summary_statistic: "value"}
    - {anchor_id: "spatial_masked_error", evidence_family: "spatial_diagnostics", metric_name: "restored_error_mean", region_id: "masked_region", summary_statistic: "value"}
    - {anchor_id: "texture_crop_p95", evidence_family: "texture_map", metric_name: "local_texture_error_p95", region_id: "mask_bbox_crop", summary_statistic: "value"}
    - {anchor_id: "colour_masked_delta_e", evidence_family: "colour", metric_name: "delta_e_ciede2000_mean", region_id: "masked_region", summary_statistic: "value"}
    - {anchor_id: "seam_boundary_gradient", evidence_family: "seam", metric_name: "boundary_gradient_mismatch", region_id: "boundary_ring", summary_statistic: "value"}
    - {anchor_id: "semantic_local_dino", evidence_family: "local_semantic_preservation", metric_name: "local_patch_cosine_similarity", feature_model_id: "dinov2_vits14", region_id: "mask_bbox_crop", summary_statistic: "mean"}
    - {anchor_id: "structural_affinity_correlation", evidence_family: "structural_layout", metric_name: "reference_affinity_map_correlation", feature_model_id: "dinov2_vits14", region_id: "content_region", summary_statistic: "pearson_correlation"}

  statistics:
    independent_unit: "painting"
    repeated_unit: "five_mask_variants_nested_within_painting_and_family"
    primary_dispersion_statistic: "median_absolute_deviation"
    transparent_dispersion_statistics: ["standard_deviation", "median_absolute_deviation", "range"]
    bootstrap_method: "exhaustive_ordered_painting_cluster_bootstrap"
    bootstrap_resamples: 3125
    confidence_level: 0.95
    exact_test: "two_sided_sign_flip_mean_statistic"
    sign_flip_assignments: 32
    effect_size: "matched_pairs_rank_biserial"
    fdr_method: "benjamini_hochberg"
    ranking_method: "average"
    ranking_unit: "one_balanced_vote_per_evidence_family_per_variant"
    runtime_in_quality_ranking: false
    combined_quality_score_retained: false
    use_uncertainty_terminology: false

  morphology:
    association_fields: ["centroid_x_normalized_content", "centroid_y_normalized_content", "bbox_fill_ratio", "bbox_aspect_ratio", "connected_component_count", "largest_component_fraction", "component_area_cv", "mask_compactness", "minimum_distance_to_content_boundary_pixels"]
    descriptive_fields: ["centroid_quadrant", "touches_content_boundary"]
    association_method: "spearman_on_within_group_centered_values_with_painting_cluster_inference"
    retain_invariant_as_not_applicable: true
    interpretation: "exploratory_noncausal"

  analysis_kinds: ["variant_quality", "group_quality_dispersion", "model_dispersion_summary", "paired_model_dispersion_contrast", "variant_family_balanced_rank", "group_rank_stability", "anchor_winner_stability", "group_sensitivity_summary", "morphology_association", "runtime_group_dispersion", "runtime_model_summary"]

  report:
    title: "Mask-Placement Robustness in AI-Assisted Painting Restoration"
    subtitle: "Multi-model sensitivity to location, geometry, and component arrangement under matched damaged area"
    self_contained_html: true
    plain_language_first: true
    required_research_questions: ["RQ1", "RQ2", "RQ3"]
    approved_mock_structure_locked: true
    required_section_ids: ["what_was_evaluated", "mask_variant_integrity", "quality_variation", "restoration_examples", "overall_model_stability", "preferred_model_changes", "evidence_family_sensitivity", "location_and_morphology", "mask_family_profiles", "painting_specific_robustness", "runtime_stability", "supported_conclusions", "thesis_contribution"]
    separately_persisted_canonical_figures: 2
    minimum_embedded_analytical_views: 10
    minimum_embedded_restoration_or_diagnostic_panels: 8
    approximate_embedded_tile_count: 100
    image_max_dimension_pixels: 900
    photographic_format: "JPEG"
    photographic_quality: 82
    soft_report_size_warning_mib: 45
    required_visuals_must_not_depend_on_links: true
    require_section_level_conclusions: true
    require_evidence_to_assertion_pairs: true
    require_nearby_scope_and_limitations: true
    require_mixed_paragraph_bullet_table_visual_structure: true

  expected_counts:
    paintings: 5
    categories: 5
    mask_families: 3
    robustness_groups: 15
    variants_per_group: 5
    cases: 75
    candidates: 225
    candidates_by_model: {opencv_telea: 75, lama: 75, stable_diffusion_inpainting: 75}
    selected_classical_source_rows: 6750
    selected_lpips_source_rows: 450
    selected_feature_source_rows: 900
    selected_spatial_source_rows: 2025
    normalized_spatial_rows: 28350
    selected_local_source_rows: 29475
    selected_semantic_source_rows: 6300
    selected_metric_source_rows: 45900
    normalized_quality_rows: 72225
    runtime_rows: 225
    comparison_crosscheck_rows: 960
    quality_anchors: 11
    variant_quality_rows: 2475
    group_quality_dispersion_rows: 1485
    model_dispersion_summary_rows: 132
    paired_model_dispersion_contrast_rows: 132
    variant_family_balanced_rank_rows: 225
    group_rank_stability_rows: 135
    anchor_winner_stability_rows: 330
    group_sensitivity_summary_rows: 15
    morphology_association_rows: 297
    runtime_group_dispersion_rows: 135
    runtime_model_summary_rows: 12
    canonical_analysis_rows: 5373
    canonical_figures: 2
    artifact_records: 5
    canonical_output_files: 7

  evidence_policy:
    independent_mask_family_effect_permitted: false
    independent_damage_size_effect_permitted: false
    category_effect_permitted: false
    style_effect_permitted: false
    stochastic_uncertainty_claim_permitted: false
    historical_authenticity_claim_permitted: false
    conservation_approval_claim_permitted: false
    runtime_is_quality_evidence: false
    metric_disagreement_retained: true

  known_limitations:
    - "Five paintings are the independent units; 75 cases are not 75 independent artworks."
    - "One painting per category means painting and category effects cannot be separated."
    - "Mask family is deliberately paired with one target area: scratch_thin at 2 percent, loss_small at 4.5 percent, and loss_large at 12.5 percent. Independent family and damage-size effects therefore cannot be separated."
    - "The five variants are controlled computational realizations rather than observations of naturally occurring painting damage."
    - "Stable Diffusion uses one preselected primary candidate per input mask; the analysis measures input-mask robustness, not repeated-seed uncertainty."
    - "General-purpose image metrics are computational proxies rather than conservation judgements."
    - "Runtime depends on the recorded hardware, software, and system load and is operational rather than quality evidence."
