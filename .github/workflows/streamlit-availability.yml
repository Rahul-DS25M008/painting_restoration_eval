name: Streamlit availability check

on:
  # Cloudflare Cron dispatches this workflow; manual runs remain available.
  # Setup and schedule maintenance: tools/streamlit_scheduler/README.md.
  workflow_dispatch:
  # Verify watcher changes immediately; recurring dispatch remains Cloudflare-owned.
  push:
    branches: [main]
    paths:
      - '.github/workflows/streamlit-availability.yml'
      - 'tools/check_streamlit_availability.py'
      - 'tests/test_streamlit_availability.py'

permissions:
  contents: read

concurrency:
  group: streamlit-availability
  cancel-in-progress: false

jobs:
  visit-dashboard:
    # Forks must not start visiting the original author's deployment.
    if: github.repository == 'Rahul-DS25M008/painting_restoration_eval'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      AVAILABILITY_BROWSER_CHANNEL: chromium
    steps:
      - name: Check out only the availability script and its tests
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/check_streamlit_availability.py
            /tests/test_streamlit_availability.py

      - name: Set up isolated check environment
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install browser checker only
        shell: bash
        run: |
          python -m pip install --no-cache-dir playwright==1.62.0
          # Retain the pilot branch's workaround for stale runner Chrome APT metadata.
          # Playwright installs its own Chromium; these entries are unrelated.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          for attempt in 1 2 3; do
            if python -m playwright install --with-deps chromium; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Playwright browser installation failed after 3 attempts."
              exit 1
            fi
            sleep 20
          done

      - name: Test wake-up and readiness detection
        run: python -m unittest discover -s tests -p test_streamlit_availability.py -v

      # Public entry gets 120 seconds, then /~/+/ is tried within the same
      # 600-second browser budget. A fallback pass emits a warning and summary.
      - name: Verify dashboard with bounded direct-route fallback
        env:
          AVAILABILITY_DIAGNOSTICS_DIR: availability-diagnostics
        run: python tools/check_streamlit_availability.py

      - name: Save public-page browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: availability-browser-diagnostics
          path: availability-diagnostics/
          retention-days: 7
          if-no-files-found: ignore

      # No commits, app restarts, credentials, or datasets. Diagnostic artifacts
      # contain public-page screenshots and sanitized browser errors only.
      # Scheduling is owned by Cloudflare, not GitHub's schedule event.
      # Check recent runs and token expiry periodically; this is not an uptime SLA.
