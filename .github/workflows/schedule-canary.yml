name: Schedule canary

# Temporary scheduler diagnostic: observe for 30–60 minutes after pushing to main.
# Disable or remove after diagnosis; this does not visit or wake the dashboard.
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirm-scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record scheduled execution
        run: |
          echo "Event: $GITHUB_EVENT_NAME"
          date -u
