# Optional CLI deployment; dashboard setup is documented in README.md.
# Never put a GitHub token in this configuration.
name = "streamlit-keepalive-dispatcher"
main = "worker.mjs"
compatibility_date = "2026-09-04"
workers_dev = false
preview_urls = false

[triggers]
# Current interval: 30 minutes. Align with the dashboard before any CLI deploy.
# For a future hourly interval, use "0 * * * *" instead.
crons = ["*/30 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1
