# Optional CLI deployment; dashboard setup is documented in README.md.
# Never put a GitHub token in this configuration.
name = "streamlit-keepalive-dispatcher"
main = "worker.mjs"
compatibility_date = "2026-09-04"
workers_dev = false
preview_urls = false

[triggers]
crons = ["17 */3 * * *"]

[observability]
enabled = true
head_sampling_rate = 1
