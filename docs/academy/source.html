      const COURSE = {"chapters":[{"key":"n01","label":"01","title":"Dataset verification","phase":"Foundations","purpose":"Freeze a technically valid, auditable 300-painting population before any transformation.","inputs":["metadata_300.csv","raw museum images","controlled_300.yaml"],"method":["Enforce p001–p300 identity and file/row agreement.","Balance five operational visual categories at 60 paintings each.","Check licenses, dimensions, SHA-256 duplicates and dHash near-duplicates."],"decisions":["dHash Hamming threshold = 5.","Metadata completeness is tracked separately from image acceptance.","The five categories are operational groupings, not validated art-historical styles."],"facts":[["300","accepted artworks"],["60 × 5","balanced categories"],["268","style/date/medium records"]],"claim":"The controlled collection is complete, duplicate-checked and exactly category-balanced.","limit":"It does not represent all painting traditions, regions or conservation conditions.","asset":"n01","source":"outputs/01_dataset_verification/data/artworks.csv","lab":{"prompt":"Which statement is defensible?","choices":["The sample represents painting history","The five categories are validated styles","The collection is technically valid and balanced"],"answer":2,"why":"Balance and validation are established; historical representativeness is not."},"check":{"prompt":"What is the independent collection unit?","choices":["Metric row","Painting","Damage mask"],"answer":1,"why":"The study begins with 300 paintings; later rows are nested evidence."},"plain":"Before running any restoration experiment, this notebook proves which 300 image files belong to the study, whether every image matches one metadata row, and whether accidental duplicate artworks entered the collection.","population":["300 accepted paintings are the collection units.","Five operational visual categories contain exactly 60 paintings each.","The category labels support this experiment; they are not validated art-historical styles."],"walkthrough":["Match every metadata row to one readable image and enforce one unique ID from p001 to p300.","Check dimensions, source and recorded rights fields against the inclusion rules.","Use SHA-256 to find files whose bytes are exactly identical.","Use 64-bit dHash and Hamming distance to screen images that look nearly identical even when their bytes differ.","Summarize category balance, source concentration and missing descriptive metadata without excluding otherwise valid images."],"terms":[["Metadata","Descriptive information such as title, artist, date, medium, source and recorded rights."],["SHA-256","A long digital fingerprint of a file. Matching values mean the file bytes are identical."],["dHash","A small image fingerprint based on relative brightness patterns. It can find visually similar images whose file bytes differ."],["Hamming distance","The number of bit positions where two hashes differ. Smaller means more similar; this study reviewed pairs at distance 5 or less."],["Operational category","A practical grouping created for the experiment, not necessarily an accepted art-historical movement."],["Metadata completeness","How many desired descriptive fields are populated. Missing optional metadata does not automatically invalidate an image."]],"why":"Exact file identity and visual similarity are different problems, so SHA-256 and dHash serve different roles. Category balance is also kept separate from historical representativeness.","validation":["300 of 300 records were accepted with no exclusions.","Zero exact-duplicate groups and zero near-duplicate candidate pairs were found under the declared checks.","The audit contains 448 rows and the consolidated validation contains 50 rows.","Date/period, style/period and medium are present for 268 of 300 paintings."],"evidence_reading":["First verify the five equal category counts.","Then inspect source concentration: 32 source labels exist, but the largest contributes 109 paintings.","Finally separate technical acceptance from incomplete historical metadata."],"overclaims":["The five categories represent the history of painting.","No possible form of semantic redundancy exists.","Recorded open-access/public-domain information is a universal legal guarantee."],"practice":[{"prompt":"What does a dHash Hamming distance of 2 mean relative to 20?","choices":["The first pair is much more visually similar","The files are byte-identical","The second pair has better metadata"],"answer":0,"why":"Hamming distance counts differing hash bits; smaller means closer perceptual fingerprints."}],"quiz":[{"prompt":"Which result tests exact byte identity?","choices":["dHash","SHA-256","Visual category"],"answer":1,"why":"SHA-256 is the byte-level file fingerprint."},{"prompt":"Why is visual category used for complete grouping?","choices":["It is available for all 300","It proves art-historical style","It removes source imbalance"],"answer":0,"why":"The historical style field is incomplete, while the operational category is populated for every painting."}]},{"key":"n02","label":"02","title":"Image preprocessing","phase":"Foundations","purpose":"Create one reproducible 768 × 768 RGB reference canvas while retaining the full visible painting.","inputs":["N01 artwork registry","raw image bytes","canonical_768.yaml"],"method":["Apply EXIF orientation and convert or assume sRGB.","Resize with Lanczos while preserving aspect ratio.","Pad with source median RGB and record exclusive content bounds."],"decisions":["Odd padding goes right/bottom.","Padding is technical canvas, not painting content.","The normalized digital image is a within-study reference, not historical ground truth."],"facts":[["768²","RGB canvas"],["261","images without ICC"],["300","validated outputs"]],"claim":"Every artwork has a stable reference canvas and an explicit content boundary.","limit":"Museum photography, colour management and digitization remain acquisition-domain limitations.","asset":"n02","source":"outputs/02_image_preprocessing/data/preprocessed_images.csv","lab":{"prompt":"Where should padding-sensitive metrics operate?","choices":["Across all 768² pixels","Inside recorded content bounds","Only on image corners"],"answer":1,"why":"The content rectangle separates painting pixels from technical padding."},"check":{"prompt":"What does normalization establish?","choices":["Historical truth","A reproducible within-study reference","Physical pigment identity"],"answer":1,"why":"It standardizes the computational comparison only."},"plain":"Museum images arrive with different shapes, sizes and colour metadata. N02 converts each accepted source into the same 768 × 768 technical canvas while recording exactly which pixels are painting content and which are artificial padding.","population":["All 300 N01 paintings enter preprocessing.","N02 produces 300 RGB PNGs and 300 geometry records.","Padding is required for 299 non-square images; one image needs none."],"walkthrough":["Require EXIF orientation 1; a non-default orientation blocks processing instead of causing a silent or undocumented rotation/mirror operation.","Handle ICC profiles in three explicit branches: missing→assume sRGB without conversion; embedded sRGB→preserve pixels and strip profile; non-sRGB→convert to sRGB with perceptual intent.","Resize the complete source with Lanczos interpolation while preserving its width-to-height ratio; use round-half-up dimensions and do not crop or stretch it.","Centre the resized painting on a 768 × 768 canvas filled with the source image's median red, green and blue values; any odd extra padding pixel goes right or bottom.","Record the resize scale, four padding amounts and an exact zero-based xyxy content box whose maximum coordinates are exclusive."],"terms":[["EXIF orientation","A file instruction describing rotation or mirroring. This pipeline accepts orientation 1 and blocks non-default values."],["ICC profile","Embedded information describing how numerical colour values should be interpreted."],["sRGB","The common colour space adopted as this pipeline's computational reference."],["Lanczos interpolation","A high-quality calculation for estimating new pixel values when an image is resized."],["Aspect ratio","The proportional relationship between image width and height."],["Median-RGB padding","Artificial canvas filled using the middle red, green and blue source values instead of fixed black or white."],["Round half up","When a dimension lies exactly halfway between integers, round it upward rather than using banker's rounding."],["xyxy-exclusive box","Left, top, right and bottom coordinates where right and bottom mark the first pixel outside the content."]],"why":"Stretching would change shapes and cropping would discard visible content. Padding preserves the full supplied image, while the recorded content box prevents padding from contaminating later measurements.","validation":["300 inputs produced 300 readable 768 × 768 RGB PNGs.","All 50 consolidated checks passed with zero missing, stale, orphaned, duplicate or geometry-failed outputs.","ICC states were 261 missing, 19 embedded sRGB and 20 embedded non-sRGB.","Padding was left/right for 138, top/bottom for 161 and absent for one image."],"evidence_reading":["Compare the original shape with the square output without mistaking the padded bars for painting content.","Use the recorded rectangle—not padding colour—to identify valid painting pixels.","Notice that normalization creates comparable geometry, not a historically verified original."],"overclaims":["Every output pixel belongs to the painting.","Assuming sRGB proves perfect colour fidelity.","The clean normalized image is historical ground truth."],"practice":[{"prompt":"Why use padding instead of stretching?","choices":["To preserve the painting's aspect ratio","To increase the metric score","To imitate a frame"],"answer":0,"why":"Padding keeps the source proportions intact."}],"quiz":[{"prompt":"What does Lanczos do here?","choices":["Generates missing content","Calculates resized pixels","Detects duplicates"],"answer":1,"why":"Lanczos is the interpolation rule used during resizing."},{"prompt":"What must region-sensitive metrics exclude?","choices":["All dark paint","Recorded technical padding","All image borders"],"answer":1,"why":"The N02 content box separates painting content from artificial canvas."}]},{"key":"n03","label":"03","title":"Canonical masks","phase":"Foundations","purpose":"Generate deterministic, quantitatively distinct missing-region geometries for every painting.","inputs":["N02 content geometry","canonical_binary.yaml","deterministic seeds"],"method":["Generate zero, scratch, small-loss, large-loss and mixed masks.","Restrict foreground to painting content.","Audit area, components, compactness, elongation and replay."],"decisions":["Masks are binary 0/255.","Scratch targets 2%; small loss 4.5%; large loss 12.5%; mixed 11.5%.","Morphology gates distinguish families beyond area alone."],"facts":[["1,500","masks"],["5","families per painting"],["0","validation failures"]],"claim":"The benchmark uses reproducible, morphologically distinct masks contained within painting content.","limit":"These are experimental instruments, not expert damage annotations or prevalence estimates.","asset":"n03","source":"outputs/03_canonical_mask_generation/data/masks.csv","lab":{"prompt":"Which family should be long and thin?","choices":["loss_large","scratch_thin","zero_control"],"answer":1,"why":"Scratch masks require a high aspect ratio and low fill ratio."},"check":{"prompt":"What does deterministic replay test?","choices":["The same inputs reproduce the same mask","The mask resembles real damage","Every mask is equally difficult"],"answer":0,"why":"Replay is a reproducibility check, not realism validation."},"plain":"N03 creates controlled black-and-white instructions showing where later notebooks may remove pixels. It creates the same five experimental roles for every painting while varying the actual geometry deterministically.","population":["300 paintings × five families produce 1,500 painting–mask cases.","There are 300 empty zero controls and 1,200 nonzero masks.","Every family contributes exactly 300 masks; repeated masks are not extra independent paintings."],"walkthrough":["Create an empty zero-control mask that later pipelines handle as an identity/no-op baseline; it does not test whether a model hallucinates under an empty mask because inference is bypassed.","Draw thin scratches as several narrow polylines; draw small losses as several irregular blobs; draw large losses as one or two larger blobs.","Build mixed damage by uniting scratches, scattered small losses, one medium loss and an edge loss.","Use target/allowed content fractions of zero 0%; scratch 2% within 1–3%; small loss 4.5% within 3–6%; large loss 12.5% within 10–15%; mixed 11.5% within 8–15%.","Derive stable seeds from identifiers and global seed 20260630; try deterministic retry seeds until the first candidate passes, blocking after 30 unsuccessful attempts.","Clip every mask to N02's content box, save exact binary values, measure its geometry and replay generation to test reproducibility."],"terms":[["Binary mask","A grayscale instruction image containing only 0 for preserved pixels and 255 for pixels treated as missing."],["Morphology","The measurable shape of a mask: area, elongation, compactness, components and boundary behaviour."],["Connected component","One continuous island of foreground mask pixels."],["Compactness","A number describing whether a region is blob-like or thin and irregular."],["Deterministic seed","A fixed number that initializes procedural randomness so the same inputs can recreate the same result."],["Replay validation","Generate the mask again and compare it with the saved mask; this tests reproducibility, not realism."],["Population-level gate","A rule evaluated on a family's distribution or median. It separates experimental families without claiming every individual mask is realistic."]],"why":"Damage area alone cannot distinguish a scratch from a blob. The design therefore controls both area ranges and population-level shape measurements.","validation":["All 1,500 expected rows and PNGs exist; all 50 consolidated checks and 24 completion requirements passed.","Masks are 768 × 768 mode-L PNGs containing only 0 and 255, with zero padding overlap.","Family gates include scratch median fill ratio ≤0.05 and aspect ≥3; small-loss median components ≥3; large-loss median largest-component fraction ≥0.75 and area at least twice small loss; mixed median components ≥4, boundary-touch fraction ≥0.80 and aspect ≥2.","There were zero missing, stale, orphaned, nonbinary, area, morphology or replay failures. The maximum retry count was 30; p231/loss_large succeeded on that final allowed attempt."],"evidence_reading":["Read white as the permitted missing region and black as protected context.","Compare area and shape together: scratches are thin, small loss is multi-component, and large loss is dominated by one large region.","Remember that morphology gates summarize families; they do not prove every individual mask perfectly resembles a real scratch or loss."],"overclaims":["All 1,500 masks contain damage; 300 are deliberately empty controls.","Zero controls test model hallucination; implemented inference pipelines bypass them and preserve identity.","Every mask equals its nominal target percentage; candidates only have to fall inside an allowed interval.","Replay proves realism or conservation validity.","The masks describe how often these damages occur in real paintings."],"practice":[{"prompt":"Why is 1,500 not the number of damaged cases?","choices":["Some files failed","300 masks are empty controls","Only large losses count"],"answer":1,"why":"The zero-control family deliberately contains no damaged pixels."}],"quiz":[{"prompt":"Which mask family combines scratches, blobs and an edge loss?","choices":["loss_large","mixed_damage","zero_control"],"answer":1,"why":"Mixed damage unions several procedural primitives."},{"prompt":"Does every mixed mask have to equal exactly 11.5%?","choices":["Yes","No; it must fall within 8–15%","Only for portraits"],"answer":1,"why":"11.5% is the target, while the accepted interval is broader."}]},{"key":"n04","label":"04","title":"Canonical damage","phase":"Foundations","purpose":"Convert clean images and masks into controlled restoration inputs with no unintended pixel changes.","inputs":["N02 clean images","N03 masks","canonical_damage.yaml"],"method":["Fill masked pixels with RGB white [255,255,255].","Copy zero controls byte-for-byte.","Audit changed pixels inside and outside the mask."],"decisions":["Pre-existing white pixels count as masked but unchanged.","Expected changed = mask pixels − pre-existing white pixels.","Outside-mask changes must equal zero."],"facts":[["1,500","damaged images"],["37,996,554","mask pixels"],["0","outside-mask changes"]],"claim":"Every damaged image differs from its reference only where its mask permits.","limit":"White fill is a controlled corruption, not a realistic physical loss or treatment.","asset":"n04","source":"outputs/04_canonical_damaged_image_generation/metrics/damage_audit.csv","lab":{"prompt":"Why can changed pixels be fewer than mask pixels?","choices":["Compression","Some source pixels were already white","The masks overlap padding"],"answer":1,"why":"White source pixels remain numerically unchanged after white fill."},"check":{"prompt":"What is the strongest integrity check?","choices":["No pixel changes outside the mask","All damages look realistic","All masks have identical area"],"answer":0,"why":"The contract is controlled localization, not identical appearance."},"plain":"N04 turns a clean image and its binary mask into the actual controlled input shown to restoration methods. The corruption is deliberately simple so every changed pixel can be accounted for exactly.","population":["300 paintings × five canonical families produce 1,500 damaged-image cases.","The 300 zero controls are exact copies, while 1,200 cases contain nonzero masks.","Every case is linked to one N02 clean image and one N03 mask."],"walkthrough":["Check that the clean image and mask share the same 768 × 768 geometry.","For nonzero masks, replace every permitted pixel with RGB white [255, 255, 255].","For a zero control, copy the clean source exactly instead of running a needless modification.","Count mask pixels, already-white source pixels and actually changed pixels separately.","Reload every saved output and prove that no pixel outside the mask changed."],"terms":[["Corruption strategy","The controlled rule used to replace pixels selected by a mask."],["Mask pixel","A location selected for corruption, even if its original RGB value already equals the fill colour."],["Changed pixel","A location whose before and after RGB values are numerically different."],["Zero control","An undamaged case used to verify that later processing can leave an image unchanged."],["Outside-mask invariance","The rule that all pixels outside the permitted region must remain exactly unchanged."],["Byte-identical","Two files contain exactly the same sequence of bytes."]],"why":"White fill is not claimed to look like real damage. Its value is experimental control: the permitted change region and every numerical change are unambiguous.","validation":["All 1,500 canonical damaged images were produced and validated.","37,996,554 pixels were selected by masks; 13,185 were already white.","Expected changed pixels were therefore 37,983,369, exactly matching the observed count.","No outside-mask pixel changed."],"evidence_reading":["First compare clean and mask, then confirm white fill only appears inside mask support.","Do not interpret an already-white masked pixel as a pipeline failure; it was selected but did not numerically change.","Treat the output as a controlled restoration input, not a depiction of material loss."],"overclaims":["White fill realistically simulates historical paint loss.","Every mask pixel must have a different RGB value after filling.","Localization validity proves conservation relevance."],"practice":[{"prompt":"37,996,554 mask pixels include 13,185 already-white pixels. Expected changed pixels?","choices":["37,996,554","37,983,369","13,185"],"answer":1,"why":"Subtract already-white source pixels from selected mask pixels."}],"quiz":[{"prompt":"What must a zero control produce?","choices":["A white image","An exact clean-image copy","A random restoration"],"answer":1,"why":"Zero controls test no-op behaviour."},{"prompt":"What is the strongest localization result?","choices":["Zero changes outside masks","All damages look realistic","All masks have equal area"],"answer":0,"why":"The audit proves controlled pixel localization."}]},{"key":"n05","label":"05","title":"Damage-size dataset","phase":"Foundations","purpose":"Isolate damage-area effects while holding painting identity and broad geometry matched.","inputs":["N03 loss_large masks","35 balanced paintings","damage-size contract"],"method":["Scale one base geometry to seven nested levels.","Use nearest-neighbour scaling around the centroid.","Apply deterministic radial correction and nesting checks."],"decisions":["Levels are 2, 4, 6, 8, 10, 15 and 20%.","Seven paintings per category give balanced coverage.","The 245 cases are repeated observations on 35 paintings."],"facts":[["35","painting trajectories"],["7","nested levels"],["245","matched cases"]],"claim":"The study contains precise, nested damage-size trajectories for a balanced 35-painting cohort.","limit":"It varies one loss geometry and cannot represent all damages or provide 245 independent artworks.","asset":"n05","source":"outputs/05_damage_size_sensitivity_dataset_generation/data/cases.csv","lab":{"prompt":"What stays fixed along one trajectory?","choices":["Painting and base geometry","Model and metric only","Category and random seed only"],"answer":0,"why":"Only area changes systematically; identity and geometric lineage stay matched."},"check":{"prompt":"What is the inferential unit?","choices":["245 cases","35 painting trajectories","Seven damage levels"],"answer":1,"why":"Levels are nested within paintings."},"plain":"N05 asks one focused question: what changes when the missing area grows? It follows the same base large-loss geometry through seven strictly nested sizes on a balanced subset of paintings.","population":["35 paintings: seven from each visual category.","Each painting has seven levels: 2%, 4%, 6%, 8%, 10%, 15% and 20%.","The result is 245 repeated cases but only 35 independent painting trajectories."],"walkthrough":["Select the declared balanced 35-painting cohort and each painting's canonical large-loss mask.","Resize that same base geometry equally in every direction around its original centre.","Use nearest-neighbour mask resizing so binary edges are not blurred into grey values.","Apply a deterministic radial correction to reach the requested integer pixel count.","Verify strict nesting: every smaller mask must be wholly contained in the next larger level."],"terms":[["Matched design","Repeated conditions come from the same painting, reducing unrelated between-painting variation."],["Nested masks","Every smaller damaged region is entirely contained within the next larger region."],["Realized percentage","The exact percentage obtained after converting a requested area into whole pixels."],["Isotropic scaling","Enlarging equally in every direction."],["Centroid","The geometric centre of the mask."],["Trajectory","The seven ordered observations belonging to one painting."]],"why":"Using one geometric lineage isolates damage area better than drawing an unrelated mask at every level. Statistical analysis must still respect that seven levels belong to the same painting.","validation":["All 245 cases were created across 35 trajectories.","Maximum area error was 0.00017507 percentage points against a 0.01 limit.","Maximum centroid shift was 1.958 pixels against a two-pixel limit.","No pixels were removed between successive levels and no mask touched the content boundary."],"evidence_reading":["Follow one row from 2% to 20% and confirm that the damaged region grows rather than jumps location.","Treat levels as repeated observations within a painting.","Do not generalize this large-loss trajectory to every mask family."],"overclaims":["There are 245 independent paintings.","The experiment measures thin-scratch size sensitivity.","A 20% synthetic loss represents a universal conservation threshold."],"practice":[{"prompt":"What is the independent repeated unit in N05?","choices":["245 cases","35 painting trajectories","Seven percentages"],"answer":1,"why":"The seven levels are nested within each of 35 paintings."}],"quiz":[{"prompt":"What changes systematically along a trajectory?","choices":["Painting identity","Damage area","Visual category"],"answer":1,"why":"Identity and geometric lineage stay matched."},{"prompt":"Why require strict nesting?","choices":["So larger levels add rather than relocate damage","To make every mask circular","To remove padding"],"answer":0,"why":"Nesting supports a controlled area progression."}]},{"key":"n06","label":"06","title":"Mask robustness dataset","phase":"Foundations","purpose":"Test whether conclusions depend on one fortunate mask placement or geometry.","inputs":["35-painting cohort","scratch/small/large mask policies","five variant seeds"],"method":["Hold painting, family and target area fixed.","Vary location, geometry and component arrangement.","Require distinct hashes, IoU separation and centroid spread."],"decisions":["Three families × five variants per painting.","Maximum allowed pairwise IoU is below 0.99.","Area-matched diversity is verified quantitatively."],"facts":[["105","matched groups"],["525","cases"],["0.700","max observed IoU"]],"claim":"Each robustness group contains genuinely different, area-matched masks.","limit":"The variants are controlled geometries, not samples from real conservation damage.","asset":"n06","source":"outputs/06_mask_robustness_dataset_generation/data/cases.csv","lab":{"prompt":"What is intentionally changed?","choices":["Model checkpoint","Mask placement and geometry","Painting category"],"answer":1,"why":"The robustness intervention is the mask realization."},"check":{"prompt":"Does low later dispersion prove high quality?","choices":["Yes","No, only stability to tested masks","Only for Stable Diffusion"],"answer":1,"why":"Robustness and quality are separate questions."},"plain":"N06 asks whether later conclusions depend on one fortunate mask placement. It creates five area-matched but spatially different variants for each selected painting and damage family.","population":["The same balanced 35 paintings are used.","Three families × 35 paintings produce 105 robustness groups.","Five variants per group produce 525 cases, still nested within 35 paintings."],"walkthrough":["Fix painting identity, damage family and target damaged-content percentage: scratch 2%, small loss 4.5% or large loss 12.5%.","Change the procedural seed so location, exact geometry and component arrangement vary across five variants.","Reject variants that duplicate earlier pixel support.","Measure pairwise overlap, movement of mask centres and diversity of morphology/component signatures.","Keep only groups that meet every area-matching and spatial-diversity gate."],"terms":[["Robustness group","Five cases sharing painting, family and target area while the mask realization changes."],["Variant","One specific location and geometry within a robustness group."],["Intersection over Union","Overlap divided by combined area. One means identical support; zero means no overlap."],["Centroid span","How far the five mask centres spread within a painting."],["Morphology signature","A compact label derived from measured shape properties."],["Arrangement signature","A compact label describing how many components exist and how they are spatially arranged."],["Robustness","How little a conclusion changes under the tested mask variations; it is not the same as quality."]],"why":"Matching area prevents simple size differences from masquerading as location or geometry effects. Multiple diversity checks stop nominal variants from being near-copies.","validation":["All 105 groups and 525 cases passed.","Pairwise IoU had to stay below 0.99; the observed maximum was 0.70027.","Centroid span had to reach 0.02 of the content diagonal; the observed minimum was 0.08415.","Every group had at least two morphology signatures and two component-arrangement signatures."],"evidence_reading":["Confirm that the five masks occupy visibly different locations while retaining similar area.","Use IoU and centroid span to verify spatial difference rather than relying only on appearance.","Later low metric dispersion means stability to these variants, not automatically good restoration."],"overclaims":["Five variants represent the real-world distribution of damage.","The most stable model is necessarily the most accurate.","Five masks create five independent paintings."],"practice":[{"prompt":"An IoU of 1 between two variants would mean…","choices":["Perfectly distinct masks","Identical support","Equal quality"],"answer":1,"why":"IoU equals one only when the two regions coincide."}],"quiz":[{"prompt":"What stays fixed inside a robustness group?","choices":["Painting, family and target area","Mask location","Component arrangement"],"answer":0,"why":"Only the mask realization is deliberately changed."},{"prompt":"What does low later dispersion establish?","choices":["Historical correctness","Stability to tested masks","High visual quality"],"answer":1,"why":"Robustness and restoration quality are separate properties."}]},{"key":"n07","label":"07","title":"Synthetic degradations","phase":"Foundations","purpose":"Create a separate, auditable branch for non-binary procedural degradation.","inputs":["N02 clean images","35 balanced paintings","synthetic_degradation.yaml"],"method":["Apply ten single effects at three severities.","Create three ordered moderate combinations.","Store grayscale effect support plus operator parameters and seeds."],"decisions":["Support threshold = 1; active threshold = 13.","Only localized water stain, dirt/dust, transparency and their combination enter masked removal.","Blur and global colour effects remain degradation diagnostics."],"facts":[["1,155","generated cases"],["10","single families"],["3","ordered combinations"]],"claim":"The pipeline contains deterministic procedural degradations with explicit support and severity.","limit":"RGB effects are controlled proxies, not physically calibrated material deterioration.","asset":"n07","source":"outputs/07_synthetic_degradation_dataset_generation/reports/degradation_protocol.md","lab":{"prompt":"Why is Gaussian blur not routed as an inpainting task?","choices":["It is too easy","It is a full-image degradation without a valid missing-region objective","No metric supports it"],"answer":1,"why":"Eligibility follows the restoration objective, not convenience."},"check":{"prompt":"What do mild/moderate/severe labels mean?","choices":["Clinical grades","Ordinal experimental settings","Expert conservation ratings"],"answer":1,"why":"They are configured strengths, not material-condition grades."},"plain":"Not every deterioration is a missing hole. N07 creates reproducible blur, colour, stain, dirt and transparency effects as a separate branch so the study can distinguish missing-region restoration from broader degradation analysis.","population":["35 balanced paintings are used.","Ten single effects × three severities produce 1,050 cases.","Three ordered combinations add 105 cases, for 1,155 total."],"walkthrough":["Apply ten single families—Gaussian blur, motion blur, local defocus, water stain, pigment bleeding, fading, discolouration, local darkening, dirt/dust and partial transparency—at mild, moderate and severe settings.","Apply three moderate combinations in a fixed order: fading→discolouration, water stain→dirt/dust and Gaussian blur→fading.","Save the degraded RGB image plus a grayscale influence map rather than pretending every effect is a binary hole.","Record seeds, parameters, changed pixels, colour/luminance shifts and texture measurements.","Leave the later eligibility decision to N08, which admits only localized effects with a meaningful removal objective."],"terms":[["Procedural degradation","An image effect generated reproducibly by code rather than observed historical damage."],["Influence map","A grayscale image showing where and how strongly an operator affected the source."],["Support threshold","The minimum influence used to identify the broad affected area; here it is 1. It is an image-effect cutoff, not confidence."],["Active threshold","The stronger cutoff used when a localized effect becomes a removal mask; here it is 13. It is not a probability."],["Ordinal severity","Ordered labels such as mild, moderate and severe without claiming equal physical intervals."],["Ordered composition","Applying effects in a fixed sequence because order can change the output."]],"why":"A binary inpainting mask is appropriate for localized removal objectives, but it is conceptually wrong for global blur or colour shifts. The separate branch preserves that distinction.","validation":["1,050 single and 105 combined cases were generated.","The ten single families each contain three declared parameter levels.","Every case retains its operator identity, seed, influence map and measured effect evidence.","N08 later selects only 350 localized cases for masked removal."],"evidence_reading":["Compare mild, moderate and severe as configured strengths, not conservation-condition grades.","Read the influence map as graded operator support, not missing paint.","Separate localized stains/dirt/transparency from full-image blur and colour changes."],"overclaims":["These RGB operators reproduce material chemistry or aging.","Every generated degradation is a valid inpainting task.","Mild/moderate/severe are expert condition ratings."],"practice":[{"prompt":"Which effect is methodologically unsuitable as a missing-region inpainting task?","choices":["Localized water stain","Gaussian blur","Localized dirt"],"answer":1,"why":"Blur changes information across the image without defining a missing region."}],"quiz":[{"prompt":"What does an influence map encode?","choices":["Graded effect support","Historical damage certainty","Expert annotation"],"answer":0,"why":"It records where the procedural operator acts."},{"prompt":"How many combined cases exist?","choices":["35","105","1,050"],"answer":1,"why":"Three combinations ×35 paintings produce 105 cases."}]},{"key":"n08","label":"08","title":"Contracts and region policy","phase":"Foundations","purpose":"Normalize experiment populations, route cases to methods and prohibit invalid metric–region calculations.","inputs":["N01–N07 producer tables","evaluation_contract.yaml","region geometry"],"method":["Register 3,425 cases and all case–method decisions.","Separate methodological eligibility from runtime availability.","Declare 11 regions × 13 metric families before evaluation."],"decisions":["2,620 cases per method are eligible; 805 are not.","SSIM/LPIPS/CLIP/DINO need contiguous regions, never sparse pixel lists.","Mask-bbox margin 8 px; boundary width 3 px."],"facts":[["3,425","registered cases"],["17,125","routing decisions"],["86 / 143","compatible region rules"]],"claim":"Every later calculation has an explicit case, method and region contract.","limit":"A compatible calculation is well-defined; it is not automatically meaningful for authenticity or conservation.","asset":"n08","source":"outputs/08_experiment_contracts_and_region_policy/reports/evaluation_contract.md","lab":{"prompt":"Where can SSIM evaluate damage-local structure?","choices":["Sparse masked pixels","A contiguous mask-bounding-box crop","Only the outside ring"],"answer":1,"why":"SSIM assumes spatial adjacency, so a crop is required."},"check":{"prompt":"Eligibility and availability are…","choices":["The same thing","Separate concepts","Only relevant to SDXL"],"answer":1,"why":"A valid method–case pairing can still fail or be unavailable at runtime."},"plain":"N08 is the experiment's traffic controller. It combines all generated case branches, decides which method–case pairings make methodological sense, and declares which image regions each metric may validly use.","population":["3,425 registered cases come from four experiment branches.","Five methods create 17,125 explicit routing decisions.","Each full method has 2,620 eligible and 805 ineligible cases."],"walkthrough":["Normalize the stable identifiers shared by N01–N07 without copying every producer-specific field.","Create one eligibility decision for every case and method, separating task suitability from whether execution later succeeds.","Build eleven regions: full image, content, exact mask, mask-bbox crop, inner band, outer band, combined boundary ring, outside-mask content, outside-boundary ring, degradation support and sliding patch window.","Cross thirteen families—classical pixel, SSIM, LPIPS, CLIP, DINOv2, spatial diagnostics, texture descriptor, texture map, colour, seam, pixel uncertainty, perceptual uncertainty and semantic patch—with those regions.","Use an 8-pixel bbox margin, 3-pixel boundary width, outside ring offset 3 plus width 8, and 224×224 patches at stride 112 with at least 50% content.","Prohibit calculations that destroy a metric's assumptions, such as SSIM on an unordered list of masked pixels."],"terms":[["Case","One controlled damaged or degraded input with a specific intervention identity."],["Candidate","One restoration method's output for a case."],["Methodological eligibility","Whether a method's task matches what the case needs."],["Runtime availability","Whether code, weights and hardware actually produced an output; this is separate from eligibility."],["Region policy","A predeclared rule specifying where a metric may be calculated."],["Contiguous region","A spatially coherent rectangle or neighbourhood, unlike an unordered list of pixels."],["Stable identifier","A persistent machine-readable name that lets tables and files refer to the same entity without relying on row order."],["Schema","The declared columns, types and meanings a table must follow."]],"why":"Without a registry, case counts can be confused with candidate counts. Without region policy, a valid formula can still be applied to a geometrically meaningless input.","validation":["1,500 canonical +245 size +525 robustness +1,155 degradation cases reconcile to 3,425.","All 17,125 case–method routing decisions are explicit.","The 143 metric–region rows contain 86 compatible and 57 prohibited combinations.","Eligible degradation cases total 350: water stain, dirt/dust, partial transparency and water-stain-plus-dirt."],"evidence_reading":["Start with the region drawing and identify exact damage, crop, boundary and context.","Then ask whether the chosen metric needs spatial neighbourhoods or can operate on selected pixels.","Treat compatibility as mathematical/methodological validity, not proof of meaningful conservation judgement."],"overclaims":["All 3,425 cases should be restored by every method.","Eligibility guarantees successful runtime execution.","A compatible metric automatically measures authenticity."],"practice":[{"prompt":"Why is SSIM prohibited on sparse masked pixels?","choices":["It is too slow","It needs spatial neighbourhoods","It only works on colour"],"answer":1,"why":"SSIM compares local spatial structure, which an unordered pixel list destroys."}],"quiz":[{"prompt":"How are 17,125 routing rows obtained?","choices":["3,425 cases ×5 methods","2,620 cases ×5 methods","300 paintings × five categories"],"answer":0,"why":"Every registered case receives a decision for every declared method."},{"prompt":"What is the correct local SSIM region?","choices":["Sparse mask pixels","Mask-bounding-box crop","Padding only"],"answer":1,"why":"The crop retains contiguous image structure."}]},{"key":"n09","label":"09","title":"Telea baseline","phase":"Restoration methods","purpose":"Provide a fast deterministic classical inpainting baseline over the full eligible population.","inputs":["N08 eligible cases","binary/effect masks","OpenCV Telea"],"method":["Run cv2.INPAINT_TELEA with radius 3 on CPU.","Use one fixed policy with no case tuning.","Preserve zero controls and outside-mask pixels exactly."],"decisions":["Telea propagates local neighbourhood structure.","2,320 true inferences plus 300 identity controls.","Resume and checksum logic protect long runs."],"facts":[["2,620","completed candidates"],["0.552 s","mean per case"],["0","failures"]],"claim":"Telea gives complete, fast and deterministic classical coverage.","limit":"Local interpolation cannot recover historically verified missing content.","asset":"n09","source":"outputs/09_opencv_telea_restoration/data/restorations.csv","lab":{"prompt":"What capability does Telea primarily represent?","choices":["Prompt-conditioned generation","Local classical interpolation","Transformer attention"],"answer":1,"why":"It is the classical deterministic baseline."},"check":{"prompt":"Are zero controls model inferences?","choices":["Yes","No, exact identity copies","Only on GPU"],"answer":1,"why":"They validate no-op behavior without invoking restoration."},"plain":"N09 supplies the simplest restoration baseline: a classical algorithm that fills inward from nearby visible pixels. It has no learned weights, prompt or stochastic seed.","population":["Telea covers all 2,620 eligible cases.","2,320 cases run the algorithm and 300 zero controls are identity copies.","There is no case tuning: radius is fixed at 3, with predeclared threshold 128 for binary masks and 13 for synthetic influence maps."],"walkthrough":["Read the case and its approved binary or thresholded influence mask.","Convert mask support using threshold 128 for binary damage or 13 for eligible synthetic degradation.","Run OpenCV's Telea inpainting with radius 3 on the CPU.","Keep zero controls unchanged and validate exact context outside the mask.","Record per-case runtime, checksums and resume state."],"terms":[["Inpainting","Filling a specified missing region using visible image context."],["Telea","A classical OpenCV method that propagates nearby colours and structure inward from the mask boundary."],["Inpaint radius","The neighbourhood size consulted around the advancing repair boundary; fixed at 3 here."],["Deterministic","The same image, mask and settings produce the same output."],["Mask threshold","A cutoff converting graded support into included versus excluded pixels."],["Identity control","Return the input unchanged instead of invoking restoration."]],"why":"A fast classical baseline reveals what can be achieved by local propagation alone, providing a useful contrast to learned and generative models.","validation":["All 2,620 eligible cases completed with no failures.","2,320 were true inferences and 300 were exact identity controls.","Total candidate runtime was 1,446.741 seconds; mean runtime was 0.552 seconds.","No output changed a pixel outside its approved mask."],"evidence_reading":["Look for smooth continuation of nearby colour and narrow structure.","Expect difficulty when a broad missing region requires semantic invention rather than local propagation.","Do not interpret speed as restoration quality."],"overclaims":["Telea recovers the historically correct missing content.","Fast runtime makes it the best-quality method.","Zero controls are additional model inferences."],"practice":[{"prompt":"What capability does Telea represent?","choices":["Prompt-conditioned generation","Classical local interpolation","Transformer attention"],"answer":1,"why":"Telea is the fixed classical baseline."}],"quiz":[{"prompt":"What is the fixed inpaint radius?","choices":["1","3","13"],"answer":1,"why":"The pipeline uses radius 3 for all cases."},{"prompt":"Why are there only 2,320 inferences among 2,620 outputs?","choices":["300 failed","300 are identity controls","300 are SDXL"],"answer":1,"why":"Undamaged controls are copied without running Telea."}]},{"key":"n10","label":"10","title":"LaMa baseline","phase":"Restoration methods","purpose":"Add a deterministic learned inpainting baseline with full eligible coverage.","inputs":["N08 cases","IOPaint LaMa weights","CUDA float32"],"method":["Run batched LaMa by experiment.","Composite generated content only inside the approved mask.","Validate numerical repeatability and exact outside-mask equality."],"decisions":["Tolerance allows max channel difference 1 across reruns.","Per-case times are allocated from batch wall time.","The checkpoint is fixed across all cases."],"facts":[["2,620","completed candidates"],["1.363 s","allocated mean"],["4","batch runs"]],"claim":"LaMa completes the same full population under one fixed learned configuration.","limit":"Plausibility is not historical correctness; allocated case times are batch estimates.","asset":"n10","source":"outputs/10_lama_restoration/data/restorations.csv","lab":{"prompt":"Why allow tiny rerun differences?","choices":["To hide failures","CUDA numerical variation can change a channel by one","LaMa is stochastic"],"answer":1,"why":"The method is deterministic in design, but hardware arithmetic need not be byte-identical."},"check":{"prompt":"What remains exact?","choices":["Every generated masked pixel","Outside-mask compositing","Batch wall time"],"answer":1,"why":"No approved output may change context outside the mask."},"plain":"N10 adds LaMa, a learned model that can use broader image context than Telea. It runs one fixed checkpoint over exactly the same eligible population so later comparisons remain matched.","population":["LaMa produces 2,620 outputs over the full eligible population.","2,320 are model inferences and 300 are identity controls.","Four experiment-group batch runs supply the production outputs."],"walkthrough":["Load the pinned LaMa checkpoint through the IOPaint implementation.","Batch eligible cases by experiment and run them on CUDA in float32.","Keep generated pixels only inside the approved mask and copy the clean context everywhere else.","Checkpoint progress so a long run can resume without silently duplicating or replacing valid outputs.","Test numerical repeatability with tight tolerances while retaining exact outside-mask equality."],"terms":[["LaMa","A learned inpainting model designed to use broader spatial context than local interpolation."],["IOPaint","The software wrapper used to execute the fixed LaMa checkpoint."],["Checkpoint","A saved set of learned model weights."],["CUDA","NVIDIA's GPU computing platform used to accelerate model inference."],["Float32","A 32-bit floating-point numerical format used for this inference run."],["Exact-mask compositing","Use generated pixels only inside the mask and original pixels everywhere else."],["Numerical repeatability","Tiny hardware-arithmetic differences are allowed within a declared tolerance."],["Allocated runtime","Per-case time estimated from a batch's wall-clock duration rather than timed separately."]],"why":"Exact compositing isolates what the model is permitted to change. Numerical tolerance acknowledges CUDA arithmetic without treating a deterministic design as stochastic.","validation":["All 2,620 outputs completed: 2,320 inferences plus 300 identity controls.","Repeat runs allow maximum channel difference 1, mean absolute difference at most 0.005 and different-pixel fraction at most 0.01.","Outside-mask equality remains exact.","Allocated runtime total was 3,570.487 seconds; complete observed execution was 4,594.223 seconds."],"evidence_reading":["Compare continuity inside the mask while checking that visible context is unchanged.","Separate a one-level numerical rerun difference from a meaningful content change.","Treat reported case time as a batch allocation, not direct per-call timing."],"overclaims":["A plausible LaMa completion is historically authentic.","Allocated per-case runtime is individually measured.","Deterministic design guarantees byte identity across all hardware and library versions."],"practice":[{"prompt":"Why can a deterministic LaMa rerun differ by one channel level?","choices":["Random prompts","CUDA numerical arithmetic","Different masks"],"answer":1,"why":"Tiny hardware-level arithmetic variation is tolerated under the declared repeatability policy."}],"quiz":[{"prompt":"What remains exact despite numerical tolerance?","choices":["Every masked pixel","Outside-mask context","Batch runtime"],"answer":1,"why":"Exact compositing protects all unmasked pixels."},{"prompt":"What does 1.363 seconds represent?","choices":["An allocated mean per case","A fixed timeout","A quality score"],"answer":0,"why":"IOPaint exposed group timing, which was allocated to cases."}]},{"key":"n11","label":"11","title":"Stable Diffusion branch","phase":"Restoration methods","purpose":"Build the stochastic, prompt-conditioned branch and its controlled seed/prompt interventions.","inputs":["N08 cases","artwork metadata","SD1.5 inpainting revision"],"method":["Use DDIM 30 steps, guidance 7.5, strength 1.0 at 512 inference.","Composite back to the 768 benchmark only inside masks.","Separate primary, context-prompt, scratch-aware and repeated-seed roles."],"decisions":["Seeds 2026–2029 support four-candidate groups.","Scratch experiment is 300 paintings × 4 seeds × 2 prompts.","Exploratory p01–p04 prompts receive N13–N17 metrics but stay outside primary comparison, flag and report unions."],"facts":[["8,520","total candidates"],["4","explicit candidate roles"],["19.93 h","recorded runtime"]],"claim":"Stable Diffusion supplies a complete primary set plus explicitly separated prompt and seed experiments.","limit":"Seed disagreement is empirical instability, not calibrated confidence; plausibility is not authenticity.","asset":"n11","source":"outputs/11_stable_diffusion_restoration/reports/prompt_policy.md","lab":{"prompt":"Which candidates enter the primary comparison?","choices":["Best metric candidate per case","The preselected generic-primary candidate","All prompts pooled"],"answer":1,"why":"Selection is metric-independent and prevents cherry-picking."},"check":{"prompt":"What must stay fixed in a seed group?","choices":["Case, prompt and generation configuration","Only painting","Only model name"],"answer":0,"why":"Only the seed changes."},"plain":"N11 introduces the stochastic, prompt-conditioned method. It separates the one primary candidate used for matched comparison from controlled experiments that change prompt wording or random seed.","population":["2,620 p00 generic-primary outputs cover every eligible case.","All roles together produce 8,520 rows: 2,620 p00 primary, 3,260 p01–p04 context prompts, 1,200 p05 scratch-aware candidates and 1,440 extra p00 seed candidates.","All 8,520 receive N13–N17 metrics; the 3,260 exploratory context candidates are excluded only from later primary comparison, flag and report unions."],"walkthrough":["Load the pinned Stable Diffusion 1.5 inpainting model and DDIM scheduler.","Generate at 512 × 512 using 30 denoising steps, guidance 7.5 and strength 1.0, then resize the generated result to the 768 benchmark.","Threshold/downsample the mask for inference and apply exact 768-mask compositing afterward; very thin scratches can fragment during the 512 conversion and this remains a limitation.","Keep p00 generic-primary with seed 2026 for the main matched comparison.","Use p01–p04 for exploratory metadata-context prompts and p05 for the preregistered thin-scratch damage-aware arm; positive prompts describe desired continuity and negative prompts discourage defects.","Run separate prompt and four-seed interventions in which only the declared factor changes."],"terms":[["Diffusion model","A generative model that repeatedly denoises a random starting pattern into an image."],["Seed","The number initializing randomness; changing only the seed creates another candidate under the same policy."],["Scheduler","The rule controlling the denoising sequence; this study uses DDIM."],["Guidance scale","How strongly generation follows prompt conditioning; fixed at 7.5."],["Strength","How fully the selected region is regenerated; fixed at 1.0."],["Positive prompt","Text describing visual properties the generator should produce."],["Negative prompt","Text describing visual defects or content the generator should avoid."],["Prompt arm","One predeclared wording condition used in a controlled comparison."],["p00–p05 roles","Stable labels separating generic primary/seed evidence, four exploratory context prompts and the scratch-aware prompt."]],"why":"Candidate roles are separated to prevent choosing whichever prompt or seed happens to score best. In a valid seed group, case, prompt and all generation settings remain fixed.","validation":["Candidate arithmetic reconciles to 8,520 rows: 2,620 primary, 3,260 context, 1,200 scratch-aware and 1,440 uncertainty extensions.","There were 8,220 actual model inferences plus 300 identity controls.","The formal scratch experiment contains 2,400 matched outcomes: 300 paintings ×4 seeds ×2 prompt arms.","Recorded total runtime was 71,737.586 seconds, about 19.93 hours."],"evidence_reading":["Identify the candidate role before comparing images; primary, prompt ablation and uncertainty candidates answer different questions.","Within a seed group, interpret visible variation as empirical stochastic disagreement.","Do not select the visually or numerically best seed as the primary output after seeing results."],"overclaims":["Low seed disagreement proves correctness or calibrated confidence.","Prompt-conditioned plausibility proves historical authenticity.","All 8,520 candidates belong in the same primary comparison population."],"practice":[{"prompt":"What may change inside a valid repeated-seed group?","choices":["Only the seed","Prompt and mask","Model revision"],"answer":0,"why":"Case, prompt and generation configuration are held fixed."}],"quiz":[{"prompt":"What is DDIM here?","choices":["A denoising scheduler","A colour metric","A duplicate detector"],"answer":0,"why":"It controls the diffusion denoising sequence."},{"prompt":"What does guidance 7.5 control?","choices":["Prompt influence","Mask area","Image resolution"],"answer":0,"why":"Guidance scale controls how strongly prompt conditioning steers generation."}]},{"key":"n12","label":"12","title":"Bounded SDXL → HINT selection → full HINT","phase":"Restoration methods","purpose":"Close two capability gaps: test a costly modern diffusion model under bounds, then select and run a full additional learned method.","inputs":["N12 bounded SDXL","D01 HINT–MAT pilot","N12A HINT production"],"method":["SDXL schedules 35 balanced cases under watchdog and global budgets.","D01 compares HINT and MAT on 12 predeclared cases and nine separate anchors.","HINT then runs all 2,620 eligible cases at native 768."],"decisions":["SDXL: 24 completed, 1 timeout, 10 budget-skipped.","HINT wins 96/108 pilot anchor comparisons; MAT wins 6, with 6 ties.","Selection considered quality, runtime, memory, visual evidence and licensing—no combined score."],"facts":[["24 / 35","valid SDXL outputs"],["2,620","full HINT candidates"],["4.45 h","HINT production"]],"claim":"HINT adds a second full learned architecture; SDXL remains useful bounded evidence rather than a full benchmark.","limit":"The 12-case HINT–MAT pilot supports selection, not population inference; SDXL omissions are compute states, not quality failures.","asset":"n12","source":"outputs/37_hint_mat_method_selection/reports/method_selection_report.html","lab":{"prompt":"Why was HINT selected?","choices":["It won every possible criterion","It had substantially stronger paired evidence and passed gates","It used the least memory"],"answer":1,"why":"MAT used less GPU memory and won some evidence; the decision was multi-evidence, not absolute."},"check":{"prompt":"Can the 24 SDXL outputs support a full ranking?","choices":["Yes","No","Only after averaging metrics"],"answer":1,"why":"The branch is explicitly bounded and incomplete."},"plain":"This chapter joins three linked decisions: test expensive SDXL under a fixed compute budget, compare HINT with MAT to fill a missing architectural capability, and then run the selected HINT method over the complete eligible benchmark.","population":["N12 scheduled 35 balanced cases across 30 paintings; 24 completed cases cover 19 paintings. One case timed out and ten were not started after the guard.","D01 compared HINT and MAT on 12 paired cases nested in five paintings.","N12A then produced 2,620 HINT outputs: 2,320 inferences and 300 identity controls."],"walkthrough":["Run SDXL at 768 × 768 under a 25,200-second global budget, 900-second case watchdog and 660-second minimum-start reserve.","Treat completed, timed-out and budget-skipped states separately; only completed valid images carry quality evidence.","Compare HINT and MAT on the same 12 predeclared cases using nine separate quality anchors, visual inspection, runtime, memory and licensing—without a combined score.","Select HINT after it wins 96 of 108 anchor comparisons while still recording MAT's six wins, six ties and memory advantage.","Run the official HINT Places2 checkpoint natively at 768 × 768 over all 2,620 eligible cases."],"terms":[["Bounded evaluation","A deliberately limited study with a frozen case list and compute budget."],["Watchdog","A timer that stops one case when it exceeds its allowed runtime."],["Budget-skipped","A planned case not started because insufficient global time remained."],["HINT","The selected deterministic mask-aware transformer-style inpainting model, able to use long-range context and run natively at 768 in this study."],["MAT","The alternative transformer inpainting method tested through a 512-pixel adapter; it used less memory but lost most paired anchors."],["Places2","The scene-image dataset used to train the HINT checkpoint; its domain differs from paintings and remains a limitation."],["Domain gap","A mismatch between a model's training images and the paintings on which it is evaluated."],["Paired design","Both methods process the same cases, making their evidence directly comparable."],["Quality anchor","One predeclared representative metric-and-region measure."],["Adapter","A conversion used to fit a model's required input size or mask convention; MAT needed a 512-pixel adapter while HINT ran natively at 768."],["CUDA / float32","GPU execution using NVIDIA CUDA and 32-bit floating-point arithmetic."]],"why":"The bounded SDXL branch prevents hardware limitations from being disguised as a full benchmark. The HINT–MAT decision keeps separate evidence visible so a human-owned selection is not hidden inside one invented score.","validation":["SDXL states were 24 completed, one timeout and ten budget-skipped; all completed images passed geometry and outside-mask checks.","D01 produced 24 candidates across 12 paired cases and 108 anchor comparisons.","HINT won 96 anchors, MAT six and six tied; MAT nevertheless used much less GPU memory.","N12A completed all 2,620 HINT outputs with all 82 checks passing in about 4.45 allocated hours."],"evidence_reading":["Keep the three populations separate: bounded SDXL, selection pilot and full HINT production.","Interpret timeout and budget-skip as compute/availability states, not restoration-quality failures.","Use D01 to justify method selection and N12A—not the five-painting pilot—for full coverage."],"overclaims":["Twenty-four SDXL images support a full fifth-model ranking.","HINT won every criterion; MAT used less memory and won some anchors.","The five-painting pilot supports population inference.","One deterministic HINT checkpoint provides repeated-seed uncertainty."],"practice":[{"prompt":"Which SDXL state contains restoration-quality evidence?","choices":["Completed and technically valid","Timed out","Budget-skipped"],"answer":0,"why":"Unstarted or unfinished cases do not reveal output quality."}],"quiz":[{"prompt":"Why was HINT selected over MAT?","choices":["It won every criterion","Its paired evidence was much stronger and it passed all gates","It used the least GPU memory"],"answer":1,"why":"The decision retained separate quality, visual, compute and licensing evidence."},{"prompt":"What does N12A add beyond D01?","choices":["Full 2,620-case HINT coverage","A second MAT pilot","SDXL seed uncertainty"],"answer":0,"why":"D01 selects the method; N12A executes it across the full eligible population."}]},{"key":"n13","label":"13","title":"Classical reference metrics","phase":"Evidence construction","purpose":"Compute pixel error, PSNR and SSIM under the declared region policy for every completed candidate.","inputs":["N02 reference geometry","N08 region contract","N09–N12A outputs"],"method":["Compute MSE/MAE/PSNR over valid regions.","Compute SSIM only on contiguous full/content/crop regions at least 7×7.","Orient improvement signs so positive always means restoration helped."],"decisions":["MSE/MAE lower is better; improvement = damaged − restored.","PSNR/SSIM higher is better; improvement = restored − damaged.","Exact-match PSNR remains +∞ rather than being clipped."],"facts":[["16,404","candidates"],["477,753","metric rows"],["48,012","SSIM rows"]],"claim":"LaMa leads masked MAE overall while Telea narrowly leads crop SSIM: the metric changes the answer.","limit":"These measure fidelity to a digital reference, not historical authenticity or human judgement.","asset":"n13","source":"outputs/13_classical_metrics/metrics/classical_metrics.csv","lab":{"prompt":"For MAE, positive improvement is…","choices":["restored − damaged","damaged − restored","restored ÷ damaged"],"answer":1,"why":"Error decreases are improvements."},"check":{"prompt":"Can SSIM use a shuffled list of masked pixels?","choices":["Yes","No","Only for scratch masks"],"answer":1,"why":"SSIM needs spatially contiguous neighbourhoods."},"plain":"N13 asks how closely every restoration matches the known clean digital reference at the pixel and local-structure levels. It computes several familiar measures because no single one captures every kind of difference.","population":["2,620 eligible cases contribute 16,404 completed candidates across all model roles.","The table contains 477,753 metric rows, not 477,753 independent observations.","The core nonzero comparison contains 2,320 cases; repeated prompts and seeds remain nested within paintings and cases."],"walkthrough":["For each compatible region, compare clean versus damaged pixels to establish the pre-restoration baseline.","Compare the same clean region with the restored candidate.","Calculate MSE and MAE as lower-is-better pixel errors, PSNR as a higher-is-better logarithmic fidelity measure, and SSIM as higher-is-better local structural similarity.","Orient improvement consistently: damaged minus restored for errors, restored minus damaged for similarity scores.","Keep SSIM on contiguous full/content/crop regions at least 7 × 7; never compute it on a shuffled list of mask pixels."],"terms":[["MAE","Mean absolute error: the average absolute RGB difference. Lower means closer pixels."],["MSE","Mean squared error: squared pixel differences averaged together, which penalizes large errors more strongly."],["PSNR","A logarithmic fidelity score derived from MSE. Higher is closer; exact equality is positive infinity."],["SSIM","Structural similarity measured over local image neighbourhoods, so it needs a contiguous image region."],["Data range","The possible channel span used by a metric; for 8-bit RGB this pipeline uses 255."],["Improvement sign","A declared subtraction order ensuring positive means the restoration helped relative to damage; negative means it worsened that metric."]],"why":"Pixel error and structural similarity answer different questions. Keeping both separate makes disagreements visible instead of hiding them in one universal score.","validation":["All 2,620 cases and 16,404 candidates reconciled to 477,753 metric rows.","MSE, MAE and PSNR each contribute 143,247 rows; SSIM contributes 48,012 compatible rows.","All 262 validation checks passed with zero blocking failures.","Exact-match PSNR values remain +infinity rather than being silently clipped."],"evidence_reading":["Check the arrow first: MSE/MAE are better when lower; PSNR/SSIM when higher.","Compare damaged and restored values within the same metric and region.","Notice the substantive disagreement: LaMa leads masked MAE, while Telea narrowly leads crop SSIM."],"overclaims":["Reference-pixel agreement proves historical authenticity.","The method winning one metric is the universal winner.","Each metric row is an independent sample."],"practice":[{"prompt":"Damaged MAE is 40 and restored MAE is 10. Improvement equals…","choices":["−30","30","50"],"answer":1,"why":"For lower-is-better error, improvement is damaged minus restored."}],"quiz":[{"prompt":"Why is sparse masked-pixel SSIM prohibited?","choices":["SSIM needs spatial neighbourhoods","Masks are black","SSIM only works on CPU"],"answer":0,"why":"An unordered pixel list destroys local structure."},{"prompt":"Telea wins crop SSIM while LaMa wins masked MAE. Correct conclusion?","choices":["One metric is invalid","The metrics emphasize different evidence","Both models failed"],"answer":1,"why":"Complementary measures can legitimately prefer different outputs."}]},{"key":"n14","label":"14","title":"LPIPS perceptual distance","phase":"Evidence construction","purpose":"Add learned perceptual distance on valid contiguous regions.","inputs":["16,404 candidates","content and crop regions","AlexNet LPIPS"],"method":["Resize while preserving aspect; pad neutrally.","Evaluate content and mask-bbox crop only.","Report damaged LPIPS − restored LPIPS as improvement."],"decisions":["Lower LPIPS is better.","Zero controls have content rows but no nonzero-damage crop.","CUDA execution has a documented CPU fallback."],"facts":[["31,608","LPIPS rows"],["2","valid region types"],["0.0273","LaMa crop median"]],"claim":"LaMa has the lowest median crop LPIPS in the primary comparison.","limit":"LPIPS is a learned perceptual proxy and can be affected by resize/padding on small crops.","asset":"n14","source":"outputs/14_lpips_metrics/metrics/lpips_metrics.csv","lab":{"prompt":"Which region is invalid for LPIPS?","choices":["content rectangle","mask-bbox crop","sparse masked pixels"],"answer":2,"why":"LPIPS consumes image tensors, not unordered pixel sets."},"check":{"prompt":"If damaged LPIPS=.20 and restored=.08, improvement is…","choices":["−.12",".12",".28"],"answer":1,"why":"For a lower-is-better error: .20 − .08 = .12."},"plain":"N14 adds LPIPS, a learned distance that compares images through neural-network features rather than literal pixel equality. It remains reference-based and is used only on image-like contiguous regions.","population":["The same 2,620 cases and 16,404 candidates are evaluated.","Every candidate has a content-region row; 15,204 nonzero candidates also have a damage-crop row.","The final table contains 31,608 LPIPS rows."],"walkthrough":["Extract the clean, damaged and restored content rectangle or mask-bounding-box crop.","Resize while preserving aspect ratio: longest side 256, minimum side 64, then add mid-grey value-127 padding where needed.","Pass each image through the fixed LPIPS AlexNet feature network.","Measure clean-to-damaged and clean-to-restored feature distance.","Report improvement as damaged distance minus restored distance, so a positive result means the restoration moved closer to the reference; remember that padding can influence very elongated crops."],"terms":[["LPIPS","Learned Perceptual Image Patch Similarity: distance between neural visual features. Lower is better."],["Backbone","The neural network extracting features; this notebook uses AlexNet."],["Contiguous crop","A rectangular image patch that keeps its spatial ordering."],["Bicubic interpolation","A smooth pixel-estimation rule used during LPIPS input resizing."],["Neutral padding","A constant mid-grey border, value 127, used to preserve aspect ratio."],["Perceptual proxy","A computational stand-in for visual similarity, not a human or conservation verdict."]],"why":"LPIPS can notice perceptual changes that raw pixel error treats harshly or misses, but it still requires a valid image tensor and must remain separate from other evidence families.","validation":["Exactly 31,608 rows were produced: 16,404 content and 15,204 nonzero damage-crop rows.","Zero controls correctly omit an empty damage crop while retaining content-region evidence.","All 261 checks passed with zero blocking failures.","Distances are not clipped; materially negative values would block validation."],"evidence_reading":["Lower LPIPS means closer to the clean reference in AlexNet feature space.","Compare the same region across methods; do not compare a content score with a crop score.","Core crop medians favour LaMa, followed by HINT, Telea and Stable Diffusion."],"overclaims":["The lowest LPIPS certifies historical correctness.","LPIPS is a direct human judgement score.","Sparse masked pixels are a valid LPIPS input."],"practice":[{"prompt":"Which restoration is closer by LPIPS?","choices":["0.04","0.18","The larger value"],"answer":0,"why":"LPIPS is a distance, so lower is closer."}],"quiz":[{"prompt":"Why does a zero control lack crop LPIPS?","choices":["The model failed","Its empty mask has no bounding box","LPIPS cannot process clean images"],"answer":1,"why":"There is no nonzero damage region to crop."},{"prompt":"What does the AlexNet backbone provide?","choices":["Learned visual features","Historical labels","Mask geometry"],"answer":0,"why":"LPIPS compares feature activations from the fixed network."}]},{"key":"n15","label":"15","title":"CLIP and DINOv2 features","phase":"Evidence construction","purpose":"Add complementary pretrained visual-feature similarity without pretending it measures art history.","inputs":["content/crop images","CLIP ViT-B/32","DINOv2 ViT-S/14"],"method":["Apply each encoder's native resize and centre-crop preprocessing to 224 pixels.","Deduplicate clean/damaged embeddings; retain restored embeddings per candidate.","Keep CLIP and DINO evidence separate."],"decisions":["Cosine similarity is higher-is-better.","CLIP and DINO are complementary proxies, not guaranteed semantic or structural truth.","Scratch-aware prompting was not a blanket improvement."],"facts":[["63,216","metric rows"],["78,336","embeddings"],["0.805","overall CLIP–DINO Pearson correlation"]],"claim":"CLIP and DINO broadly agree but not identically; LaMa leads the overall crop similarities.","limit":"General-purpose features do not validate style, iconography, plausibility or authenticity.","asset":"n15","source":"outputs/15_feature_similarity/metrics/feature_metrics.csv","lab":{"prompt":"What is the safest label for these measures?","choices":["Art-historical correctness","Pretrained visual-feature similarity","Expert plausibility"],"answer":1,"why":"They are computational proxies from general-purpose encoders."},"check":{"prompt":"Why retain both encoders?","choices":["They are identical","They provide complementary representations","To average them into trust"],"answer":1,"why":"Agreement and disagreement between representations are informative."},"plain":"N15 represents every reference and candidate as compact feature vectors using CLIP and DINOv2. It then asks whether restored images align with the clean reference in two complementary general-purpose visual spaces.","population":["2,620 cases and 16,404 candidates yield 63,216 metric rows across two encoders and compatible regions.","The reusable store contains 78,336 deduplicated embeddings.","The scratch-prompt comparison contains 4,800 paired encoder-region comparisons."],"walkthrough":["Extract the content rectangle or mask-bounding-box crop, then apply each encoder's native resize and centre-crop preprocessing to 224 × 224; this can suppress peripheral evidence in elongated regions.","Encode images with pinned CLIP ViT-B/32 into 512 values and DINOv2 ViT-S/14 into 384 values.","Normalize every feature vector to unit length and store reusable clean, damaged and restored embeddings without unnecessary duplication.","Calculate cosine similarity between clean and damaged, then clean and restored vectors; higher is better.","Compare generic and scratch-aware prompts only within matched painting, case, seed, region and encoder pairs."],"terms":[["Embedding","A compact list of numbers representing visual information in an image; CLIP uses 512 values here and DINOv2 384."],["Centre crop","After resizing, take the central square needed by the encoder. Peripheral content may be removed."],["Cosine similarity","How closely two vectors point in the same direction; higher means more similar."],["CLIP","A vision-language model that provides a broad visual-feature proxy, not verified semantic or style correctness."],["DINOv2","A self-supervised vision model providing a complementary structure-sensitive proxy."],["Unit normalization","Rescale a vector to length one so cosine comparisons are consistent."],["Pearson correlation","How strongly two numeric measures vary together in a linear way."],["Spearman correlation","How similarly two measures order observations, based on ranks rather than exact spacing."],["Prompt ablation","A controlled comparison changing wording while holding case, seed and generation settings fixed."]],"why":"CLIP and DINOv2 capture different aspects of visual similarity. The pipeline keeps their evidence separate instead of claiming one validated combined representation.","validation":["Exactly 63,216 feature-metric rows and 78,336 embeddings were produced.","There are 4,800 matched prompt comparisons and zero blocking failures.","CLIP–DINO agreement is strong but incomplete: Pearson correlation 0.8049 and Spearman rank correlation 0.7275.","Of 247 checks, 246 passed and one documented nonblocking warning records that CUDA bitwise repeatability is not claimed; embedding norms meet the 1e−4 tolerance."],"evidence_reading":["Higher cosine similarity means closer alignment to the reference in that encoder's feature space.","Compare CLIP and DINOv2 as complementary views; correlation is strong but imperfect.","The scratch-aware prompt did not provide a consistent blanket benefit."],"overclaims":["CLIP or DINOv2 validates art-historical style, iconography, anatomy or authenticity.","Pearson correlation near 0.805 means the encoders make identical judgements.","Native centre cropping preserves every peripheral detail.","A nonblocking CUDA warning invalidates metric coverage."],"practice":[{"prompt":"What does an embedding contain?","choices":["A compact numerical image representation","An expert restoration label","Only RGB pixels"],"answer":0,"why":"Encoders transform an image into a feature vector."}],"quiz":[{"prompt":"Which direction is better for cosine similarity?","choices":["Higher","Lower","Always zero"],"answer":0,"why":"Greater vector alignment indicates higher feature similarity."},{"prompt":"What must remain fixed in the prompt ablation?","choices":["Case, seed, region, encoder and generation settings","Only painting category","Nothing"],"answer":0,"why":"Only prompt wording is the intended intervention."}]},{"key":"n16","label":"16","title":"Difference maps","phase":"Evidence construction","purpose":"Show where restoration reduces reference error, increases it, or merely changes the damaged input.","inputs":["clean, damaged, restored triplets","content-aware global scales","N13 evidence"],"method":["Compute damaged and restored absolute RGB error per pixel.","Compute signed improvement = damaged error − restored error.","Generate masked maps and spatial overlays."],"decisions":["Positive signed values helped; negative values harmed.","Visual scales use global content p99.5; numeric CSV values remain unclipped.","Outside-mask equality is audited separately."],"facts":[["76,020","maps"],["15,204","nonzero candidates"],["99.5%","display scale percentile"]],"claim":"Most masked pixels improve under the full-run methods, but localized regressions remain visible.","limit":"Lower reference error can still be semantically or historically wrong; display clipping is not numeric clipping.","asset":"n16","source":"outputs/16_difference_maps_and_spatial_diagnostics/metrics/spatial_diagnostics.csv","lab":{"prompt":"A negative signed-improvement pixel means…","choices":["The restoration reduced error","The restoration increased reference error","The mask was invalid"],"answer":1,"why":"Signed improvement is damaged error minus restored error."},"check":{"prompt":"Why keep the numeric map?","choices":["PNG display is percentile-clipped","CSV cannot store values","It makes a trust score"],"answer":0,"why":"The numeric record preserves exact magnitude."},"plain":"N16 turns reference differences into spatial evidence. Instead of only saying that a candidate has a certain error, it shows where the damage existed, where the restoration improved the clean-reference match, where it became worse and whether protected context changed.","population":["All 2,620 eligible cases and 16,404 completed candidates enter the audit.","There are 15,204 nonzero-damage candidates and 1,200 zero controls.","The notebook produces 143,247 region summaries and 76,020 candidate maps, plus 14 selected panels; repeated candidates remain nested within paintings and cases."],"walkthrough":["Calculate absolute RGB error for damaged versus clean and restored versus clean images.","Subtract restored error from damaged error at every pixel: positive signed improvement means restoration reduced reference error; negative means it increased it.","Calculate restoration change as the absolute difference between restored and damaged pixels, which describes intervention magnitude rather than correctness.","Summarize maps over full, content, mask, crop, boundary and outside regions using the frozen region registry.","Use a shared population p99.5 scale for display only; retain the unclipped numeric arrays for analysis and verify exact protected-context compositing."],"terms":[["Absolute-error map","A picture whose pixel intensity records the absolute RGB difference from the clean digital reference."],["Signed improvement","Damaged-reference error minus restored-reference error. Positive means the candidate moved closer to the reference at that pixel; negative means it moved farther away."],["Restoration-change map","Absolute difference between damaged and restored images. It shows where the method acted, not whether the action was correct."],["Spillover","An unintended change outside the approved damage mask."],["Robust display scale","A shared high-percentile colour range that prevents a few extreme pixels from flattening every heatmap."],["Overlay","A translucent diagnostic map drawn on the image so its spatial location remains visible."]],"why":"A single average can hide a severe localized failure. Separate error, improvement, intervention and spillover maps make the candidate inspectable without inventing one spatial quality score.","validation":["All 137 validation checks passed.","The artifact contract reconciles 76,034 map-manifest rows and 76,039 canonical files.","The display scale uses the population p99.5 value, but clipping never changes numeric evidence.","In the core comparison, median masked improved-pixel fractions are about 0.9982 LaMa, 0.9974 HINT, 0.9968 Telea and 0.9878 Stable Diffusion; boun
