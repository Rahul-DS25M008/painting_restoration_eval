, 6,925 s LaMa, 31,732 s HINT and 143,217 s Stable Diffusion.","A hypothetical full SDXL design is projected near 462,884 s (128.6 h), with sensitivity scenarios—not confidence limits—around it."],"evidence_reading":["Check whether a row is observed or projected before quoting it.","Read candidate coverage beside runtime; SD's larger candidate population partly explains its total cost.","Use compute to plan scope, not to declare which restoration is best."],"overclaims":["The 128.6-hour SDXL figure was observed.","A sensitivity range is a statistical confidence interval.","The fastest method is the most trustworthy.","Runtime transfers unchanged to other hardware and software."],"practice":[{"prompt":"What does 'projected 128.6 hours' mean?","choices":["An estimated unexecuted full SDXL design","A measured completed run","A 95% confidence interval"],"answer":0,"why":"Only the bounded branch was observed."}],"quiz":[{"prompt":"Why does SD have more candidates than Telea?","choices":["It includes prompt and repeated-seed branches","It has more paintings","Telea failed"],"answer":0,"why":"Candidate count reflects experimental roles, not collection size."},{"prompt":"Should runtime enter the quality rank?","choices":["No—feasibility and fidelity are different","Yes—lower is always better","Only for SDXL"],"answer":0,"why":"N21 deliberately excludes runtime from quality voting."}]},{"key":"n31","label":"31","title":"Model reports","phase":"Reporting","purpose":"Package existing evidence into five model-specific, self-contained reports without adding new scientific results.","inputs":["model cards","comparison/flag/XAI tables","representative images"],"method":["Build reports with model-specific applicability.","Expose methods, runtime, quality, flags, uncertainty where supported and examples.","Validate embedded images, tiles, sections and source links."],"decisions":["Telea/LaMa/HINT do not receive invented seed uncertainty.","SDXL remains explicitly bounded.","Reports ation evidence","As a prevalence estimate","As expert validation"],"answer":0,"why":"Selection and population inference are different."}]},{"key":"n32","label":"32","title":"Case and painting reports","phase":"Reporting","purpose":"Create collection, painting and case drill-downs while preserving full scope and explicit curation.","inputs":["300 paintings","2,620 eligible cases","13,879 approved report candidates"],"method":["Generate one painting report per artwork and a collection index.","Select 30 diagnostic case reports by declared quotas.","Embed traceable metrics, maps, flags, limitations and provenance."],"decisions":["The curated 30 are an entry point, not a prevalence sample.","All 2,620 eligible cases remain accessible through painting reports.","Incomplete p01–p04 prompt contexts are omitted from comparable flag reporting."],"facts":[["331","HTML reports"],["30","selected case reports"],["300","painting reports"]],"claim":"The report layer supports both curated inspection and complete painting-level access.","limit":"Presentation selection does not create population evidence; flags remain computational review aids.","asset":"n32","source":"outputs/32_case_and_painting_report_generation/data/selected_cases.csv","lab":{"prompt":"Why exclude p01–p04 context prompts here?","choices":["They looked bad","They lack a complete comparable flag/explanation contract","They are too large"],"answer":1,"why":"Omission protects comparability, not aesthetics."},"check":{"prompt":"Are the selected 30 a random sample?","choices":["Yes","No","Only within categories"],"answer":1,"why":"They follow diagnostic quotas."},"plain":"N32 turns the evidence into browsable collection, painting and case reports. Every artwork remains accessible, while 30 diagnostically useful cases are selected by explicit quotas as an entry point rather than presented as a random sample.","population":["The reporting universe contains 300 paintings, 2,620 eligible cases and 13,879 approved report ca ite: https://fhtw-painting-restoration-main.streamlit.app/ . The owner reported functionality and asked further interactive testing to stop.","Recorded automated scope includes foyer navigation/decoded painting, opening and Escape-closing the visitor guide, and Case Explorer's five images plus model/metric controls.","The recorded 43.7-second smoke includes two 15-second settle intervals; it is not navigation p95 or peak-memory measurement.","N35's notebook-source hash differs from the saved notebook. Current tests do not recover the exact historical executed source; see docs/provenance_exceptions.md."],"evidence_reading":["Read the accepted Batch 11 closeout first; its preserved Batch 10 text describes an earlier, partial checkpoint.","Inspect warning rows rather than translating zero blockers into all requirements passed.","Separate historical dependency warnings from the later regression/environment repairs; neither erases unmeasured historical properties.","Read the live URL and checker revision as recorded deployment evidence, not independent server-SHA attestation."],"overclaims":["Owner acceptance proves every browser, viewport and accessibility requirement.","An availability watcher guarantees indefinite uptime.","The smoke duration is warm-navigation p95.","A later passing regression suite resolves the unknown historical notebook-source bytes."],"practice":[{"prompt":"How should a warning qualification be recorded after owner acceptance?","choices":["Keep its nonpass and disclose the acceptance basis","Change it to a measured pass","Remove its row"],"answer":0,"why":"Acceptance does not retrospectively create a measurement."}],"quiz":[{"prompt":"Is a repository/checker SHA proof of the server checkout SHA?","choices":["No, server identity needs its own attestation","Yes","Only on main"],"answer":0,"why":"These are distinct provenance claims."},{"prompt":"Which statement accurately describes closeout?","choices":["Accepted with disclosed qualifications","Eve odo.23092185 · v1.0.0"],["Archive delivery","8 binary parts + 7 companion files; linked errata"]]}],"synthesis":[{"title":"Evidence populations","question":"What exactly is being counted?","asset":"n01","notebooks":"N01–N08","decode":["300 paintings are the collection units.","3,425 registered cases include eligible and ineligible restoration objectives.","2,620 cases per full method are eligible; 10,480 is the matched four-method core."],"trace":"N08 registry → method eligibility → N21 comparison population","claim":"Counts are meaningful only when their unit and role are named.","limit":"Rows, candidates and seed pairs are not extra independent paintings.","quiz":{"prompt":"Which number is the registered case population?","choices":["300","2,620","3,425"],"answer":2,"why":"3,425 includes all four experiment branches before restoration eligibility."}},{"title":"Metric and region literacy","question":"Which evidence belongs where?","asset":"n08","notebooks":"N08, N13–N17, N20","decode":["Pixel errors can use sparse masks; SSIM/LPIPS/features need contiguous crops.","Mask, crop, boundary, outside ring and content answer different questions.","Higher/lower direction and improvement sign are declared per metric."],"trace":"Region contract → metric calculation → normalized anchor","claim":"Region policy is part of the method, not a plotting preference.","limit":"No metric family alone establishes authenticity or conservation readiness.","quiz":{"prompt":"Best local region for SSIM around damage?","choices":["Sparse mask pixels","Mask-bbox crop","All padding pixels"],"answer":1,"why":"A crop preserves spatial neighbourhoods."}},{"title":"Method comparison","question":"Which method restores well—and under which evidence?","asset":"n21","notebooks":"N09–N15, N20–N21","decode":["Telea is classical/local; LaMa learned deterministic; HINT transformer-like long-context; SD prompt-conditioned stochastic.","Eleven anchors are reduced to one vote per ten evidence families.","LaMa ce error remain separate."],"trace":"Seed group → scalar/pair metrics → local map → association with reference evidence","claim":"Disagreement can prioritize inspection and often rises with damage size.","limit":"Agreement does not prove correctness and disagreement is not calibrated confidence.","quiz":{"prompt":"Outside-mask black on an uncertainty map means…","choices":["No global uncertainty","Exact compositing made seeds identical there","The pixels were ignored"],"answer":1,"why":"The pipeline locks context outside the approved mask."}},{"title":"Trustworthiness and explainability","question":"How does a candidate receive a review recommendation?","asset":"n27","notebooks":"N27–N29","decode":["Directional quantiles are fit on core nonzero reference candidates.","One critical or two warning components can trigger a category.","Flags and recommendation precedence form a path—there is no trust score."],"trace":"measurement → threshold → category → flag → recommendation → similar-case context","claim":"Every review outcome is decomposable into recorded evidence and rules.","limit":"Internal outlier rules are not expert labels, probabilities or approval.","quiz":{"prompt":"What triggers a category without a critical value?","choices":["One warning","Warnings from two distinct components","A low runtime"],"answer":1,"why":"The baseline aggregation requires multi-component warning evidence."}},{"title":"Final argument and reproducibility","question":"What can the thesis finally defend?","asset":"n33","notebooks":"N26, N30–N36 · publication and errata","decode":["Painting-level analysis protects independence.","Model/case/painting reports expose applicability and provenance.","N33 links 49 claims to 107 evidence-catalog records and explicit limits.","N34 packages the eight-room app; N35 accepts deployment with 14 warning nonpasses; N36 consolidates delivery with 16 warnings and no independent scientific rerun.","Zenodo v1.0.0 is published at 10.5281/zenodo.23092185. Read frozen reports with the 3 October reporting errata and retained provenance exceptions."],"trace":"producer output → manifest/checksum → report → final claim → dashboard → accepted deployment → preserved package + linked errata","claim":"The framework supports transparent computational comparison and inspection.","limit":"It does not approve physical treatment, recover historical truth or replace conservators.","quiz":{"prompt":"What is the strongest supported practical claim?","choices":["Automatic conservation approval","Transparent computational review support","Historical reconstruction truth"],"answer":1,"why":"The framework informs inspection; it does not make conservation decisions."}}],"defence":[{"title":"Pipeline and units","prompt":"Can you keep populations, candidates and independent units separate?","questions":[{"prompt":"The full registered case population is…","choices":["2,620","3,425","13,879"],"answer":1,"why":"3,425 includes all generated experiment cases."},{"prompt":"The matched four-method core has…","choices":["10,480 candidates","10,504 candidates","13,879 candidates"],"answer":0,"why":"2,620 cases ×4 full methods =10,480."},{"prompt":"For most grouped inference, the independent unit is…","choices":["Metric row","Painting","Seed pair"],"answer":1,"why":"Repeated cases, seeds and metrics are nested within paintings."}]},{"title":"RQ1 — measurement","prompt":"How can restoration quality be evaluated transparently?","questions":[{"prompt":"Why keep evidence families separate?","choices":["They answer different questions","To increase flags","Because tables cannot merge"],"answer":0,"why":"Pixel fidelity, perception, features, colour, texture and seams are complementary."},{"prompt":"Why is region policy central?","choices":["It changes font size","Metric meaning depends on where it is computed","It only affects runtime"],"answer":1,"why":"Mask, crop, boundary and context support different interpretations."},{"prompt":"What is not constructed       const rhythms = ['See', 'Decode', 'Trace', 'Challenge', 'Teach back'];
      const prior = window.openai && window.openai.widgetState ? window.openai.widgetState : {};
      const priorPrivate = prior.privateContent || {};
      const priorModel = prior.modelContent || {};
      const compatibleSavedState = [CONTENT_VERSION, 'academy.deep_lessons.v2'].includes(priorPrivate.contentVersion);
      const state = {
        module: priorPrivate.module || 'home',
        chapter: Number.isInteger(priorPrivate.chapter) ? Math.max(0, Math.min(COURSE.chapters.length-1, priorPrivate.chapter)) : 0,

        answers: compatibleSavedState ? (priorPrivate.answers || {}) : {},

      function save() {
        if (!window.openai || !window.openai.setWidgetState) return;
        const c = state.chapter;
        const d = state.defence;
        window.openai.setWidgetState({
          modelContent: {
            currentModule: moduleName(),
            currentChapter: state.module === 'lab' ? COURSE.chapters[c].label + ' ' + COURSE.chapters[c].title : null,
            defenceSection: state.module === 'defence' ? COURSE.defence[d].title : null,
            completedChapters: completedCount(),
            note: state.note
          },
          privateContent: {
            contentVersion: CONTENT_VERSION,
            module: state.module,
            chapter: state.chapter,
            activity: state.activity,
            room: state.room,
            rhythm: state.rhythm,
            defence: state.defence,
            answers: state.answers,
            completed: state.completed,
            defenceAnswers: state.defenceAnswers
          }

      function setModule(module) {
        state.module = module;
        render(true);

      function updateTabs() {
        root.querySelectorAll('[data-module]').forEach(button => {

      function homeView() {
        const done = completedCount();
        return `

            <div class="ea-home-hero">
              <div class="ea-home-copy">
                <div class="ea-kicker">A guided rehearsal of the completed study · updated 3 October 2026</div>
                <h1 id="ea-home-title">Learn the evidence.<br>Then defend it.</h1>
                <p class="ea-lede">Walk from 300 source paintings to restoration candidates, metrics, maps, review flags and traceable conclusions. Every lesson is tied to a real notebook output.</p>
                <div class="ea-home-quote">“Visual plausibility is not restoration trustworthiness—and disagreement is not the same as error.”</div>
                <div class="ea-btn-row">
                  <button type="button" class="ea-btn ea-btn-primary cursor-interaction" data-open-module="lab">Begin with Notebook 01</button>

      function phaseRoute(chapter) {

      function list(items) { return `<ul class="ea-list">${items.map(item => `<li>${esc(item)}</li>`).join('')}</ul>`; }
      function facts(ch) { return `<div class="ea-fact-grid">${ch.facts.map(f => `<div class="ea-fact"><strong>${esc(f[0])}</strong><span>${esc(f[1])}</span></div>`).join('')}</div>`; }

        return `<div><div class="ea-question">${esc(question.prompt)}</div><div class="ea-options">${question.choices.map((choice,i) => {
          const status = correct && i===question.answer ? 'is-correct' : answered && !correct && i===selected ? 'is-wrong' : '';
          return `<button type="button" class="ea-option cursor-interaction ${status}" data-answer-key="${esc(key)}" data-answer-index="${i}" ${correct?'disabled':''}>${String.fromCharCode(65+i)}. ${esc(choice)}</button>`;
        }).join('')}</div>${answered ? `<div class="ea-feedback"><strong>${correct?'Correct.':'Not quite—use the explanation and try again.'}</strong> ${esc(question.why)}</div>` : ''}</div>`;
      }

      function questionSet(questions, keyPrefix) {
        const answered = questions.filter((_,i)=>Number.isInteger(state.answers[`${keyPrefix}-${i}`])).length;
        const correct = questions.filter((q,i)=>state.answers[`${keyPrefix}-${i}`]===q.answer).length;
        return `<div class="ea-scoreline"><strong>${correct}/${questions.length}</strong><span class="ea-muted">correct · ${answered}/${questions.length} answered</span></div><div class="ea-question-set">${questions.map((question,i)=>`<div class="ea-question-card">${answerBlock(question,`${keyPrefix}-${i}`)}</div>`).join('')}</div>`;
      }

      function chapterActivity(ch) {
        const idx = state.chapter;
        if (state.activity === 0) return `<div class="ea-content-grid"><article class="ea-sheet"><div class="ea-section-stack"><section class="ea-section-block"><h3>What problem does this notebook solve?</h3><p>${esc(ch.plain||ch.purpose)}</p></section><section class="ea-section-block"><h4>Exact population and unit of analysis</h4>${population(ch)}${facts(ch)}</section><section class="ea-section-block"><h4>Inputs and dependencies</h4>${list(ch.inputs)}</section></div></article><aside class="ea-aside"><h4>Pipeline position</h4><p class="ea-muted">${esc(ch.phase)}</p><p>${esc(ch.pipeline||'This chapter transforms or interprets evidence that later chapters consume under its declared contract.')}</p><div class="ea-source"><small>Primary evidence trail</small><br><code>${esc(ch.source)}</code></div></aside></div>`;
        if (state.activity === 1) return `<div class="ea-content-grid"><article class="ea-sheet"><div class="ea-section-stack"><section class="ea-section-block"><h3>Method, step by step</h3><div class="ea-steps">${(ch.walkthrough||ch.method).map((m,i)=>`<div class="ea-step"><span class="ea-step-num">${i+1}</span><div>${esc(m)}</div></div>`).join('')}</div></section><section class="ea-section-block"><h3>Terms translated into plain language</h3>${terms(ch)}</section></div></article><aside class="ea-aside"><h4>Decisions that change the meaning</h4>${list(ch.decisions)}${ch.why?`<div class="ea-validation"><h4>Why this design?</h4><p>${esc(ch.why)}</p></div>`:''}</aside></div>`;
        if (state.activity === 2) return `<div class="ea-content-grid"><article class="ea-sheet"><div class="ea-section-stack"><section class="ea-section-block">${evidenceFigure(ch, `${ch.label} · ${ch.title} — verified repository output`)}</section><section class="ea-section-block"><h3>Read the output in this order</h3>${list(ch.evidence_reading||[ch.claim])}</section></div></article><aside class="ea-aside"><h4>What was actually verified?</h4><div class="ea-validation">${list(ch.validation||['The declared output passed its repository validation contract.'])}</div><div class="ea-source"><small>Trace it to</small><br><code>${esc(ch.source)}</code></div><div class="ea-btn-row" style="margin-top:14px"><button type="button" class="ea-btn ea-btn-primary cursor-interaction" data-inspect-evidence="${esc(ch.key)}">Inspect this evidence with Codex</button><button type="button" class="ea-btn ea-btn-soft cursor-interaction" data-evidence-prompt="${esc(ch.key)}">Show inspection prompt</button></div></aside></div>`;
        if (state.activity === 3) { const qs=[ch.lab,...(ch.practice||[])]; return `<div class="ea-content-grid"><article class="ea-sheet"><div class="ea-kicker">Guided practice · questions 1–2 of 5</div>${questionSet(qs,`practice-${ch.key}`)}</article><aside class="ea-aside"><h4>How to reason</h4><p>First name the population. Then name what changed, what stayed fixed, and which evidence supports the answer. Do not jump from technical validity to historical or conservation validity.</p><p class="ea-muted">Complete these two questions, then answer the final three in Revision check. All five must be correct before the chapter can be marked understood.</p></aside></div>`; }
        if (state.activity === 4) return `<div class="ea-sheet"><h3>Claim boundary</h3><div class="ea-claim-grid"><div class="ea-claim"><small>Strongest defensible claim</small>${esc(ch.claim)}</div><div class="ea-limit"><small>Principal limitation</small>${esc(ch.limit)}</div></div>${(ch.overclaims||[]).length?`<div class="ea-section-block" style="margin-top:18px"><h4>Tempting claims to reject</h4><ul class="ea-list ea-warning-list">${ch.overclaims.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}<div class="ea-btn-row" style="margin-top:18px"><button type="button" class="ea-btn cursor-interaction" data-discuss="${esc(ch.key)}">Discuss this boundary with Codex</button><button type="button" class="ea-btn ea-btn-soft cursor-interaction" data-show-prompt="${esc(ch.key)}">Show a ready-to-send prompt</button></div></div>`;
        const qs=[ch.check,...(ch.quiz||[])];
        const practiceQs=[ch.lab,...(ch.practice||[])];
        const practiceCorrect = practiceQs.every((q,i)=>state.answers[`practice-${ch.key}-${i}`]===q.answer);
        const revisionCorrect = qs.every((q,i)=>state.answers[`check-${ch.key}-${i}`]===q.answer);
        const ready = practiceCorrect && revisionCorrect;
        return `<div class="ea-content-grid"><article class="ea-sheet"><div class="ea-kicker">Revision check · questions 3–5 of 5</div>${questionSet(qs,`check-${ch.key}`)}<div class="ea-validation"><strong>${ready?'Five-question check passed.':'Completion gate not yet passed.'}</strong><p>${ready?'You may now mark this chapter understood.':'Answer both Practice questions and all three Revision questions correctly. Incorrect answers remain retryable.'}</p></div>${ready ? `<div class="ea-btn-row" style="margin-top:16px"><button type="button" class="ea-btn ea-btn-primary cursor-interaction" data-complete="${esc(ch.key)}">${state.completed[ch.key]?'Chapter understood ✓':'Mark chapter understood'}</button></div>` : ''}</article><aside class="ea-aside"><h4>Teach-back structure</h4><p>Explain four things: method, exact population, strongest defensible claim, and principal limitation. Define every specialist term before using it.</p><button type="button" class="ea-btn cursor-interaction" data-discuss="${esc(ch.key)}">Practice with Codex</button></aside></div>`;
      }

      function labView() {
        const ch = COURSE.chapters[state.chapter];
        const done = completedCount();
        return `<section aria-labelledby="ea-chapter-title">${phaseRoute(ch)}<header class="ea-chapter-head"><div class="ea-chapter-number">${esc(ch.label)}</div><div><div class="ea-kicker">${esc(ch.phase)} · chapter ${state.chapter+1} of ${COURSE.chapters.length}</div><h2 id="ea-chapter-title">${esc(ch.title)}</h2><p class="ea-chapter-purpose">${esc(ch.purpose)}</p></div><div class="ea-progress-label">${done}/${COURSE.chapters.length} understood<div class="ea-progress" role="progressbar" aria-label="Notebook Lab progress" aria-valuemin="0" aria-valuemax="${COURSE.chapters.length}" aria-valuenow="${done}"><span style="width:${done/COURSE.chapters.length*100}%"></span></div></div></header><nav class="ea-activity-nav" aria-label="Chapter activities">${activities.map((a,i)=>`<button type="button" class="ea-activity cursor-interaction ${i===state.activity?'is-active':''}" data-activity="${i}">${esc(a)}</button>`).join('')}</nav>${chapterActivity(ch)}<div id="ea-followup" class="ea-followup" aria-live="polite"><strong>Ready-to-send prompt</strong><div id="ea-followup-reason" style="font-size:12px;opacity:.75;margin-top:4px"></div><textarea id="ea-followup-text" readonly></textarea><div class="ea-btn-row"><button type="button" class="ea-btn cursor-interaction" data-copy-prompt>Copy prompt</button><button type="button" class="ea-btn cursor-interaction" data-close-prompt>Close</button></div></div><div class="ea-footer-nav"><button type="button" class="ea-btn cursor-interaction" data-chapter-nav="prev" ${state.chapter===0?'disabled':''}>← Previous chapter</button><button type="button" class="ea-btn ea-btn-primary cursor-interaction" data-chapter-nav="next" ${state.chapter===COURSE.chapters.length-1?'disabled':''}>Next chapter →</button></div><div class="ea-live" id="ea-live" aria-live="polite"></div></section>`;
      }

      function rhythmContent(room) {
        const item = COURSE.synthesis[room];
        if (state.rhythm === 0) return `<div class="ea-content-grid"><article class="ea-sheet">${evidenceFigure({asset:item.asset}, `${item.title} — repository-backed synthesis view`)}</article><aside class="ea-aside"><h4>Look first</h4><p>${esc(item.question)}</p><p class="ea-muted">Do not jump to the conclusion. Name the population, evidence family and visual encoding first.</p></aside></div>`;
        if (state.rhythm === 1) return `<div class="ea-content-grid"><article class="ea-sheet"><h3>Decode the argument</h3>${list(item.decode)}</article><aside class="ea-aside"><h4>Bounded conclusion</h4><div class="ea-claim"><small>Supported</small>${esc(item.claim)}</div><div class="ea-limit" style="margin-top:10px"><small>Boundary</small>${esc(item.limit)}</div></aside></div>`;
        if (state.rhythm === 2) return `<div class="ea-sheet"><h3>Trace the evidence chain</h3><p class="ea-muted">${esc(item.notebooks)}</p><div class="ea-trace">${item.trace.split('→').map(x=>`<span>${esc(x.trim())}</span>`).join('')}</div></div>`;
        if (state.rhythm === 3) return `<div class="ea-content-grid"><article class="ea-sheet"><div class="ea-kicker">Gallery challenge</div>${answerBlock(item.quiz, `gallery-${room}`)}</article><aside class="ea-aside"><h4>Question behind the question</h4><p>${esc(item.question)}</p></aside></div>`;
        return `<div class="ea-sheet"><h3>Teach it back</h3><p>Explain <strong>${esc(item.title)}</strong> without using “best,” “confidence,” or “trustworthy” unless you qualify exactly what the word means.</p><div class="ea-btn-row"><button type="button" class="ea-btn ea-btn-primary cursor-interaction" data-gallery-discuss="${room}">Start live teach-back</button><button type="button" class="ea-btn ea-btn-soft cursor-interaction" data-gallery-prompt="${room}">Show fallback prompt</button></div></div>`;
      }

      function galleryView() {
        const item = COURSE.synthesis[state.room];
        return `<section aria-labelledby="ea-room-title"><div class="ea-kicker">Module 2 · cross-notebook synthesis</div><h2 id="ea-room-title">Evidence Gallery</h2><p class="ea-lede">Seven rooms connect individual calculations into the thesis argument. Follow the same rhythm each time: see, decode, trace, challenge, teach back.</p><div class="ea-gallery-shell" style="margin-top:20px"><nav class="ea-room-list" aria-label="Evidence rooms">${COURSE.synthesis.map((x,i)=>`<button type="button" class="ea-room cursor-interaction ${i===state.room?'is-active':''}" data-room="${i}">${i+1}. ${esc(x.title)}</button>`).join('')}</nav><div><div class="ea-sheet"><div class="ea-kicker">Room ${state.room+1} · ${esc(item.notebooks)}</div><h3>${esc(item.title)}</h3><p class="ea-muted">${esc(item.question)}</p><nav class="ea-rhythm" aria-label="Learning rhythm">${rhythms.map((x,i)=>`<button type="button" class="cursor-interaction ${i===state.rhythm?'is-active':''}" data-rhythm="${i}">${i+1}. ${esc(x)}</button>`).join('')}</nav>${rhythmContent(state.room)}</div><div id="ea-followup" class="ea-followup" aria-live="polite"><strong>Ready-to-send prompt</strong><div id="ea-followup-reason" style="font-size:12px;opacity:.75;margin-top:4px"></div><textarea id="ea-followup-text" readonly></textarea><div class="ea-btn-row"><button type="button" class="ea-btn cursor-interaction" data-copy-prompt>Copy prompt</button><button type="button" class="ea-btn cursor-interaction" data-close-prompt>Close</button></div></div></div></div><div class="ea-live" id="ea-live" aria-live="polite"></div></section>`;
      }

      function defenceStats() {
        let total = 0, correct = 0;
        COURSE.defence.forEach((section,si)=>section.questions.forEach((question,qi)=>{ total++; const answer = state.defenceAnswers[`${si}-${qi}`]; if (answer === question.answer) correct++; }));
        return {total, correct, answered:Object.keys(state.defenceAnswers).length};
      }

      function defenceQuestion(question, si, qi) {
        const key = `${si}-${qi}`;
        const selected = state.defenceAnswers[key];
        const answered = Number.isInteger(selected);
        const correct = selected === question.answer;
        return `<div class="ea-defence-q"><h4>${esc(question.prompt)}</h4><div class="ea-options" style="margin-top:10px">${question.choices.map((choice,i)=>`<button type="button" class="ea-option cursor-interaction ${correct&&i===question.answer?'is-correct':answered&&!correct&&i===selected?'is-wrong':''}" data-defence-key="${key}" data-defence-index="${i}" ${correct?'disabled':''}>${String.fromCharCode(65+i)}. ${esc(choice)}</button>`).join('')}</div>${answered?`<div class="ea-feedback">${correct?'<strong>Correct.</strong>':'<strong>Review this and try again.</strong>'} ${esc(question.why)}</div>`:''}</div>`;
      }

      function defenceView() {
        const section = COURSE.defence[state.defence];
        const stats = defenceStats();
        const ready = stats.answered === stats.total && stats.correct >= 15;
        return `<section aria-labelledby="ea-defence-title"><div class="ea-kicker">Module 3 · RQ recap and viva rehearsal</div><h2 id="ea-defence-title">Defence Room</h2><p class="ea-lede">Short answers only. The goal is precise scope, not memorized paragraphs. A live Codex teach-back remains the final learning checkpoint.</p><div class="ea-score"><strong>${stats.correct}/${stats.total}</strong><span class="ea-muted">correct · ${stats.answered}/${stats.total} answered</span><div class="ea-progress" style="flex:1;min-width:180px" role="progressbar" aria-label="Defence progress" aria-valuemin="0" aria-valuemax="18" aria-valuenow="${stats.answered}"><span style="width:${stats.answered/stats.total*100}%"></span></div></div><div class="ea-defence-grid"><nav class="ea-defence-nav" aria-label="Defence sections">${COURSE.defence.map((x,i)=>`<button type="button" class="cursor-interaction ${i===state.defence?'is-active':''}" data-defence="${i}">${i+1}. ${esc(x.title)}</button>`).join('')}</nav><article class="ea-sheet"><div class="ea-kicker">Section ${state.defence+1} of 6</div><h3>${esc(section.title)}</h3><p class="ea-muted">${esc(section.prompt)}</p>${section.questions.map((x,i)=>defenceQuestion(x,state.defence,i)).join('')}${state.defence===5?`<div class="ea-claim-grid"><div class="ea-claim"><small>Learning checkpoint</small>${ready?'Quiz threshold reached. You are ready for a live teach-back.':'Answer all 18 questions and reach at least 15 correct.'}</div><div class="ea-limit"><small>Completed delivery</small>N34–N36 and publication are complete. This learning check does not erase recorded qualifications or replace the linked reporting errata.</div></div><div class="ea-btn-row" style="margin-top:16px"><button type="button" class="ea-btn ea-btn-primary cursor-interaction" data-final-discuss ${ready?'':'disabled'}>Begin live RQ defence</button><button type="button" class="ea-btn ea-btn-soft cursor-interaction" data-final-prompt>Show defence prompt</button></div>`:''}</article></div><div id="ea-followup" class="ea-followup" aria-live="polite"><strong>Ready-to-send prompt</strong><div id="ea-followup-reason" style="font-size:12px;opacity:.75;margin-top:4px"></div><textarea id="ea-followup-text" readonly></textarea><div class="ea-btn-row"><button type="button" class="ea-btn cursor-interaction" data-copy-prompt>Copy prompt</button><button type="button" class="ea-btn cursor-interaction" data-close-prompt>Close</button></div></div><div class="ea-live" id="ea-live" aria-live="polite"></div></section>`;
      }

      async function getBitmap(id) {
        if (bitmapCache.has(id)) return bitmapCache.get(id);
        const raw = ASSETS[id];
        if (!raw) throw new Error('Missing embedded asset');
        const bytes = Uint8Array.from(atob(raw), ch => ch.charCodeAt(0));
        const blob = new Blob([bytes], {type:'image/webp'});
        let bitmap;
        if (typeof createImageBitmap === 'function') bitmap = await createImageBitmap(blob);
        else bitmap = await new Promise((resolve,reject)=>{ const img=new Image(); const url=URL.createObjectURL(blob); img.onload=()=>{URL.revokeObjectURL(url);resolve(img)}; img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('decode failed'))}; img.src=url; });
        bitmapCache.set(id, bitmap);
        return bitmap;
      }

      async function paintCanvas(canvas) {
        try {
          const bitmap = await getBitmap(canvas.dataset.asset);
          if (!canvas.isConnected) return;
          const rect = canvas.getBoundingClientRect();
          const dpr = Math.min(2, window.devicePixelRatio || 1);
          const width = Math.max(320, Math.round(rect.width * dpr));
          const height = Math.max(200, Math.round(rect.height * dpr));
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          const styles = getComputedStyle(root);
          ctx.fillStyle = styles.getPropertyValue('--ea-canvas').trim() || '#eee6d7';
          ctx.fillRect(0,0,width,height);
          const scale = Math.min(width/bitmap.width, height/bitmap.height);
          const w = bitmap.width*scale, h = bitmap.height*scale;
          ctx.drawImage(bitmap, (width-w)/2, (height-h)/2, w, h);
        } catch (error) {
          canvas.style.display = 'none';
          const fallback = canvas.parentElement.querySelector('.ea-image-fallback');
          if (fallback) fallback.style.display = 'block';
        }
      }

      function paintAll() { root.querySelectorAll('canvas[data-asset]').forEach(paintCanvas); }

      function promptForChapter(ch) {
        return `Quiz me on ${ch.label} — ${ch.title}. Use the repository-backed design and evidence from this conversation. Ask all questions at once, with 5–8 questions covering the important content. Require me to distinguish method, exact population, validation evidence, strongest defensible claim and limitation. Explain unfamiliar domain terms in plain language and correct overclaims immediately.`;
      }

      function evidencePromptForChapter(ch) {
        return `Inspect the repository-backed evidence for ${ch.label} — ${ch.title}, especially ${ch.source}. Explain what the displayed image or table encodes, how to read axes, colours, regions and directions, which exact population it covers, and what it does not prove. Define every unfamiliar technical term in plain language. Then ask me two concise interpretation questions.`;
      }

      function showPrompt(prompt, reason) {
        const panel = root.querySelector('#ea-followup');
        if (!panel) return;
        panel.classList.add('is-open');
        panel.querySelector('#ea-followup-text').value = prompt;
        panel.querySelector('#ea-followup-reason').textContent = reason || 'Copy this prompt into the chat if direct hand-off is unavailable.';
        panel.scrollIntoView({behavior:'smooth', block:'nearest'});
      }

      async function sendPrompt(prompt, title) {
        const live = root.querySelector('#ea-live');
        showPrompt(prompt, 'Copy this prompt into your preferred AI chat, or use it with a supervisor or study partner. This site does not send messages or call an AI service.');
        if (live) live.textContent = 'Discussion prompt ready.';
      }

      function render(resetScroll = false) {
        updateTabs();
        main.innerHTML = state.module === 'lab' ? labView() : state.module === 'gallery' ? galleryView() : state.module === 'defence' ? defenceView() : homeView();
        requestAnimationFrame(paintAll);
        if (resetScroll) requestAnimationFrame(() => main.scrollIntoView({behavior:'smooth', block:'start'}));
      }

      root.addEventListener('click', event => {
        const target = event.target.closest('button');
        if (!target) return;
        if (target.dataset.action === 'home') { state.module='home'; render(true); save(); return; }
        if (target.dataset.module) { setModule(target.dataset.module); return; }
        if (target.dataset.openModule) { setModule(target.dataset.openModule); return; }
        if (target.hasAttribute('data-reset-progress')) { if (target.dataset.confirmReset !== 'yes') { target.dataset.confirmReset='yes'; target.textContent='Confirm reset of all learning progress'; return; } state.answers={}; state.completed={}; state.defenceAnswers={}; state.module='home'; state.chapter=0; state.activity=0; state.room=0; state.rhythm=0; state.defence=0; render(true); save(); return; }
        if (target.dataset.phase) { const next=COURSE.chapters.findIndex(c=>c.phase===target.dataset.phase); if(next>=0){state.chapter=next;state.activity=0;render(true);save();} return; }
        if (target.dataset.activity !== undefined) { state.activity=Number(target.dataset.activity); render(true); save(); return; }
        if (target.dataset.chapterNav) { state.chapter += target.dataset.chapterNav==='next'?1:-1; state.chapter=Math.max(0,Math.min(COURSE.chapters.length-1,state.chapter)); state.activity=0; render(true); save(); return; }
        if (target.dataset.answerKey) { state.answers[target.dataset.answerKey]=Number(target.dataset.answerIndex); render(); save(); return; }
        if (target.dataset.complete) { state.completed[target.dataset.complete]=!state.completed[target.dataset.complete]; render(); save(); return; }
        if (target.dataset.room !== undefined) { state.room=Number(target.dataset.room); state.rhythm=0; render(true); save(); return; }
        if (target.dataset.rhythm !== undefined) { state.rhythm=Number(target.dataset.rhythm); render(true); save(); return; }
        if (target.dataset.defence !== undefined) { state.defence=Number(target.dataset.defence); render(true); save(); return; }
        if (target.dataset.defenceKey) { state.defenceAnswers[target.dataset.defenceKey]=Number(target.dataset.defenceIndex); render(); save(); return; }
        if (target.hasAttribute('data-expand-evidence')) { const figure=target.closest('figure'); const wrap=figure&&figure.querySelector('.ea-canvas-wrap'); const canvas=figure&&figure.querySelector('canvas[data-asset]'); if(wrap){wrap.classList.toggle('is-expanded');target.textContent=wrap.classList.contains('is-expanded')?'Reduce evidence':'Enlarge evidence';if(canvas)requestAnimationFrame(()=>paintCanvas(canvas));} return; }
        if (target.dataset.inspectEvidence || target.dataset.evidencePrompt) { const key=target.dataset.inspectEvidence||target.dataset.evidencePrompt; const ch=COURSE.chapters.find(c=>c.key===key); const prompt=evidencePromptForChapter(ch); if(target.dataset.inspectEvidence) sendPrompt(prompt,`Inspect ${ch.label} evidence`); else showPrompt(prompt); return; }
        if (target.dataset.discuss) { const ch=COURSE.chapters.find(c=>c.key===target.dataset.discuss); sendPrompt(promptForChapter(ch), `Discuss ${ch.label} ${ch.title}`); return; }
        if (target.dataset.showPrompt) { const ch=COURSE.chapters.find(c=>c.key===target.dataset.showPrompt); showPrompt(promptForChapter(ch)); return; }
        if (target.dataset.galleryDiscuss !== undefined || target.dataset.galleryPrompt !== undefined) { const i=Number(target.dataset.galleryDiscuss ?? target.dataset.galleryPrompt); const item=COURSE.synthesis[i]; const prompt=`Run a live teach-back on “${item.title}”. Ask me to explain the evidence chain (${item.trace}), the strongest supported claim, and its boundary. Use concise follow-up questions and correct any overclaim.`; if(target.dataset.galleryDiscuss!==undefined) sendPrompt(prompt,`Teach back: ${item.title}`); else showPrompt(prompt); return; }
        if (target.hasAttribute('data-final-discuss') || target.hasAttribute('data-final-prompt')) { const prompt='Conduct my completed-study thesis defence through N36. Cover RQ1 measurement and regions, RQ2 method differences under controlled damage, RQ3 repeated-candidate disagreement, the N27 rule-based flags, statistical independence, D02 boundaries, compute limits, N34–N36 delivery, linked reporting errata and retained provenance exceptions, and the strongest claim the framework can support. Ask one concise question at a time and do not pass me until I can state both evidence and limitation accurately.'; if(target.hasAttribute('data-final-discuss')) sendPrompt(prompt,'Begin final RQ defence'); else showPrompt(prompt); return; }
        if (target.hasAttribute('data-copy-prompt')) { const area=root.querySelector('#ea-followup-text'); area.select(); if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(area.value).catch(()=>document.execCommand('copy')); else document.execCommand('copy'); const live=root.querySelector('#ea-live'); if(live) live.textContent='Prompt copied.'; return; }
        if (target.hasAttribute('data-close-prompt')) { const panel=root.querySelector('#ea-followup'); if(panel) panel.classList.remove('is-open'); return; }
      });

      root.addEventListener('change', event => {
        if (event.target.id === 'ea-chapter-select') { state.chapter=Number(event.target.value); state.activity=0; render(true); save(); }
      });

      window.addEventListener('openai:set_globals', event => {
        const fresh = event.detail && event.detail.globals && event.detail.globals.widgetState;
        if (!fresh || !fresh.privateContent || fresh.privateContent.contentVersion !== CONTENT_VERSION) return;
        const p=fresh.privateContent;
        if (p.completed) state.completed=p.completed;
        if (p.answers) state.answers=p.answers;
        if (p.defenceAnswers) state.defenceAnswers=p.defenceAnswers;
        render();
      });

      let resizeTimer;
      new ResizeObserver(() => { clearTimeout(resizeTimer); resizeTimer=setTimeout(paintAll,80); }).observe(root);
      render();
    })();
  </script>
</section>
