ded SDXL is descriptive only."],"evidence_reading":["Read the damage mask first so the intended intervention is known.","Use signed improvement to distinguish helped and harmed pixels; use restoration change only to see intervention magnitude.","Inspect boundary and outside regions separately before interpreting a visually appealing fill."],"overclaims":["A positive improvement map proves historical correctness.","The selected extreme panels represent average model behaviour.","A display colour reaching its maximum means the raw value was clipped in analysis.","A small change map proves a good restoration."],"practice":[{"prompt":"A signed-improvement pixel is negative. What happened?","choices":["Reference error increased","The model was more confident","The pixel was outside the mask"],"answer":0,"why":"Negative means restored-reference error exceeded damaged-reference error at that pixel."}],"quiz":[{"prompt":"What does a restoration-change map measure?","choices":["How much the method altered the damaged image","Historical authenticity","Seed confidence"],"answer":0,"why":"It measures intervention magnitude only."},{"prompt":"Why use one p99.5 display scale?","choices":["To compare colours consistently without extreme outliers flattening the maps","To remove bad pixels","To improve the metrics"],"answer":0,"why":"The robust scale is a visualization policy, not a metric transformation."}]},{"key":"n17","label":"17","title":"Colour, texture and seam diagnostics","phase":"Evidence construction","purpose":"Separate local colour drift, texture change and boundary continuity into distinct evidence families.","inputs":["N16 spatial geometry","CIELAB/CIEDE2000","LBP/GLCM/Gabor and ring regions"],"method":["Measure colour distributions and ΔE00.","Measure LBP, GLCM, Gabor, gradient and periodicity proxies.","Compare inner/outer boundary rings for seams and spillover."],"decisions":["Lower error is better; improvement = damaged − restored.","Boundary, outside and crop regions answer different questions.","There is no universal seam, brushstroke or colour-authenticity threshold."],"facts":[["2,060,667","diagnostic rows"],["27,912","maps"],["3","separate families"]],"claim":"LaMa has the lowest median errors across the three core local families, which remain separate evidence.","limit":"Processed sRGB and texture descriptors are not pigment analysis, brushstroke authentication or material truth.","asset":"n17","source":"outputs/17_local_consistency_metrics/metrics/local_consistency.csv","lab":{"prompt":"A visible join at the mask edge belongs first to…","choices":["Colour only","Boundary/seam diagnostics","Runtime evidence"],"answer":1,"why":"The ring policy directly tests discontinuity around the restored boundary."},"check":{"prompt":"Should colour, texture and seam become one score?","choices":["Yes","No","Only for portraits"],"answer":1,"why":"Their separateness is part of the transparent design."},"plain":"N17 examines three local properties that ordinary pixel scores can blur together: colour change, texture change and seams around the repair boundary. Each family remains separate because it represents a different failure mechanism.","population":["All 16,404 candidates across 2,620 cases are covered.","The notebook produces 2,060,667 diagnostic rows: 1,289,223 colour, 497,772 texture-related and 273,672 seam-related rows.","Maps are rendered for 9,304 primary nonzero candidates; expected inapplicable combinations are recorded as N/A rather than zero."],"walkthrough":["Convert processed sRGB pixels to CIELAB and calculate CIEDE2000 colour difference where the region is valid.","Describe local texture with LBP, GLCM and Gabor measurements at declared scales and directions.","Measure gradients and periodicity to detect edge or repeating-pattern disruption.","Compare narrow rings just inside and outside the mask boundary to expose visible joins, leakage and discontinuity.","Report each colour, texture and seam measure with its own direction and region instead of merging them into a universal local-consistency score."],"terms":[["CIELAB","A colour representation designed so numerical distances are more closely related to perceived colour differences."],["CIEDE2000 / ΔE00","A modern formula for perceived colour difference in CIELAB. Lower means closer colour under this computational setup."],["LBP","Local Binary Pattern: a compact descriptor of small neighbourhood texture."],["GLCM","Grey-Level Co-occurrence Matrix: counts how often brightness levels occur beside one another at chosen distances and directions."],["Gabor filter","A directional texture detector resembling a small oriented wave pattern."],["Boundary ring","A narrow band immediately inside or outside the mask used to inspect joins and spillover."]],"why":"A candidate may match colour while breaking brush-like texture, or preserve texture while leaving a visible seam. Keeping the three families separate reveals that disagreement.","validation":["All 179 validation checks passed.","The exact row total is 2,060,667 and the map population is 27,912 with 14 selected panels.","The policy uses 8-point radius-1 LBP, 32-level GLCM at distances 1, 2 and 4 over four angles, and Gabor frequencies 0.10 and 0.20 over four angles.","Hue evidence is used only where chroma is at least 5; boundary SSIM is calculated as a full local map before ring sampling."],"evidence_reading":["Use ΔE00 for processed-image colour drift, not pigment chemistry.","Compare texture descriptors only under the same region and scale.","Read boundary mismatch as a seam diagnostic; it is not a universal accept/reject threshold."],"overclaims":["ΔE00 is a conservation-grade pigment measurement.","Texture descriptors authenticate brushstrokes or artistic authorship.","A low seam measure proves an invisible or historically correct repair.","Expected N/A values are model failures."],"practice":[{"prompt":"A candidate has low colour error but high boundary-gradient mismatch. Best interpretation?","choices":["Colour is preserved but a seam may remain","The candidate is universally correct","The colour metric failed"],"answer":0,"why":"The evidence families can legitimately disagree."}],"quiz":[{"prompt":"What does GLCM summarize?","choices":["Neighbouring brightness relationships","Artist identity","GPU memory"],"answer":0,"why":"It is a spatial texture descriptor."},{"prompt":"Why are colour, texture and seams not averaged together?","choices":["They describe distinct local properties with no validated combination rule","They have different filenames","Only seams matter"],"answer":0,"why":"Separateness preserves interpretation."}]},{"key":"n18","label":"18","title":"Repeated-seed disagreement","phase":"Evidence construction","purpose":"Quantify empirical Stable Diffusion disagreement while holding case, prompt and configuration fixed.","inputs":["780 four-seed groups","seeds 2026–2029","reference metrics for association"],"method":["Compute per-pixel population standard deviation across seeds.","Compute all six unordered seed pairs per group.","Keep RGB, LPIPS, CLIP and DINO disagreement as separate measures."],"decisions":["Only Stable Diffusion has supported repeated seeds.","Generic and scratch-aware prompt arms form separate groups.","Associations with error are diagnostics, not a confidence calibration model."],"facts":[["780","groups"],["3,120","candidates"],["4,680","seed pairs"]],"claim":"Disagreement is informative and associated with some errors, yet greater consistency can coexist with worse fidelity.","limit":"Four seeds and one model do not establish calibrated confidence or deterministic-model uncertainty.","asset":"n18","source":"outputs/18_diffusion_uncertainty_analysis/metrics/uncertainty_metrics.csv","lab":{"prompt":"Which group is valid?","choices":["Same case, mixed prompts, four seeds","Same case and prompt/config, four seeds","Four different paintings, one seed"],"answer":1,"why":"Only seed may vary within an uncertainty group."},"check":{"prompt":"Low disagreement proves correctness…","choices":["True","False","Only for scratches"],"answer":1,"why":"A model can repeat the same wrong completion."},"plain":"N18 asks a controlled stability question about Stable Diffusion: when the case, prompt and generation settings stay fixed and only the random seed changes, how different are the four resulting completions? The answer is empirical disagreement, not model confidence.","population":["There are 780 complete uncertainty groups over 480 canonical cases.","Each group contains four seeds—2026, 2027, 2028 and 2029—giving 3,120 candidates.","Four candidates yield six unordered pairs per group, so 4,680 candidate pairs are measured; 480 groups use the generic prompt and 300 thin-scratch groups use the damage-aware prompt."],"walkthrough":["Hold painting, case, prompt arm and generation configuration fixed; change only the seed.","Calculate pixel-space standard deviation across the four candidates with population convention ddof=0.","Compare every unordered seed pair with RGB MAE/RMSE and LPIPS, CLIP and DINO feature distances on valid regions.","Summarize one row per group for later association with reference-quality evidence; do not let the six pairs masquerade as six independent paintings.","Keep generic and scratch-aware prompt populations explicit and do not fit a calibrated confidence model or combined uncertainty index."],"terms":[["Seed","A fixed starting number controlling the stochastic choices made during generation."],["Uncertainty group","Candidates for the same case and configuration that differ only in seed."],["Empirical disagreement","Observed variation among repeated outputs; it is not a probability that any output is wrong."],["Unordered pair","A comparison such as seed 2026 versus 2027 counted once, not again in reverse."],["ddof=0","The population-standard-deviation convention used because the four configured seeds are the complete repeated set being summarized."],["Nested observations","Multiple rows arising from one painting or group rather than independent new paintings."]],"why":"Changing one factor at a time makes seed sensitivity interpretable. Keeping pairwise, pixel and feature evidence separate prevents a convenient but unvalidated uncertainty score.","validation":["All 150 validation checks passed.","The notebook produces 124,800 uncertainty rows plus 780 calibration-input rows; no fitted calibration model is claimed.","Median masked RGB standard deviation is 0.0542 for generic prompts and 0.0526 for scratch-aware prompts, while reference errors and seams do not uniformly favour the scratch prompt.","Telea, LaMa and HINT are deterministic in this study, and bounded SDXL has one seed per case; repeated-seed uncertainty is therefore N/A for them."],"evidence_reading":["Confirm that only seed changes inside a group.","Read low disagreement as repeatability under the tested seeds—not correctness.","Treat correlations with error as descriptive associations, not calibrated risk estimates."],"overclaims":["The map is calibrated model confidence.","Agreement proves correctness and disagreement proves error.","The six pairs are six independent experimental units.","Stable Diffusion results describe deterministic or single-seed methods."],"practice":[{"prompt":"How many unordered pairs come from four seeds?","choices":["4","6","12"],"answer":1,"why":"The unique pairs are 4×3÷2 = 6."}],"quiz":[{"prompt":"What must stay fixed in a valid uncertainty group?","choices":["Case, prompt and generation configuration","Only category","Nothing except image size"],"answer":0,"why":"Seed is the sole intended change."},{"prompt":"Low disagreement establishes…","choices":["Repeatability under tested seeds","Historical correctness","Calibrated confidence"],"answer":0,"why":"A consistently wrong completion can also have low disagreement."}]},{"key":"n19","label":"19","title":"Spatial disagreement maps","phase":"Evidence construction","purpose":"Localize repeated-seed disagreement and view it beside reference, texture, colour and seam evidence.","inputs":["N18 groups","four restored candidates","N16/N17 linked diagnostics"],"method":["Compute float uncertainty maps then archive compactly.","Use a global content p99.5 visual scale.","Render heatmaps, overlays and selected multi-evidence panels."],"decisions":["Outside-mask black reflects exact-mask compositing, not global certainty.","Numeric maps remain unclipped; visualizations are clipped.","Uncertainty and error are linked but never merged."],"facts":[["780","numeric maps"],["780","overlays"],["15","selected explanation panels"]],"claim":"Disagreement is strongly localized to the modified region and can prioritize human inspection.","limit":"The maps are not confidence maps, correctness maps or universal explanations.","asset":"n19","source":"outputs/19_uncertainty_and_spatial_explanation_maps/metrics/spatial_explanations.csv","lab":{"prompt":"Why is the outside-mask area black?","choices":["Perfect model certainty everywhere","Exact compositing makes all seed outputs identical there","Missing data"],"answer":1,"why":"The pipeline preserves context pixels by construction."},"check":{"prompt":"What should a hot region trigger?","choices":["Automatic rejection","Closer inspection","A historical claim"],"answer":1,"why":"It marks empirical disagreement, not verdict."},"plain":"N19 takes N18's group-level seed variation and turns it into inspectable spatial maps. It shows where the four Stable Diffusion candidates disagree while keeping uncertainty separate from reference error, colour, texture and seam evidence.","population":["The same 780 groups, 480 cases and 3,120 candidates are used.","Outputs include 780 numeric uncertainty maps, 780 panels, 780 overlays and 4,680 region-summary rows.","The map manifest contains 6,255 linked or owned assets; only 15 panels are deliberately selected as teaching examples."],"walkthrough":["At each pixel, calculate RGB standard deviation across the four restored candidates, then average the three channel deviations.","Compute in float32 and archive a compressed float16 copy after checking that maximum quantization error stays within 0.0005.","Summarize mean, median, p95, maximum and nonzero fraction over full, content, mask, crop, boundary and outside regions.","Use one global content p99.5 display scale with the magma palette and 0.72 overlay transparency.","Show seed 2026 as visual context and link—not merge—reference error and local-feature maps from N16/N17."],"terms":[["Uncertainty map","A per-pixel picture of variation across repeated candidates."],["Representative seed","One fixed candidate displayed to provide image context; it is not selected as the best output."],["Boundary concentration","The extent to which disagreement collects near the mask edge."],["Quantization","Storing values at lower precision to save space after verifying the introduced numerical error."],["Linked asset","An upstream evidence file referenced in this notebook rather than recalculated."],["p95","The value below which 95% of observations fall; useful for describing the high end without using only the single maximum."]],"why":"A group average says how much outputs vary; a map says where they vary. The exact same uncertainty values are not allowed to become an error or confidence score merely because they are colourful.","validation":["All 149 validation checks passed.","The N18 numeric alignment maximum error is about 1.96×10⁻⁸, far below the 10⁻⁶ tolerance.","Median map means are highest inside masks (about 0.0542 generic and 0.0526 scratch-aware) and exactly zero outside by construction.","The artifact contract reconciles 2,481 canonical files."],"evidence_reading":["Bright pixels identify locations where the four candidates differ.","An outside region of zero occurs because all candidates preserve those pixels exactly; it does not prove global certainty.","Use the selected panels as examples and return to population summaries for general claims."],"overclaims":["A bright pixel is known to be wrong.","A black pixel is proven correct.","The 15 selected panels estimate population prevalence.","Float16 storage means the analysis was computed at low precision."],"practice":[{"prompt":"Why is the outside-mask uncertainty map black?","choices":["Exact compositing makes every seed identical there","The model is omniscient there","Those pixels were deleted"],"answer":0,"why":"Protected context is copied identically by construction."}],"quiz":[{"prompt":"What does a bright masked pixel prove?","choices":["The candidates disagree there","The restoration is wrong","The model is 90% uncertain"],"answer":0,"why":"It establishes variation only."},{"prompt":"Why calculate float32 but archive float16?","choices":["Reliable computation with smaller validated storage","To increase disagreement","Because maps are binary"],"answer":0,"why":"The compact archive is accepted only after a quantization-tolerance check."}]},{"key":"n20","label":"20","title":"Local semantic and structural proxies","phase":"Evidence construction","purpose":"Measure local feature consistency and spatial layout without claiming object or style understanding.","inputs":["CLIP 7×7 grid","DINOv2 16×16 grid","content/crop and mask overlap"],"method":["Compare local restored-to-clean patch cosine.","Measure worsened fraction and outside-context change.","Compare DINO affinity maps, covariance and CLIP–DINO agreement."],"decisions":["Inputs are letterboxed to 224 with model-mean padding.","Mask-token overlap is area-weighted.","CLS-to-patch affinity is explicitly a proxy, not saliency truth."],"facts":[["447,312","metric rows"],["63,216","numeric bundles"],["9,304","panels"]],"claim":"LaMa best preserves local DINO and reference-affinity proxies overall.","limit":"These do not detect objects, anatomy, iconography, art style or historical correctness.","asset":"n20","source":"outputs/20_semantic_and_structural_consistency/metrics/semantic_structural_metrics.csv","lab":{"prompt":"Which encoder gives the finer token grid?","choices":["CLIP 7×7","DINOv2 16×16","They are identical"],"answer":1,"why":"DINOv2 provides the denser local structural grid."},"check":{"prompt":"Can affinity correlation prove correct iconography?","choices":["Yes","No","Only above .95"],"answer":1,"why":"It is a feature-layout proxy, not iconographic validation."},"plain":"N20 compares small spatial patches using CLIP and DINOv2 features. It adds semantic and structural proxies that can reveal local drift missed by RGB metrics, but it does not directly measure style correctness, iconography, anatomy or authenticity.","population":["All 2,620 cases and 16,404 candidates are included.","Each encoder receives 31,608 compatible candidate-region evaluations; the final metric table contains 447,312 rows.","The artifact population contains 63,216 numeric map bundles and 9,304 primary nonzero panels, with 15 representatives."],"walkthrough":["Letterbox each content or crop image to 224 × 224 while preserving aspect ratio and using the model's mean colour for padding.","Encode CLIP ViT-B/32 as a 7 × 7 patch grid and DINOv2 ViT-S/14 as a 16 × 16 patch grid; exclude padding-only tokens.","Weight patch scores by how much each token overlaps the declared mask, crop or context region.","Measure clean-versus-damaged, clean-versus-restored and restored-versus-damaged feature relations; for DINO also compare class-token-to-patch affinity patterns.","Archive numeric maps and keep CLIP and DINO evidence separate—there is no face detector, object detector, occlusion-sensitivity routine or combined score."],"terms":[["Token grid","A spatial array of feature vectors, one for each image patch processed by the encoder."],["Letterbox","Resize without stretching and add centred padding to reach the required square input."],["Cosine similarity","Alignment between feature vectors; higher means more similar in that feature space."],["Affinity map","A map showing how strongly DINO's global image token relates to each patch."],["Jensen–Shannon divergence","A bounded measure of difference between two distributions; lower means more similar."],["Covariance distance","A measure of how the spread and relationships among feature dimensions changed."]],"why":"CLIP and DINO attend to complementary information and operate at different patch resolutions. Their agreement or disagreement is useful evidence only if the exact encoder, region and direction remain visible.","validation":["All 181 validation checks passed.","The semantic-map manifest contains 72,520 records and the candidate-region metric table contains 447,312 rows.","Archive error stays within 0.0005 and no combined score or final flag is constructed here.","Outside-context tokens have zero mask overlap by policy; zero-control cases correctly omit a damage bounding box."],"evidence_reading":["Higher local similarity means closer pretrained-feature alignment to the clean reference.","Use outside-context change to detect feature drift in protected context.","Read DINO affinity measures as structural proxies, not proof that depicted meaning is correct."],"overclaims":["CLIP validates art-historical style or iconography.","DINO proves anatomically correct or authentic content.","Low feature drift guarantees a plausible or correct fill.","Different grid resolutions make one encoder automatically superior."],"practice":[{"prompt":"Why are the CLIP and DINO maps different resolutions?","choices":["Their vision architectures use different patch grids","One image is damaged","DINO is a colour metric"],"answer":0,"why":"CLIP yields 7×7 and DINOv2 16×16 grids at the declared input size."}],"quiz":[{"prompt":"Which phrase is scientifically safer?","choices":["Style correctness","Pretrained feature-space similarity","Historical truth"],"answer":1,"why":"The encoders provide general-purpose proxy evidence."},{"prompt":"What does outside-context change test?","choices":["Feature drift where the mask should not act","Only runtime","Painting age"],"answer":0,"why":"It checks protected-context stability in feature space."}]},{"key":"n21","label":"21","title":"Multi-model comparison","phase":"Comparison & focused studies","purpose":"Compare methods on matched cases while keeping evidence families independent and selection metric-free.","inputs":["four full-run methods","24 completed SDXL cases","11 predeclared quality anchors"],"method":["Select one candidate per method–case without looking at metrics.","Normalize 11 anchors and give one vote per evidence family.","Check leave-one-painting-out stability."],"decisions":["Runtime and uncertainty are not quality votes.","CLIP and DINO share one family vote.","SDXL is a bounded descriptive branch, not a fifth full-run model."],"facts":[["10,480","matched core candidates"],["11","anchors"],["10 / 11","LaMa anchor wins"]],"claim":"LaMa is the strongest overall reference-based baseline, while Telea wins crop SSIM and disagreements remain substantive.","limit":"No ranking establishes conservation suitability; the 24-case SDXL result cannot generalize.","asset":"n21","source":"outputs/21_multi_model_comparison/reports/multi_model_comparison.html","lab":{"prompt":"Why not give 352 metric columns 352 votes?","choices":["It is slow","Correlated evidence would dominate by volume","Metrics are missing names"],"answer":1,"why":"Family-level voting prevents overcounting repeated variants of one idea."},"check":{"prompt":"Is there a universal best method?","choices":["Yes, LaMa","No","Yes, SDXL"],"answer":1,"why":"The answer depends on metric, region, damage and scope."},"plain":"N21 brings the evidence families together for a matched method comparison. It uses preregistered anchor metrics and one vote per evidence family so hundreds of related columns cannot overwhelm the conclusion, but it deliberately refuses to create one universal quality score.","population":["The metric-independent comparison contains one candidate for each of four full methods over 2,620 cases: 10,480 candidates.","The bounded SDXL comparison contains 24 cases × five methods: 120 candidates, giving 10,504 selected candidates overall.","The notebook normalizes 3,160,618 evidence rows, builds 277,319 model-comparison rows and analyzes 2,181 disagreement rows over 201 scopes."],"walkthrough":["Select candidates without looking at their metric values—no best-seed or prompt cherry-picking.","Use eleven preregistered anchor measures spanning pixel, perceptual, feature, spatial, texture, colour and seam evidence.","Rank methods only within the same matched cases and evidence definition; use average ranks for ties within 10⁻¹².","Give one vote to each eligible evidence family rather than one vote to every correlated metric column.","Remove each painting in turn and rerank to check whether one artwork controls the winner; keep runtime and uncertainty outside quality voting."],"terms":[["Anchor metric","A predeclared representative measurement used to summarize one evidence question."],["Evidence family","A group of related measurements counted once in voting so a large family does not dominate."],["Metric-independent selection","Choose the candidate using experimental role rather than looking for the most favourable score."],["Average tie rank","Methods within the numerical tie tolerance receive the average of their occupied ranks."],["Leave-one-painting-out","Repeat the ranking after removing each painting to test dependence on one artwork."],["Bounded subset","A deliberately small feasibility population whose result must stay descriptive."]],"why":"The synthesis is interpretable only if matched populations, metric direction and family balance are explicit. Disagreement between anchors is evidence about trade-offs, not a nuisance to hide.","validation":["All 187 validation checks passed.","LaMa wins 10 of 11 saved anchors; Telea wins crop SSIM. Ten anchors use 2,320 nonzero paired cases, while content structural affinity uses 2,620 cases including 300 identity controls. These overall means are case-weighted, not equal-painting means.","Across ten eligible evidence families, LaMa wins nine and Telea one; leave-one-painting-out winner stability is 1.0 for all core anchors.","In the 24-case bounded SDXL branch, LaMa wins eight families, Telea and Stable Diffusion one each, and SDXL wins none; this remains descriptive."],"evidence_reading":["Read each anchor's direction and region before its rank.","Use the family vote as a bounded synthesis policy, not as a hidden quality score.","Decode legacy IDs carefully: core_three_model contains four methods, while sdxl_four_model_subset contains five.","Eleven saved anchors contain ten distinct scalar quantities: masked MAE equals mean masked spatial error. LaMa's 10/11 anchor wins therefore mean 9/10 distinct-scalar wins, not eleven independent confirmations. Spatial maps still add localization. See docs/errata/2026-10-03/README.md for the corrected T04/T05 scope."],"overclaims":["LaMa is universally best for every painting, condition and purpose.","The 24-case SDXL result generalizes to the full benchmark.","All 352 metric IDs should cast independent votes.","Reference fidelity or benchmark rank equals conservation suitability."],"practice":[{"prompt":"Why not give all 352 metric IDs one vote each?","choices":["Related families would be overweighted","The computer cannot count them","Only runtime matters"],"answer":0,"why":"Family voting limits influence from correlated or densely specified evidence."}],"quiz":[{"prompt":"Which anchor did Telea win in the core comparison?","choices":["Crop SSIM","Masked MAE","Crop LPIPS"],"answer":0,"why":"Telea's crop SSIM win is an important exception to LaMa's overall lead."},{"prompt":"Why exclude runtime and seed disagreement from quality voting?","choices":["Feasibility, stability and reference fidelity are different dimensions","They are missing","They always favour Telea"],"answer":0,"why":"The framework preserves conceptual separation."}]},{"key":"d02","label":"D02","title":"Portrait anatomy audit","phase":"Comparison & focused studies","purpose":"Test whether hand-overlapping damage is harder than matched non-anatomical damage and explore rendered skin lightness responsibly.","inputs":["60 screened portraits","manual anatomy regions","existing N09–N21 evidence"],"method":["Gate cases by hand overlap and same-case matched controls.","Match control pixels on texture, gradient, density and boundary depth.","Collapse seeds before painting-level analysis; add blinded visual review."],"decisions":["Skin lightness is clean-reference CIELAB L*, not race or identity.","Sparse MAE/ΔE use exact pixels; SSIM uses a contiguous crop.","Painting is the independent unit; 2,000 clustered bootstraps and BH are used."],"facts":[["45","hand-hit cases"],["20","paintings"],["10 / 12","significant hand penalties"]],"claim":"Within this benchmark, hand-overlapping damage is generally harder than matched non-anatomical damage.","limit":"The curated portrait subset and rendered-lightness proxy cannot establish demographic bias, identity or fairness in general.","asset":"d02","source":"outputs/d02_portrait_skin_tone_and_hand_restoration_audit/reports/portrait_skin_tone_and_hand_audit.html","lab":{"prompt":"Which conclusion is permitted?","choices":["The models are racially biased","Hands were harder in this controlled audit","Dark skin always restores worse"],"answer":1,"why":"The study supports an anatomy difficulty result, not identity or demographic inference."},"check":{"prompt":"Why match a same-case control?","choices":["To compare equally sized non-anatomical damage in similar context","To increase sample size","To create a trust score"],"answer":0,"why":"Matching isolates anatomy better than an arbitrary image region."},"plain":"D02 answers two focused supervisor questions using existing evidence: are damaged hands harder to restore than comparable non-hand regions, and is performance associated with rendered skin lightness? It does not generate new masks or restorations and it never treats image brightness as race or identity.","population":["Sixty portrait-category paintings are screened outcome-blind; the source evidence includes canonical, damage-size, robustness and degradation cases.","The gated hand audit contains 45 hand/control cases from 20 independent paintings and 1,638 comparison rows.","The exploratory lightness audit contains 2,760 rows, 30 profile paintings and ten matched context pairs; 32 candidates receive blinded manual review."],"walkthrough":["Annotate visible faces, skin, left/right hands and other exposed body parts before viewing restoration outcomes.","Keep a case only when at least 256 damaged pixels overlap the anatomical region, at least 5% of that region is affected and all preregistered population gates pass.","For every eligible hand region, find an area-matched non-hand control in the same case with similar texture, gradient, damage density and boundary depth.","Use sparse MAE/RMSE/PSNR/ΔE00/lightness/chroma measures on exact pixels and SSIM/LPIPS/CLIP/DINO on a contiguous crop; collapse repeated Stable Diffusion seeds before painting-level inference.","Estimate hand-minus-control effects by resampling paintings 2,000 times and apply Benjamini–Hochberg correction; separately describe clean-region CIELAB L* without inferring demographic identity."],"terms":[["Outcome-blind selection","Define annotations and eligibility before seeing which restoration looks successful."],["Anatomical annotation","A polygon drawn around a visible body region such as a hand or face."],["Matched control","A comparable non-anatomical region from the same damaged case."],["Cluster bootstrap","Resample whole paintings so dependent cases from one painting stay together."],["Benjamini–Hochberg correction","A multiple-testing adjustment that controls the expected false-discovery share among declared findings."],["Rendered lightness","CIELAB L* brightness measured from the supplied digital image; it is not race, ethnicity or identity."]],"why":"Same-case matching reduces obvious contextual differences, painting-level inference protects independence and manual review can reveal malformed fingers that aggregate scores overlook.","validation":["All 99 validation checks passed.","All twelve primary method-by-metric hand effects were positive and ten survived BH correction.","In blinded inspection, 25 of 32 candidates had at least one anatomical failure.","Of 24 adjusted lightness associations, zero were clearly positive, three clearly negative and 21 crossed zero; no general model-bias conclusion is supported."],"evidence_reading":["A positive hand-minus-control penalty means the hand region was harder under that metric and matched design.","Compare methods per metric: Stable Diffusion has the smallest ΔE00 and RGB-MAE penalties, while Telea has the smallest SSIM penalty.","Treat the rendered-lightness analysis as exploratory, noncausal and explicitly non-demographic."],"overclaims":["The audit establishes racial or demographic bias.","Rendered L* identifies race or ethnicity.","Ten corrected findings prove hands are universally harder in real conservation.","A candidate passing aggregate metrics cannot have malformed anatomy."],"practice":[{"prompt":"Why use a matched region from the same case?","choices":["To compare hand damage with similar non-hand context","To increase image count","To infer identity"],"answer":0,"why":"Same-case matching better isolates anatomy from context."}],"quiz":[{"prompt":"A positive hand-minus-control penalty means…","choices":["Hands performed worse under that defined measure","The model is demographically biased","The hand annotation is invalid"],"answer":0,"why":"The effect is anatomical and benchmark-bounded."},{"prompt":"Why is painting the independent unit?","choices":["Cases and seeds from one artwork are repeated observations","Paintings are larger files","Only paintings have colour"],"answer":0,"why":"Inference must not count dependent rows as new artworks."}]},{"key":"n22","label":"22","title":"Damage-size uncertainty extension","phase":"Comparison & focused studies","purpose":"Add the missing Stable Diffusion seeds to the seven-level damage-size trajectories.","inputs":["245 N05 cases","seed-2026 anchors","three new seeds per group"],"method":["Generate seeds 2027–2029 under the fixed SD1.5 configuration.","Create four-seed groups and six unordered pairs.","Compute the N18 disagreement suite plus selected seed-2026 reference evidence."],"decisions":["35 paintings × 7 levels = 245 groups.","Only seed 2026 has the full reference-quality suite.","Damage level and seed are nested within painting."],"facts":[["980","candidates"],["735","new restorations"],["1,470","seed pairs"]],"claim":"RGB and LPIPS disagreement generally rise with damage size, while DINO and painting-level trajectories can be nonmonotonic.","limit":"This 35-painting extension is not a correctness calibration or a full-population estimate.","asset":"n22","source":"outputs/22_damage_size_diffusion_uncertainty_extension/metrics/damage_size_uncertainty.csv","lab":{"prompt":"How many new candidates were required?","choices":["980","735","245"],"answer":1,"why":"Seed 2026 already existed; three additional seeds ×245 groups =735."},"check":{"prompt":"What is nested?","choices":["Painting inside seed","Damage level and seed inside painting","Model inside metric"],"answer":1,"why":"Inference must respect the repeated trajectory design."},"plain":"N22 fills the damage-size uncertainty gap. For each of 35 paintings it follows seven nested mask sizes and creates a complete four-seed Stable Diffusion group, while preserving the original seed-2026 candidate as a frozen anchor.","population":["Thirty-five paintings—seven per visual category—are followed through seven target damage levels: 2, 4, 6, 8, 10, 15 and 20 percent.","This gives 245 groups and 980 candidates; 245 seed-2026 anchors already existed and 735 candidates are newly generated for seeds 2027–2029.","Each group contributes six unordered pairs, giving 1,470 pairs; the metric table contains 29,400 uncertainty rows plus 3,920 anchor reference rows."],"walkthrough":["Verify each frozen seed-2026 image by path and checksum rather than regenerating it.","Generate seeds 2027–2029 with the exact same SD1.5, DDIM, 30-step, guidance-7.5, strength-1.0 and generic-prompt contract; allow one exact-seed retry only.","Run inference at 512 × 512, return to 768 × 768 and composite the output so pixels outside the binary mask remain unchanged.","Measure pixel standard deviation and all six RGB/LPIPS/CLIP/DINO seed-pair distances across the declared regions.","Treat the seven levels as a nested trajectory inside each painting; only the frozen anchor receives the full sixteen reference-quality specifications."],"terms":[["Frozen anchor","An existing seed-2026 output reused unchanged and reverified by checksum."],["Nested trajectory","Several ordered damage levels measured on the same painting."],["Target versus realized damage","The requested coverage compared with the exact mask fraction actually achieved."],["Fixed generation contract","Every generation setting stays identical except the seed."],["Checksum","A digital fingerprint used to verify that a file has not changed."],["CUDA","The NVIDIA GPU computing platform used here; results need not be byte-identical across all hardware and software environments."]],"why":"Reusing the anchor preserves comparability with earlier notebooks, while three new seeds complete the four-candidate group without pretending every candidate has the same reference-metric coverage.","validation":["All 236 validation checks passed with 245 complete groups and zero invalid groups.","All 245 frozen anchors passed checksum re-verification; 735 new PNGs and 988 canonical files reconcile.","From 2% to 20% damage, median masked RGB SD rises from about 0.0683 to 0.1029 and crop LPIPS disagreement from 0.2667 to 0.3357.","DINO distance is not monotonic at every intermediate level; this is a result, not a validation failure."],"evidence_reading":["Follow each painting's trajectory rather than comparing all 245 rows as independent.","Separate the full uncertainty evidence from the reference-quality suite available only for seed 2026.","Read generally rising disagreement as a stability result, not proof of falling correctness."],"overclaims":["All 980 candidates received the complete reference metric suite.","Greater seed disagreement proves greater restoration error.","The 35-painting cohort estimates category or style effects.","The CUDA run will be byte-identical on every machine."],"practice":[{"prompt":"Why were 735 rather than 980 images newly generated?","choices":["The 245 seed-2026 anchors already existed","Only three categories ran","One seed failed"],"answer":0,"why":"Three new seeds ×245 groups =735."}],"quiz":[{"prompt":"Which candidates receive the full reference-quality suite?","choices":["Only the frozen seed-2026 anchors","All four seeds","Only seed 2029"],"answer":0,"why":"The extension's additional seeds are uncertainty evidence."},{"prompt":"A non-monotonic DINO trajectory means…","choices":["Learned-feature disagreement did not rise at every step","Validation failed","The masks are missing"],"answer":0,"why":"Real trajectories need not be perfectly monotonic."}]},{"key":"n23","label":"23","title":"Damage-size sensitivity analysis","phase":"Comparison & focused studies","purpose":"Estimate how quality and disagreement change as matched damage grows.","inputs":["35 trajectories","980 primary candidates","N13–N22 evidence"],"method":["Use painting-level Theil–Sen slopes per +10 percentage points.","Use 5,000 painting-cluster bootstraps and 100,000 sign flips with BH.","Retain anchor trajectories and family-balanced ranks separately."],"decisions":["Seven inferential anchors; eleven descriptive anchors.","Painting trajectory—not candidate—is independent.","Stable Diffusion uncertainty uses 245 four-seed groups."],"facts":[["35","independent trajectories"],["245","cases"],["LaMa","rank 1 at all 7 sizes"]],"claim":"LaMa has the least-adverse slope on five anchors; all five SD disagreement measures rise, four after correction.","limit":"The 35 synthetic trajectories do not establish universal damage thresholds or style effects.","asset":"n23","source":"outputs/23_damage_size_sensitivity_analysis/reports/damage_size_analysis.html","lab":{"prompt":"What is n for the slope inference?","choices":["980 candidates","245 cases","35 painting trajectories"],"answer":2,"why":"Repeated sizes and methods do not create independent paintings."},"check":{"prompt":"An adverse slope means…","choices":["Performance degrades as damage grows","The model is always bad","The metric is invalid"],"answer":0,"why":"It describes trajectory direction under the controlled intervention."},"plain":"N23 follows the same 35 paintings through seven nested damage sizes and asks how quality and Stable Diffusion disagreement change as the missing region grows.","population":["35 independent painting trajectories contain 245 matched cases.","Four full methods produce 980 primary candidates.","Stable Diffusion contributes 245 four-seed groups and 1,470 unordered seed pairs."],"walkthrough":["Keep each painting and mask lineage matched across 2%, 4%, 6%, 8%, 10%, 15% and 20% damage.","Calculate eleven descriptive quality anchors and retain seven predeclared anchors for inferential testing.","Estimate a robust Theil–Sen trend within each painting and report it per ten percentage points of added damage.","Resample whole paintings 5,000 times for intervals and use 100,000 matched sign flips for paired method contrasts.","Apply Benjamini–Hochberg correction and keep disagreement measures separate from quality ranks."],"terms":[["Nested design","The same painting is measured repeatedly at ordered damage sizes."],["Theil–Sen slope","A robust trend estimate based on the median slope between pairs of observations."],["Cluster bootstrap","Resample whole paintings while keeping each painting's repeated rows together."],["Sign-flip test","A paired test that repeatedly reverses within-pair differences to test whether direction is systematic."],["Rank-biserial effect","A paired effect size showing how consistently one method beats another."],["BH/FDR correction","A multiple-testing adjustment controlling the expected share of false discoveries among declared findings."]],"why":"Treating 245 sizes as independent would exaggerate evidence. The inferential unit is the 35 paintings, while damage levels and seeds remain nested observations.","validation":["All 124 checks passed; the run and completion gate are complete.","The analysis table contains 7,035 rows, with three figures and one HTML report registered.","All 35 trajectories, 245 cases, 980 candidates and 1,470 seed pairs reconcile.","LaMa ranked first at all seven sizes; four of five rising disagreement trends survived correction."],"evidence_reading":["Follow slopes rather than treating each size as a separate experiment.","An adverse quality slope means reference-based performance worsens as synthetic damage grows.","Rising seed disagreement marks greater instability, not a calibrated probability of error."],"overclaims":["There are 245 independent paintings.","A rising disagreement curve proves increasing incorrectness.","The 35-painting cohort establishes a universal damage threshold."],"practice":[{"prompt":"What is the independent unit for N23 inference?","choices":["980 candidates","245 cases","35 painting trajectories"],"answer":2,"why":"Sizes and methods are repeated observations within paintings."}],"quiz":[{"prompt":"What does a Theil–Sen slope summarize?","choices":["A robust within-trajectory trend","One candidate's score","GPU runtime"],"answer":0,"why":"It estimates how evidence changes as damage increases."},{"prompt":"Why exclude seed disagreement from the quality rank?","choices":["It measures stability, not fidelity","It is unavailable","It always favours LaMa"],"answer":0,"why":"Quality and stochastic stability are distinct questions."}]},{"key":"n24","label":"24","title":"Mask robustness analysis","phase":"Comparison & focused studies","purpose":"Measure sensitivity to five plausible area-matched mask variants.","inputs":["105 groups","525 cases","2,100 candidates"],"method":["Compute within-group median absolute deviation as primary dispersion.","Use cluster bootstrap, sign flips and BH for paired model contrasts.","Track winner changes across variants."],"decisions":["Thin scratch is 2%, small loss 4.5%, large loss 12.5%.","Family and area are intentionally coupled and cannot be disentangled.","Low dispersion and good quality are different properties."],"facts":[["10 / 11","LaMa lowest-MAD anchors"],["0.636","scratch winner-change fraction"],["105","matched groups"]],"claim":"Reasonable mask changes can change the preferred method even when one model is usually most stable.","limit":"The design tests only controlled variants; it cannot isolate family from damage area.","asset":"n24","source":"outputs/24_mask_robustness_analysis/reports/mask_robustness_analysis.html","lab":{"prompt":"What does the lowest MAD establish?","choices":["Best restoration","Greatest stability across tested masks","Historical accuracy"],"answer":1,"why":"Dispersion is a robustness property, not quality itself."},"check":{"prompt":"Can family and area effects be separated?","choices":["Yes","No","Only for scratch"],"answer":1,"why":"Each family has one fixed target area in this design."},"plain":"N24 tests whether moving or reshaping an area-matched mask changes a model's measured performance or the apparent winner. It therefore studies sensitivity to mask realization, not random diffusion seeds.","population":["35 paintings × three families produce 105 matched robustness groups.","Five variants per group produce 525 cases.","Four full methods produce 2,100 primary candidates."],"walkthrough":["Hold painting, damage family and target area fixed while using the five N06 mask variants.","Use Stable Diffusion's fixed primary prompt and seed 2026 so mask geometry is the intended intervention.","For each method and evidence anchor, calculate within-group spread across the five variants.","Use median absolute deviation as the primary robust spread measure and track whether the winning method changes.","Compare methods with painting-cluster intervals, sign flips, effect sizes and multiple-testing correction."],"terms":[["Mask perturbation","A controlled change to damage position or shape."],["MAD","Median absolute deviation: a robust measure of spread around the median."],["Winner change","A different method leads after the mask realization changes."],["Nested observation","A mask variant belonging to a group and painting rather than being an independent painting."],["Oracle selection","Improperly choosing a candidate after seeing which one scores best."],["Robustness","Stability under declared perturbations, not restoration quality itself."]],"why":"Fixing the Stable Diffusion seed prevents stochastic generation from being confused with mask sensitivity. MAD is less dominated by one extreme variant than ordinary range or standard deviation.","validation":["All 139 checks passed across 105 groups, 525 cases and 2,100 candidates.","The analysis contains 44,847 rows plus two figures and a report.","LaMa had the lowest MAD on ten of eleven anchors; Telea led texture stability.","The median winner-change fraction was 0.6364 for scratches and 0.4545 for both loss families."],"evidence_reading":["Low MAD means a method changes less across the five masks; it does not tell whether the median result is good.","A 0.6364 winner-change fraction means seven of eleven evidence anchors changed leader for the typical scratch group.","Family and target area are coupled here, so their effects cannot be separated."],"overclaims":["The lowest-MAD model is automatically the best restoration model.","This is a repeated-seed uncertainty study.","Family effects are isolated from damage area."],"practice":[{"prompt":"Why use one fixed Stable Diffusion seed?","choices":["To isolate mask variation","To maximize quality","To make SD deterministic forever"],"answer":0,"why":"Only mask geometry should vary in this experiment."}],"quiz":[{"prompt":"What does MAD measure here?","choices":["Within-group dispersion","Historical accuracy","Mean pixel colour"],"answer":0,"why":"It summarizes how much evidence varies across matched masks."},{"prompt":"Can 525 cases be treated as 525 independent paintings?","choices":["Yes","No","Only for Telea"],"answer":1,"why":"Variants are nested inside 35 paintings."}]},{"key":"n25","label":"25","title":"Synthetic-degradation analysis","phase":"Comparison & focused studies","purpose":"Evaluate only the procedural degradations with a valid localized restoration objective.","inputs":["1,155 generated cases","350 eligible cases","four core methods + bounded SDXL"],"method":["Separate eligible localized effects from excluded global/blur effects.","Analyze severity trajectories and water-stain+dirt composition.","Use painting-level clustered inference and family-balanced ranks."],"decisions":["315 eligible singles +35 combined cases.","Excluded cases are not model failures.","Severity is ordinal; affected area is partly family-determined."],"facts":[["1,411","selected candidates"],["350","eligible cases"],["1.505","LaMa family-balanced rank"]],"claim":"LaMa leads the four eligible families; the combined effect is not uniformly harder than each component.","limit":"Procedural RGB degradations are not material chemistry, aging or treatment simulations.","asset":"n25","source":"outputs/25_synthetic_degradation_analysis/reports/synthetic_degradation_analysis.html","lab":{"prompt":"What should happen to global colour-change cases?","choices":["Count them as failed restorations","Keep them as degradation diagnostics outside inpainting","Delete them"],"answer":1,"why":"Eligibility is determined by the objective, not by whether output exists."},"check":{"prompt":"Does water-stain+dirt prove physical synergy?","choices":["Yes","No","Only at severe level"],"answer":1,"why":"It is an ordered computational composition."},"plain":"N25 evaluates only those procedural effects for which localized removal and reconstruction is a defensible task. Global colour and blur effects remain useful degradation evidence but are not mislabeled as failed inpainting.","population":["N07 generated 1,155 degradation cases on 35 paintings.","Only 350 are eligible: 315 single localized cases plus 35 water-stain-and-dirt combinations.","Four full methods provide 1,400 primary candidates; bounded SDXL adds 11, for 1,411 selected candidates."],"walkthrough":["Separate localized water stain, dirt/dust, partial transparency and water-stain-plus-dirt from ineligible global or blur effects.","Use the predeclared primary Stable Diffusion prompt and seed rather than choosing outputs by score.","Compare mild, moderate and severe trajectories within each painting and family.","Analyze the ordered water-stain-plus-dirt combination against its individual components without assuming physical interaction.","Use painting-cluster inference, family-balanced ranks and explicit SDXL bounded coverage."],"terms":[["Eligibility","A rule deciding whether a degradation has a defensible masked-removal objective."],["Compositing integrity","Pixels outside the approved mask remain exactly unchanged."],["Severity trajectory","How evidence changes from mild to moderate to severe settings."],["Synergy","A combined effect stronger than expected from its components; not established merely because a combination is difficult."],["Context candidate","An output retained for context but excluded from the primary quality comparison."],["Ordinal level","An ordered strength label without equal or physically calibrated intervals."]],"why":"Counting ineligible global effects as model failures would answer the wrong question. Eligibility is declared before performance analysis.","validation":["All 129 checks passed; 350 eligible cases and 1,411 selected candidates reconcile.","The analysis contains 34,977 rows, two figures and one report.","LaMa led all four eligible families and eight of eleven anchors.","Water-stain-plus-dirt was harder than dirt alone for all four methods, but harder than water alone for only one."],"evidence_reading":["Check eligibility before interpreting performance.","Zero outside-mask change proves localization integrity, not quality inside the repair.","The mixed result does not justify a general physical-synergy claim."],"overclaims":["The 805 ineligible degradations are failed restorations.","Procedural RGB effects reproduce material deterioration.","Water-stain-plus-dirt proves physical synergy.","Eleven SDXL cases support a population comparison."],"practice":[{"prompt":"Why are only 350 of 1,155 cases evaluated as restoration tasks?","choices":["Only localized effects have a declared removal objective","The others failed to load","Only 350 have paintings"],"answer":0,"why":"Methodological eligibility precedes model performance."}],"quiz":[{"prompt":"What does exact outside-mask equality prove?","choices":["Correct restoration","Compositing integrity","Historical authenticity"],"answer":1,"why":"It proves the method did not alter protected context."},{"prompt":"Does a harder combined effect prove synergy?","choices":["Always","No","Only for LaMa"],"answer":1,"why":"A computational ordered composition does not establish physical interaction."}]},{"key":"n26","label":"26","title":"Grouped statistical analysis","phase":"Comparison & focused studies","purpose":"Consolidate matched evidence with painting-level independence and explicit multiplicity control.","inputs":["10,480 core candidates","24 bounded SDXL candidates","1,025 uncertainty groups"],"method":["Aggregate repeated observations to painting-level summaries.","Use clustered/bootstrap intervals, paired rank-biserial effects and corrected tests.","Assess Friedman/Kendall and rank stability without inventing a combined score."],"decisions":["Seeds, masks, levels, regions and metrics are nested observations.","Prompt arms remain separate populations.","Runtime remains operational evidence, not quality."],"facts":[["9,280","nonzero core candidates"],["63 / 66","significant paired contrasts"],["1.10","LaMa family-balanced rank"]],"claim":"LaMa leads overall family-balanced ranks, but Telea leads scratch-thin anchors and damage context matters.","limit":"Statistical strength inside this benchmark is not external validation or conservation truth.","asset":"n26","source":"outputs/26_grouped_and_statistical_analysis/reports/statistical_analysis.html","lab":{"prompt":"Why aggregate by painting?","choices":["To reduce file size","To avoid treating nested rows as independent","To guarantee significance"],"answer":1,"why":"The painting is the independent observational unit."},"check":{"prompt":"Do more candidate rows mean more independent evidence?","choices":["Yes","No","Only for SDXL"],"answer":1,"why":"Many rows are repeated measurements of the same painting/case."},"plain":"N26 turns the large collection of metric rows into formal matched comparisons without pretending every seed, mask, size, region and metric is a new independent painting.","population":["The matched four-method core contains 10,480 candidates over 2,620 cases.","The nonzero quality core contains 9,280 candidates over 2,320 cases; 1,200 candidates are zero controls.","Repeated evidence is aggregated with painting as the independent observational unit.","Friedman tests and the 66 paired contrasts use only 1,200 canonical nonzero cases: four damage families per painting. For each method/anchor, medians of those four direction-adjusted case values produce one row per painting, giving a 300 × 4 matrix.","Quality/runtime correlations instead retain all 2,320 nonzero cases (1,200 canonical +245 damage-size +525 mask-robustness +350 degradation), reduced to painting/model medians. The archived N26/T10 labels need the 3 October errata; these two populations must not be conflated."],"walkthrough":["Select the same cases for Telea, LaMa, HINT and primary Stable Diffusion without metric-based candidate choice.","For Friedman and paired method contrasts, reduce the four canonical nonzero cases per painting/method to a median. Use the separate all-branch painting/model medians for quality/runtime associations; neither analysis treats candidate rows as independent.","Compare methods with paired intervals, sign flips and matched rank-biserial effect sizes.","Use repeated-measures rank tests, agreement statistics and multiple-testing correction where their assumptions apply.","Stress-test rankings by leaving out paintings, evidence families, regions and zero controls while keeping quality evidence separate from runtime and uncertainty."],"terms":[["Paired comparison","Compare methods on exactly the same underlying cases."],["Independent unit","The unit providing distinct information for inference; here it is the painting."],["Friedman test","A rank-based repeated-measures test comparing several methods on matched units."],["Kendall W","An effect size describing agreement in repeated method ranks."],["Kruskal–Wallis","A rank-based test comparing groups when ordinary normal-model assumptions are unsuitable."],["Sensitivity analysis","Repeat the conclusion under defensible alternative inclusion or aggregation rules."]],"why":"Thousands of candidate and metric rows can create false precision if treated as independent. Painting-level aggregation preserves the repeated design.","validation":["All 111 checks passed; 13,272 statistical rows, 694 metric-correlation rows and 1,344 ranking-stability rows were produced.","Sixty-three of 66 paired contrasts survived FDR correction.","LaMa's family-balanced rank was 1.10 and it remained the winner in every estimable sensitivity run and all 5,000 ranking bootstraps.","Telea still led the thin-scratch family and crop SSIM, preventing a universal-winner statement."],"evidence_reading":["Read effect size and interval alongside significance.","Family-balanced ranking gives each evidence family equal influence rather than rewarding the family with the most columns.","Benchmark stability supports an internal comparison, not external conservation validity.","Use docs/errata/2026-10-03/corrected_statistical_rows.csv for the 77 corrected population labels. The eleven Friedman statistics were verified from saved measurements; the 66 paired bootstrap procedures and 44 runtime correlations were traced, not rerun in the errata."],"overclaims":["10,504 selected candidates are 10,504 independent samples.","LaMa's stable benchmark lead proves universal superiority.","Statistical significance turns computational proxies into expert judgements."],"practice":[{"prompt":"Why aggregate repeated rows by painting?","choices":["To reduce file size","To protect statistical independence","To guarantee significance"],"answer":1,"why":"Repeated observations from one painting are not independent paintings."}],"quiz":[{"prompt":"What does family-balanced ranking prevent?","choices":["Overweighting evidence families with more columns","Missing images","CUDA variation"],"answer":0,"why":"Each evidence family receives equal influence."},{"prompt":"Why inspect leave-one-painting-out results?","choices":["To test dependence on one artwork","To create more data","To rank runtimes"],"answer":0,"why":"A stable conclusion should not hinge on one painting."}]},{"key":"n27","label":"27","title":"Failure taxonomy and review flags","phase":"Review aids","purpose":"Translate heterogeneous evidence into transparent category rules, review flags and bounded recommendations—without a trust score.","inputs":["13,879-candidate union","N13–N26 evidence","failure_taxonomy.yaml"],"method":["Fit directional quantiles on core nonzero candidates only.","Trigger a category with one critical or warnings from two distinct components.","Apply independent flag rules and recommendation precedence."],"decisions":["Higher-worse warning q90/critical q97.5; lower-worse q10/q2.5.","Outside-mask absolute tolerances: 5e−7 warning, 5e−6 critical.","Manual review: any critical, ≥2 domain flags, insufficient evidence or instability."],"facts":[["14","failure categories"],["11","flags"],["0","combined trust scores"]],"claim":"The pipeline produces traceable screening paths from measurement to threshold to rule to recommendation.","limit":"Quantile outliers are not probabilities, expert labels, conservation severity or approval.","asset":"n27","source":"outputs/27_failure_taxonomy_and_trustworthiness_flags/reports/flag_definitions.html","lab":{"prompt":"Does one warning trigger a category?","choices":["Always","No—normally two distinct warning components are needed","Only for Telea"],"answer":1,"why":"One critical is sufficient; otherwise evidence must span two components."},"check":{"prompt":"What numeric trust score produced specialist review?","choices":["0.42","97.5","None—rules produced it"],"answer":2,"why":"Every flag row records is_combined_score=False."},"plain":"N27 converts separate measurements into transparent review cues. It does this with recorded thresholds and rules—not by producing a mysterious trust score or a probability that a restoration is correct.","population":["The explanation union contains 13,879 candidates, including 10,480 core candidates and repeated-seed extensions.","The notebook defines 14 failure categories and 11 review flags.","It produces 194,306 assignment rows and 152,669 flag rows; these rows remain nested evidence, not independent samples."],"walkthrough":["Fit directional thresholds on eligible nonzero core candidates only, excluding zero controls and bounded SDXL.","For higher-is-worse evidence use q90 warning and q97.5 critical; reverse direction to q10 and q2.5 for lower-is-worse evidence.","Trigger a category with at least one critical component or warnings from two distinct components.","Apply named flag rules, including special definitions for instability, metric disagreement and insufficient evidence.","Assign a bounded workflow recommendation using explicit precedence; never calculate a combined trustworthiness score."],"terms":[["Operational threshold","A transparent rule derived from this benchmark's distribution, not a natural or expert-calibrated truth."],["Quantile","A cut point in an ordered distribution; q90 is the value below which 90% of the fitting population falls."],["Warning / critical","Internal evidence-severity bands used by review rules."],["Insufficient evidence","Required inputs are missing; it is not a pass or a low-risk label."],["Flag","A review cue caused by named measurements and rules."],["Calibration","Showing that a numeric output corresponds to real-world risk or correctness; this was not performed."]],"why":"One unusual metric can be noisy, so most categories require warnings from two distinct components. A critical observation can trigger directly. The complete path remains inspectable.","validation":["All 167 checks passed.","Outputs contain 14 category definitions, 194,306 assignments and 152,669 flag rows.","There are 16,840 triggered category assignments and 41,315 triggered flag rows.","Recommendation counts later used downstream are 2,366 do-not-rely, 10,573 specialist-review, 183 unstable and 757 suitable-for-preliminary-inspection."],"evidence_reading":["Trace measurement → fitted threshold → component state → category → flag → recommendation.","A q97.5 threshold means an extreme internal value, not 97.5% probability of failure.","Suitable for preliminary inspection means no higher-priority rule fired in available evidence; it is not approval."],"overclaims":["The pipeline calculates a calibrated trustworthiness score.","q97.5 means 97.5% probability the restoration is wrong.","Suitable for preliminary inspection means conservation-approved.","Insufficient evidence should be interpreted as safe."],"practice":[{"prompt":"Without a critical component, what normally triggers a failure category?","choices":["One warning","Warnings from two distinct components","A slow runtime"],"answer":1,"why":"The baseline rule requires two distinct warning components."}],"quiz":[{"prompt":"What does metric_disagreement require?","choices":["At least two adverse and two favourable evidence sources","One low metric","Two models"],"answer":0,"why":"The flag captures meaningful conflict across evidence sources."},{"prompt":"What numeric trust score produced the recommendation?","choices":["0.5","97.5","None"],"answer":2,"why":"Recommendations come from explicit rules and precedence, not a combined score."}]},{"key":"n28","label":"28","title":"Metric and region ablation","phase":"Review aids","purpose":"Stress-test rankings and flags under alternative evidence, region, threshold and aggregation policies.","inputs":["N21 comparison","N27 flags","23 predeclared scenarios"],"method":["Remove or isolate metric families.","Switch region policies.","Apply more-sensitive/specific thresholds and alternate warning aggregation."],"decisions":["18 scenarios support ranking; all 23 support their declared role.","The baseline is exactly reconstructed before ablation.","A lower flag count after removing evidence can mean blindness."],"facts":[["23","scenarios"],["18","rank-applicable"],["319,217","flag-stability rows"]],"claim":"LaMa remains first across rank-applicable scenarios, while candidate flags are highly policy-sensitive.","limit":"Policy stability is not validation against human labels; fewer flags need not mean better outputs.","asset":"n28","source":"outputs/28_metric_and_region_policy_ablation/reports/ablation_study.html","lab":{"prompt":"Flags fall after removing DINO evidence. What follows?","choices":["Restorations improved","The system may have lost sensitivity","DINO was wrong"],"answer":1,"why":"No image changed; only the available evidence changed."},"check":{"prompt":"Are q90/q97.5 failure probabilities?","choices":["Yes","No","Only after BH"],"answer":1,"why":"They are internal operational quantiles."},"plain":"N28 asks whether N21 rankings and N27 review flags survive reasonable changes to metric families, regions, thresholds and aggregation rules. It changes the evaluation policy—not the restoration images—and therefore measures policy sensitivity rather than image improvement.","population":["The ablation reuses 2,620 matched cases, 10,480 core candidates and 13,879 flag-eligible explanation records, with bounded SDXL kept separate.","There are 23 preregistered scenarios: 12 metric, six region, two threshold and three aggregation scenarios.","Eighteen scenarios support method ranking; all scenarios are used only for their declared purpose, producing 47,508 ablation rows and 319,217 flag-stability rows."],"walkthrough":["Reconstruct the N21 ranking and N27 flag baseline exactly before changing anything.","Remove or isolate one metric family at a time to see whether a densely specified family controls the result.","Change valid region choices to test how mask, crop, content, boundary and context policy affect conclusions.","Apply a more-sensitive threshold policy, a more-specific policy and alternative warning-aggregation rules.","Compare method ranks with rank agreement and compare candidate flags by gained, lost and retained states; never interpret fewer flags as better restorations without external labels."],"terms":[["Ablation","A controlled analysis that removes or changes one design component to test how much it matters."],["Region policy","The declared mapping between each metric and the image area where it is valid."],["Rank correlation","How similarly methods are ordered under two policies."],["Flag stability","Whether the same candidate keeps, gains or loses a review flag when policy changes."],["Tie tolerance","A tiny numerical band within which scores are treated as equal rather than falsely ordered."],["Sensitivity versus specificity","A more-sensitive policy flags more possible issues; a more-specific policy demands more extreme evidence and flags fewer."]],"why":"A stable method ranking and unstable candidate flags can coexist: the first is a population summary, while the second depends on a candidate crossing explicit operational thresholds.","validation":["All 122 validation checks passed.","LaMa remains first in all 18 rank-applicable scenarios; in the classical-only scenario it ties Telea.","Candidate flags are much more policy-sensitive: removing DINO changes 13,834 candidate-flag states, while removing CLIP changes 62.","Higher-is-worse sensitive cut points use q80/q95 around a q30 favourable band; specific cut points use q95/q99 around q20. Lower-is-worse directions are reversed, and outside-mask tolerances remain absolute rather than quantile-based."],"evidence_reading":["First identify which component the scenario changes and which outputs it is allowed to affect.","A lost flag after evidence removal may mean lost detection capability, not image improvement.","Use the baseline reconstruction to confirm that differences come from the declared ablation."],"overclaims":["The scenario with the fewest flags is objectively best.","Stable rankings validate the exact threshold policy.","Removing a metric improves the restorations.","Ablation discovers the one correct universal region policy."],"practice":[{"prompt":"Flags fall after DINO evidence is removed. What changed?","choices":["The images improved","The available policy evidence changed","The models reran"],"answer":1,"why":"Ablation changes evaluation inputs, not restoration outputs."}],"quiz":[{"prompt":"Why can ranks stay stable while flags change?","choices":["Ranks summarize method populations; flags depend on candidate thresholds","The files are corrupt","Flags ignore metrics"],"answer":0,"why":"They answer different levels of question."},{"prompt":"Are q90 and q97.5 failure probabilities?","choices":["Yes","No—internal operational quantiles","Only for SDXL"],"answer":1,"why":"No expert calibration converts them into failure probabilities."}]},{"key":"n29","label":"29","title":"Explainability and case retrieval","phase":"Review aids","purpose":"Expose each recommendation's evidence path and retrieve visually similar context without turning similarity into correctness.","inputs":["N27 explanation union","CLIP and DINO embeddings","seven counterfactual families"],"method":["Link measurements → thresholds → categories → flags → recommendation.","Retrieve separate DINO- and CLIP-neighbour lanes.","Build matched counterfactual panels for model, size, seed, mask, prompt and evidence policy."],"decisions":["13,144 candidates are retrieval-eligible; 735 lack N15 embeddings.","Ten queries × two lanes × five neighbours =100 rows.","Flagged examples can be highly similar to lower-risk examples."],"facts":[["13,879","explanation rows"],["100","neighbour rows"],["14","counterfactual panels"]],"claim":"The review decision is traceable, and retrieval supplies context rather than an automated verdict.","limit":"Visual-feature similarity and counterfactual change do not establish causal or historical correctness.","asset":"n29","source":"outputs/29_explainable_ai_and_case_retrieval/reports/explanation_catalog.html","lab":{"prompt":"Why keep CLIP and DINO neighbour lists separate?","choices":["They use different file types","No validated rule combines their representations","One is always correct"],"answer":1,"why":"Complementary similarity is more honest than an invented blend."},"check":{"prompt":"A highly similar flagged neighbour proves…","choices":["The query is unsafe","Similarity is context, not correctness","The flag is wrong"],"answer":1,"why":"Retrieval should inform inspection, not decide it."},"plain":"N29 makes each review recommendation traceable. It explains which measurements crossed which thresholds, shows what would need to change for another outcome and retrieves similar cases as inspection context—not as proof that a candidate is correct.","population":["The explanation catalogue covers 13,879 candidates, including 10,480 primary core candidates and 9,280 primary nonzero candidates.","Retrieval covers 13,144 candidates; 735 damage-size extension candidates are excluded because the required embeddings were not produced for them.","Ten query cases produce two separate encoder lanes × five neighbours =100 retrieval rows; seven counterfactual families produce 14 panels and 24 selected report units."],"walkthrough":["Trace each outcome through measurement, direction, threshold, component state, failure category, flag and recommendation precedence.","Generate counterfactual explanations by showing how model, damage size, seed, mask, prompt, evidence policy or threshold changes the recorded path.","Create one DINO nearest-neighbour lane and one CLIP lane without blending their scores.","Exclude the query candidate, its case and its painting so retrieval cannot return trivial near-copies from the same experimental unit.","Separate lower-risk and flagged neighbour pools; lower-risk means N27's exact suitable-for-preliminary-inspection recommendation, not ground-truth correctness."],"terms":[["Counterfactual explanation","A transparent 'what would change if…' comparison under one alternate factor or rule."],["Nearest neighbour","The most similar eligible feature vector under one encoder's distance."],["Embedding","A numerical visual representation used for similarity search."],["Recommendation precedence","The order that resolves multiple triggered rules into one bounded workflow recommendation."],["Explanation fidelity","Whether the displayed rationale exactly matches the measurements and rules that produced the outcome."],["Provenance","Recorded origin and processing history linking an explanation back to its evidence files."]],"why":"A recommendation becomes auditable only when its full rule path is visible. Retrieval supplies examples for comparison, but no validated rule turns feature similarity into correctness.","validation":["All 146 validation checks passed.","The catalogue contains exactly 13,879 candidate explanations and retrieval contains 100 neighbour rows.","Only 757 candidates qualify as lower-risk under the exact N27 rules; this label is never renamed safe or correct.","CLIP and DINO lanes remain separate and all same-candidate, same-case and same-painting exclusions pass.","Later closeout retained an artifact-manifest hash discrepancy. The six payload groups were checked, but the exact bytes underlying the later recorded manifest hash remain unrecovered. The original 146 passes are historical checks, not closure of this packaging exception; see docs/provenance_exceptions.md."],"evidence_reading":["Follow the measurement-to-recommendation chain before reading narrative text.","Use counterfactuals to understand policy consequences, not causal truth.","Inspect similar flagged and lower-risk cases side by side; high similarity can coexist with different evidence states."],"overclaims":["The nearest neighbour validates the query's restoration.","Suitable for preliminary inspection means expert-approved.","A counterfactual proves causation.","CLIP and DINO scores can be combined without a validated rule."],"practice":[{"prompt":"Why exclude neighbours from the same painting?","choices":["To avoid trivial dependent matches","Paintings lack embeddings","To increase flag counts"],"answer":0,"why":"Retrieval should provide genuinely separate context."}],"quiz":[{"prompt":"What does a highly similar flagged neighbour establish?","choices":["Similarity is context, not correctness","The query must be flagged","The flag is invalid"],"answer":0,"why":"Similarity and review state are separate evidence."},{"prompt":"Why keep CLIP and DINO lanes separate?","choices":["Their feature spaces have no validated combined scale","One uses PNG","DINO is always correct"],"answer":0,"why":"Separate lanes preserve meaning and provenance."}]},{"key":"n30","label":"30","title":"Model cards, compute and scaling","phase":"Review aids","purpose":"Document intended use, limitations and the difference between observed compute and projections.","inputs":["five method ledgers","recorded runtimes/storage","declared scaling formulas"],"method":["Write one model card per method.","Keep observed 300-painting runtime separate from 600-painting projections.","Project SDXL full-design cost from the bounded subset with sensitivity scenarios."],"decisions":["Projection scenarios are not confidence intervals.","Compute depends on one workstation/software environment.","Runtime and storage do not become quality votes."],"facts":[["5","model cards"],["19.93 h","observed SD total"],["128.6 h","projected full SDXL"]],"claim":"Compute and storage differ by orders of magnitude and materially constrain feasible coverage.","limit":"Projected throughput is not an executed result and may not transfer to other hardware.","asset":"n30","source":"outputs/30_model_cards_compute_and_scalability/metrics/compute_scalability.csv","lab":{"prompt":"Is 128.6 hours measured?","choices":["Yes","No, it is a central projection","It is a confidence bound"],"answer":1,"why":"Only the bounded 24-completion SDXL runtime was observed."},"check":{"prompt":"Should runtime decide restoration quality?","choices":["Yes","No","Only for Telea"],"answer":1,"why":"It informs feasibility, not fidelity or trustworthiness."},"plain":"N30 documents what every method is intended to do, where its evidence applies and what it costs to run. It separates observed runtime and storage from projections so feasibility claims cannot be mistaken for measured quality.","population":["Five methods receive model cards: Telea, LaMa, HINT Places2, Stable Diffusion 1.5 and bounded SDXL.","Telea, LaMa and HINT each cover 2,620 candidates; Stable Diffusion covers 8,520; SDXL scheduled 35 and completed 24, with one timeout and ten budget skips.","The compute table contains 42 rows: 32 observed records and ten projections."],"walkthrough":["Build a card for each method from frozen code, checkpoint, licence, input, intended-use and limitation records.","Reconcile runtime and output bytes from the executed 300-painting ledgers rather than estimates.","Project 600-painting runtime with declared linear formulas for full methods.","Estimate a hypothetical full SDXL design from the bounded observations and show sensitivity scenarios separately.","Keep runtime, memory and storage as operational evidence; never add them to reference-quality votes."],"terms":[["Model card","Structured documentation of a model's identity, intended use, configuration, evidence coverage and limitations."],["Checkpoint","The saved learned parameters loaded by a neural model."],["Runtime ledger","Recorded execution duration tied to actual completed work."],["Projection","An estimate for work not yet executed, based on an explicit scaling assumption."],["Sensitivity scenario","An alternative estimate under a different plausible assumption; it is not a confidence interval."],["Censored run","A scheduled computation whose exact full runtime is unknown because it timed out or was not started under the budget."]],"why":"A transparent benchmark must document both scientific evidence and practical feasibility. Observations and projections are labelled separately because only one was actually measured.","validation":["All 178 validation checks passed.","Observed total runtimes are about 1,447 s Telea, 3,570 s LaMa, 16,026 s HINT and 71,738 s Stable Diffusion; bounded SDXL records about 4,788 s for the partial branch.","At 600 paintings, projections are about 2,644 s Telea
